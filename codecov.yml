# Codecov is the SECONDARY, informational coverage signal for this repo.
#
# The AUTHORITATIVE, BLOCKING coverage gate is the in-CI `Code Coverage` job
# (`cargo llvm-cov --fail-under-lines ${COVERAGE_THRESHOLD:-47}` in
# .github/workflows/ci.yml) — it exits non-zero and fails the build when line
# coverage drops below threshold. That job is the real floor; codecov is the
# dashboard. This config makes that already-documented policy machine-honest so
# codecov's duplicate commit statuses stop contradicting the in-CI gate.
#
#  - project / patch -> informational: codecov reports the numbers as a neutral
#    (non-blocking) status instead of a red X. The real gate stays the in-CI
#    fail-under-lines. Diff (patch) coverage legitimately dips on hardware-
#    integration PRs because the capture-loop wiring, the wall-clock syscall
#    wrapper, and the NDI send path are verified by the on-device loopback E2E
#    (scripts/loopback-e2e.sh, scripts/multitap-e2e.sh), NOT by unit tests. The
#    genlock DECISION logic those drive IS unit + mutation tested
#    (src/ndi.rs::genlock_emit_gate). Same rationale as the mutants/coverage
#    exclusions for that same glue.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# Mirror the in-CI `--ignore-filename-regex` so codecov's numbers match the
# authoritative gate: probe modules (painter/reader/run/fb/multi_reader) and the
# probe binaries drive /dev/fb0 + NDI and are covered by the on-device E2E, not
# unit tests.
ignore:
  - "src/probe/painter.rs"
  - "src/probe/reader.rs"
  - "src/probe/run.rs"
  - "src/probe/fb.rs"
  - "src/probe/multi_reader.rs"
  - "src/bin/frame-probe.rs"
  - "src/bin/multitap-probe.rs"
