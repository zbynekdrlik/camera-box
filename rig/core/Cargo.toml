[package]
name = "rig-core"
version.workspace = true
edition = "2021"
description = "The rig primitives camera-box and the JPEG XS link share: the per-second genlock grid (the Rust authority of the vendored C header), thread affinity + realtime, the IRQ offload decision, the CAM<N> hostname parser"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
tracing = "0.1"

# Linux only, like the affinity module that uses it (sched_setaffinity, sched_setscheduler).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
