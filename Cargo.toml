[package]
name = "camera-box"
version = "1.7.0-dev.5"
edition = "2021"
authors = ["zbynekdrlik"]
description = "Simple USB video capture to NDI streaming appliance"
license = "MIT"
repository = "https://github.com/zbynekdrlik/camera-box"

[lib]
name = "camera_box"
path = "src/lib.rs"

[[bin]]
name = "camera-box"
path = "src/main.rs"

[dependencies]
# V4L2 capture
v4l = "0.14"

# Dynamic library loading (for NDI SDK at runtime)
libloading = "0.8"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Configuration
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# Low-level system calls (real-time scheduling, memory locking)
libc = "0.2"

# Audio I/O for VBAN intercom
cpal = "0.15"
alsa = "0.9"

# Input device events (for power button mute)
evdev = "0.12"

# Frame-loss/latency probe (feature = "probe") — kept out of the production binary
serde_json = { version = "1", optional = true }
crc = { version = "3", optional = true }
qrcode = { version = "0.14", optional = true, features = ["image"] }
rqrr = { version = "0.9", optional = true }
image = { version = "0.25", optional = true, default-features = false }

[dev-dependencies]
# Property-based testing for format conversions
proptest = "1.4"
# Better diff output for byte arrays
pretty_assertions = "1.4"
# Temporary files for config tests
tempfile = "3.9"
# Performance benchmarks
criterion = { version = "0.5", features = ["html_reports"] }

[features]
probe = ["dep:serde_json", "dep:crc", "dep:qrcode", "dep:rqrr", "dep:image"]

[[bin]]
name = "frame-probe"
path = "src/bin/frame-probe.rs"
required-features = ["probe"]

[[bin]]
name = "multitap-probe"
path = "src/bin/multitap-probe.rs"
required-features = ["probe"]

[[bench]]
name = "format_conversions"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
