[package]
name = "camera-box"
version.workspace = true
edition = "2021"
authors = ["zbynekdrlik"]
description = "Simple USB video capture to NDI streaming appliance"
license = "MIT"
repository = "https://github.com/zbynekdrlik/camera-box"

# The appliance is the workspace ROOT and its only member. The [workspace] table carries the one
# version; the bkshading service + relay are the pinned shading release (issue 1487,
# scripts/shading-release.pin). resolver = "2" pins the feature resolution the root edition-2021
# package already used. The `^version = "X"` readers (camera-box-version-gate.sh, recording-e2e.sh,
# rig-status.py) match the line below: it stays the only column-0 `version = "X"` line.
[workspace]
resolver = "2"

[workspace.package]
version = "1.8.8"

[lib]
name = "camera_box"
path = "src/lib.rs"

[[bin]]
name = "camera-box"
path = "src/main.rs"

[dependencies]
# Shared VBAN codec: the appliance's `src/vban.rs` re-exports this crate from the intercom project's
# release (issue 1487). The tag must equal scripts/intercom-release.pin (tests/intercom_pin_1487.rs).
# Pure (only `anyhow`, already a root dep), cross-platform.
intercom-vban = { git = "https://github.com/zbynekdrlik/intercom", tag = "v1.9.19" }

# Issue 1487: the JPEG XS link, the rig primitives and the QPSK marker protocol live in vstack; a
# tag names one version of all of them. src/lib.rs re-exports them at their old paths. The tag must
# equal scripts/vstack-release.pin (tests/vstack_pin_1487.rs). jxs-recv-ffi and jxs-send-ffi are not
# dependencies here: they pull the codec in unconditionally, and a default build needs no cmake.
camera-box-jxs = { git = "https://github.com/zbynekdrlik/vstack", tag = "v0.1.6" }
rig-core = { git = "https://github.com/zbynekdrlik/vstack", tag = "v0.1.6" }
qpsk-marker = { git = "https://github.com/zbynekdrlik/vstack", tag = "v0.1.6" }

# Dynamic library loading (for NDI SDK at runtime)
libloading = "0.8"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Configuration
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# Frame-loss/latency probe (feature = "probe") — kept out of the production binary.
# These are ALL pure-Rust, cross-platform crates, so the #193 probe tooling
# (recording-verdict) builds on Windows too — letting the recording decode run ON
# stream.lan where the video lives, never downloaded to slow dev1.
serde_json = "1"
crc = { version = "3", optional = true }
qrcode = { version = "0.14", optional = true, features = ["image"] }
rqrr = { version = "0.9", optional = true }
# `png` enables PNG encoding for the #107 pixel-proof extraction of flagged
# (undecodable / real-loss) frames; the QR render/decode path needs no codec.
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
# Offline spool mode: lz4 compression for captured frame spool files (probe only).
lz4_flex = { version = "0.11", optional = true }

# Linux-ONLY dependencies (#193). The camera APPLIANCE (v4l capture, ALSA/cpal
# intercom audio, evdev power button) and the probe HARDWARE GLUE (drm/KMS page-flip
# presenter, /dev/fb0 ioctl via libc) only build on Linux — the cameras are x86_64
# Ubuntu. Confining them to cfg(target_os="linux") lets the probe TOOLING
# (recording-verdict) cross-build for Windows without pulling these in, so the #193
# recording decode runs ON stream.lan. The lib modules that USE them are
# cfg(target_os="linux")-gated in src/lib.rs + src/probe/mod.rs in lock-step.
[target.'cfg(target_os = "linux")'.dependencies]
# V4L2 capture
v4l = "0.14"
# Low-level system calls (real-time scheduling, memory locking, /dev/fb0 ioctl)
libc = "0.2"
# Audio I/O for VBAN intercom
cpal = "0.15"
alsa = "0.9"
# Input device events (for power button mute)
evdev = "0.12"
# DRM/KMS page-flip presenter for the tear-free 1:1 painter (#79, Linux-only, probe).
drm = { version = "0.15", optional = true }
# Issue 1387: the JPEG XS link's codec (SVT-JPEG-XS, vendored in vstack and built statically by its
# jxs/sys/build.rs: cmake + nasm). Behind the `jxs` feature so a default build needs neither; CI's
# deployed camera-box-linux-amd64 is built WITH it (ci.yml `build`).
svt-jpegxs-sys = { git = "https://github.com/zbynekdrlik/vstack", tag = "v0.1.6", optional = true }

[dev-dependencies]
# Property-based testing for format conversions
proptest = "1.4"
# Better diff output for byte arrays
pretty_assertions = "1.4"
# Temporary files for config tests
tempfile = "3.9"
# Performance benchmarks
criterion = { version = "0.5", features = ["html_reports"] }

[features]
# `dep:drm` is a target-specific optional dependency (declared only under
# cfg(target_os="linux") above). On Linux the probe feature enables it (the KMS
# page-flip presenter); on a non-Linux target (the #193 Windows recording-verdict
# build) `dep:drm` resolves to nothing because the dependency does not exist there,
# so the probe feature still activates the cross-platform crates (image/rqrr/…) while
# the KMS/fb modules that need drm are cfg(target_os="linux")-gated out.
probe = ["dep:crc", "dep:qrcode", "dep:rqrr", "dep:image", "dep:drm", "dep:lz4_flex"]
# Issue 1387: the JPEG XS link's encoder/decoder (the cambox sender + the jxs-recv-probe bin).
# Linux-only dependency, like drm above: on another target the feature enables nothing.
jxs = ["dep:svt-jpegxs-sys", "camera-box-jxs/jxs"]

[[bin]]
name = "ndi-recv-probe"
path = "src/bin/ndi-recv-probe.rs"

[[bin]]
name = "frozen-camera-gate"
path = "src/bin/frozen-camera-gate.rs"

[[bin]]
name = "render-budget-gate"
path = "src/bin/render-budget-gate.rs"

[[bin]]
name = "mv-fps-gate"
path = "src/bin/mv-fps-gate.rs"

[[bin]]
name = "obs-watchdog-gate"
path = "src/bin/obs-watchdog-gate.rs"

[[bin]]
name = "obs-self-heal-gate"
path = "src/bin/obs-self-heal-gate.rs"

[[bin]]
name = "av-restart-sync-gate"
path = "src/bin/av-restart-sync-gate.rs"

[[bin]]
name = "zero-loss-restart-gate"
path = "src/bin/zero-loss-restart-gate.rs"

[[bin]]
name = "phase-sync-gate"
path = "src/bin/phase-sync-gate.rs"

[[bin]]
name = "phase-sync-active-floor-gate"
path = "src/bin/phase-sync-active-floor-gate.rs"

[[bin]]
name = "genlock-jitter-report"
path = "src/bin/genlock-jitter-report.rs"

[[bin]]
name = "jxs-recv-probe"
path = "src/bin/jxs-recv-probe.rs"
required-features = ["jxs"]

[[bin]]
name = "jxs-encode-bench"
path = "src/bin/jxs-encode-bench.rs"
required-features = ["jxs"]

[[bin]]
name = "frame-probe"
path = "src/bin/frame-probe.rs"
required-features = ["probe"]

[[bin]]
name = "recording-probe"
path = "src/bin/recording-probe.rs"
required-features = ["probe"]

[[bin]]
name = "recording-verdict"
path = "src/bin/recording-verdict.rs"
required-features = ["probe"]

[[bin]]
name = "forensic-dump"
path = "src/bin/forensic-dump.rs"
required-features = ["probe"]

[[bench]]
name = "format_conversions"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
