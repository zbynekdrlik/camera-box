[hub]
bind = "0.0.0.0:8790"
vban_bind = "0.0.0.0:6980"
sample_rate = 48000
block_frames = 256

[janus]
api_url = "http://127.0.0.1:8088/janus"
room = 1000
room_secret_file = "/etc/intercom-hub/janus-room.secret"
rtp_bind = "0.0.0.0:6990"

[video]
ndi_source_name = "STRIH-LX (interkom)"
fps = 10
jpeg_quality = 70
enabled = true

