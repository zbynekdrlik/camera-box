out_channels = 2

[[participant]]
name = "cam7"
role = "cambox"
adapter = "vban"
host = "10.77.9.67"
in_stream = "cam7"
out_stream = "cam7"
target_ms = 16.0
in_channels = 2
out_channels = 2

[[participant]]
name = "lv1"
role = "program_ref"
adapter = "vban"
host = "lv1.lan"
in_stream = "strih"
target_ms = 37.33
in_channels = 2
out_channels = 0

[[participant]]
name = "cutters"
role = "cutters"
adapter = "alsa"
alsa_card = "MGXU"
alsa_device = 0
alsa_period_frames = 256
alsa_out_channels = 2
alsa_in_channels = 2
alsa_channel_map = "1,2"
alsa_in_channel_map = "1,2"
target_ms = 42.67
in_channels = 2
out_channels = 2

[[participant]]
name = "phones"
role = "phones"
adapter = "janus"
in_channels = 2
out_channels = 2

[[participant]]
name = "vestibule"
role = "program_monitor"
adapter = "alsa_hdmi"
hdmi_connector = "HDMI-1"
in_channels = 0
out_channels = 2

# --- the program to the vestibule TV on HDMI-1, unity (issue 1424 part 3)

[[point]]
src = "lv1"
in_ch = 1
dst = "vestibule"
out_ch = 1

[[point]]
src = "lv1"
in_ch = 2
dst = "vestibule"
out_ch = 2

