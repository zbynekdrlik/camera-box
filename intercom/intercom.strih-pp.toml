# strih-pp intercom hub routing (issue 1412, the Poprad rework).
# 11.10.2026: program only -- lv1 sends the program mix as the VBAN stream `strih`, the hub writes it to the
# `strih-program` PipeWire sink OBS captures (the strih-snv program path, issue 1344).
# 13.10.2026 (owner ROZHODNUTE: "prehod to"): the Poprad camera intercom moves here from VDO.Ninja, the
# SNV shape (intercom/intercom.strih-snv.toml) for the PP cameras cam1/4/6/7 + the phones (Janus) + the
# cutters. The PP router has no camN.lan names, so the cameras are their venue IPs (each cambox sends to
# strih.lan, which the PP router resolves to this box). The cutters' sound card is the Yamaha MG-XU USB
# card (2 in / 2 out, connected 13.10.2026), not the SNV MiniFuse 4: one stereo pair, so out 1/2 only.
# 13.10.2026 (issue 1424 part 3, owner: "mozme to tak spravit"): the vestibule TV (strih-pp HDMI-1 ->
# the Blackmagic HDMI-to-SDI converter) hears the lv1 program straight from this hub, no PipeWire and no
# OBS in between (zero latency; audio never behind the picture). The connector is named, the hub
# resolves it to its hw PCM by EDID vs ELD; nothing found = the leg stays silent and says why.
# 23.10.2026 (issue 1438): the hub opens the MG-XU itself through ALSA by its card ID `MGXU` (strih-pp
# /var/lib/alsa/asound.state; 2 channels each way), aplay for the cans and arecord for the talkback mic, no
# PipeWire node. A card that leaves USB is the leg DOWN, never a fallback: on 22.10.2026 the pw-cat legs
# re-routed into the `strih-program` sink while the MG-XU was unplugged. Rollback: adapter = "pipewire" with
# pipewire_target/source = "alsa_output/alsa_input.usb-Yamaha_Corporation_MG-XU-00.analog-stereo" and
# pipewire_channel_map = "FL,FR".
# Loaded through the daemon's own Matrix::from_toml by intercom/hub/tests/deployed_matrix_pp_1412.rs.

[hub]
bind = "0.0.0.0:8790"
vban_bind = "0.0.0.0:6980"
sample_rate = 48000
block_frames = 256

[janus]
api_url = "http://127.0.0.1:8088/janus"
room = 1000
room_secret_file = "/etc/intercom-hub/janus-room.secret"
rtp_bind = "0.0.0.0:6990"
codec = "opus"

[video]
ndi_source_name = "STRIH-PP (interkom)"
fps = 10
jpeg_quality = 70
enabled = true

[[participant]]
name = "cam1"
role = "cambox"
adapter = "vban"
host = "10.77.9.61"
in_stream = "cam1"
out_stream = "cam1"
in_channels = 2
out_channels = 2

[[participant]]
name = "cam4"
role = "cambox"
adapter = "vban"
host = "10.77.9.64"
in_stream = "cam4"
out_stream = "cam4"
in_channels = 2
out_channels = 2

[[participant]]
name = "cam6"
role = "cambox"
adapter = "vban"
host = "10.77.9.66"
in_stream = "cam6"
out_stream = "cam6"
in_channels = 2
out_channels = 2

[[participant]]
name = "cam7"
role = "cambox"
adapter = "vban"
host = "10.77.9.67"
in_stream = "cam7"
out_stream = "cam7"
in_channels = 2
out_channels = 2

[[participant]]
name = "lv1"
role = "program_ref"
adapter = "vban"
host = "lv1.lan"
in_stream = "strih"
in_channels = 2
out_channels = 0

[[participant]]
name = "cutters"
role = "cutters"
adapter = "alsa"
alsa_card = "MGXU"
alsa_device = 0
alsa_period_frames = 256
alsa_out_channels = 2
alsa_in_channels = 2
alsa_channel_map = "1,2"
alsa_in_channel_map = "1,2"
in_channels = 2
out_channels = 2

[[participant]]
name = "phones"
role = "phones"
adapter = "janus"
in_channels = 2
out_channels = 2

[[participant]]
name = "program_out"
role = "program_out"
adapter = "pipewire"
pipewire_target = "strih-program"
source_streams = ["strih"]
in_channels = 0
out_channels = 2

[[participant]]
name = "vestibule"
role = "program_monitor"
adapter = "alsa_hdmi"
hdmi_connector = "HDMI-1"
in_channels = 0
out_channels = 2

# --- the program path (unchanged since 11.10.2026)

[[point]]
src = "lv1"
in_ch = 1
dst = "program_out"
out_ch = 1

[[point]]
src = "lv1"
in_ch = 2
dst = "program_out"
out_ch = 2

# --- the program to the vestibule TV on HDMI-1, unity (issue 1424 part 3)

[[point]]
src = "lv1"
in_ch = 1
dst = "vestibule"
out_ch = 1

[[point]]
src = "lv1"
in_ch = 2
dst = "vestibule"
out_ch = 2

