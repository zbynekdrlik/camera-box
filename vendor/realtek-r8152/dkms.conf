# vendor/realtek-r8152/dkms.conf -- camera-box's own file, NOT part of the Realtek release (issue 1391).
#
# The pinned Realtek out-of-tree USB-ethernet driver r8152 v2.21.4 (2025/10/28): the strih rig NIC
# (Ubiquiti UACC-Adapter-RJ45-USBC-5GE = RTL8157, USB 0bda:8157) is not bound by the in-tree r8152 of
# the 7.0 kernels. The other files in this directory are the Realtek source, kept byte-identical to
# the release (the tarball on dev1, sha256 928602c587cfe639043059c1844d64474fcf69ab8901c40bb2ee456a0e17d4f4,
# with its dev1 build artifacts dropped); SHA256SUMS pins every file here, this one included.
#
# scripts/lib/strih-nic-driver.sh copies this directory to /usr/src/realtek-r8152-2.21.4 and runs
# `dkms add/build/install`; AUTOINSTALL rebuilds it for every kernel installed afterwards. DKMS builds
# with its default make command (make -C <kernel build dir> M=<dkms build dir>), which takes the
# kbuild branch of the Realtek Makefile -- that Makefile's own install target (rmmod + modprobe) is
# never run. The names below are pinned against the lib's constants by tests/python/test_strih_nic_driver_1391.py.
PACKAGE_NAME="realtek-r8152"
PACKAGE_VERSION="2.21.4"
BUILT_MODULE_NAME[0]="r8152"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
