# camera-box nextest profile (#416).
#
# Per-test slow-timeout: a test still running after `period` elapses is
# reported SLOW; after `terminate-after` consecutive periods it is
# TERMINATED and reported as a named failure — instead of hanging the whole
# CI job silently up to its `timeout-minutes` cap (a real 44min flaky hang
# was observed on the #411 merge, likely a probe thread/sync_channel
# deadlock in the --all-features suite).
#
# CALIBRATION HISTORY (#423): `probe::recording::tests::
# parallel_decode_matches_single_threaded_result_exactly` was hitting the
# original 5-min bound and getting killed at >300s. Root-caused: its
# synthetic test frames never carry a cam1/strih/stream node burn, but the
# test decoded them requiring the FULL node-burn set — so the #207
# fast-path gate could never be satisfied and every frame gratuitously ran
# the ~10x-cost robust tile recovery chasing burns that cannot be present.
# Fixed at the source (the test now decodes with the burn set its frames
# actually carry, matching production usage for a burn-free recording) —
# NOT by loosening this timeout (no-timeout-band-aids.md). Confirmed on
# this fix's own PR CI: parallel_decode_matches_single_threaded_result_exactly
# now runs in ~15s (was >300s), and the similarly-affected
# recording_latency_decode::dual_vernier_cam2_real_pixels_canonical_tick_and_both_hops
# dropped from ~50-59s to ~15s. The slowest test in that same run was
# genlock_manifest::check_is_consistent_on_a_large_real_sized_bundle at
# ~98s — real shell-script/process-spawn cost over a 1500-file bundle
# (#239), intrinsic to what it verifies, left unchanged.
#
# period = "60s", terminate-after = 8 -> a single test is killed after 8
# minutes — ~5x headroom over the ~98s observed max on a real CI run,
# while still naming a true runaway (the #411 44-min hang class) well
# inside the job's 25-min `timeout-minutes` cap (the hard backstop).
[profile.default]
slow-timeout = { period = "60s", terminate-after = 8 }

# #423: the `threads-required = "num-cpus"` override that pinned
# parallel_decode_matches_single_threaded_result_exactly to its own CPU pool
# (a #416 mitigation for suspected cross-binary nextest scheduling
# contention) is removed here — with the ~10x-cost robust-path bug fixed,
# the test no longer needs sole use of the runner's thread pool to avoid
# starvation. Confirmed on this PR's own follow-up CI run (28625021631,
# override absent): parallel_decode_matches_single_threaded_result_exactly
# ran in 30.9s (vs 14.8s WITH the override on the prior run, 28624626907 —
# some cross-binary contention is real, but 30.9s is nowhere near the new
# 8-minute bound), all 1521 tests still passed with the same 3 (intrinsic,
# genlock_manifest) tests reported slow, and the Test job's total wall time
# (329s) matched the prior run (340s) within noise.
