[package]
name = "camera-box-jxs"
version.workspace = true
edition = "2021"
description = "Issue 1387: the JPEG XS link (wire format, reassembly, sender, receiver, automatic bpp + pace + congestion control), a crate of its own (issue 1487) so the C ABI crates and the OBS build do not depend on the camera-box appliance"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[features]
# The encoder/decoder (the vendored SVT-JPEG-XS, built by jxs/sys: cmake + nasm). Linux-only
# dependency: on another target the feature enables nothing. A default build needs neither tool.
jxs = ["dep:svt-jpegxs-sys"]

[dependencies]
rig-core = { path = "../../rig/core" }
tracing = "0.1"

# Linux only: the socket, thread and interface calls (recvmmsg, UDP GSO, SO_MARK, getifaddrs).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
svt-jpegxs-sys = { path = "../sys", optional = true }

[dev-dependencies]
tempfile = "3.9"
