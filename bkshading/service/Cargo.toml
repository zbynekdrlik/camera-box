[package]
name = "bkshading"
version.workspace = true
edition = "2021"
authors = ["zbynekdrlik"]
description = "Camera shading-control aggregation service + operator web panel (issue 808)"
license = "MIT"
repository = "https://github.com/zbynekdrlik/camera-box"

[lib]
name = "bkshading"
path = "src/lib.rs"

[[bin]]
name = "bkshading"
path = "src/main.rs"

[features]
default = []
# Real NDI receive for the live preview (issue 808 M2). OFF by default: the service compiles
# + runs with the STUB test-pattern source on CI (no libndi needed). The real recv path
# (src/preview/ndi_source.rs) loads libndi at RUNTIME via libloading and mirrors the
# appliance's verified src/ndi.rs at bandwidth LOWEST; it is UNVERIFIED against a live source
# in this lane (see the issue 808 M2 follow-up). libloading is dynamic, so this compiles on CI
# even without libndi installed — the dedicated `cargo clippy --features ndi` CI step proves it.
ndi = ["dep:libloading"]

[dependencies]
bkshading-proto = { path = "../proto" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# Plain-HTTP LAN relay polling. rustls (pure Rust) avoids a system openssl build dep, so
# the service cross-compiles cleanly (incl. the future Windows/ARM targets).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pure-Rust JPEG encoder for the preview wire format (default features = `std` only, no simd/C
# → cross-compiles cleanly to Windows/ARM).
jpeg-encoder = "0.7"
# Runtime dynamic load of libndi (feature `ndi` only).
libloading = { version = "0.8", optional = true }
