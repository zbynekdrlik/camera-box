name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libv4l-dev libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libv4l-dev libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Run tests
        run: cargo test --all-features --verbose

      - name: Build benchmarks (compile check only)
        run: cargo bench --no-run

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libv4l-dev libasound2-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Generate coverage report
        # Probe hardware glue (painter/reader/run) and the bin drive /dev/fb0 + NDI and
        # cannot be unit-tested; exclude them so the threshold reflects testable logic.
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info --ignore-filename-regex 'src/probe/(painter|reader|run|fb)\.rs|src/bin/frame-probe\.rs' --fail-under-lines ${{ vars.COVERAGE_THRESHOLD || '47' }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          # Upload is informational only; the real gate is --fail-under-lines above.
          # Codecov flakiness (token/rate-limit) must not fail an already-passing build.
          fail_ci_if_error: false

  mutants:
    name: Mutation Testing
    runs-on: ubuntu-latest
    # PR-only: --in-diff has nothing to mutate on a push to main (diff is empty),
    # which would waste a full cold baseline build on a trivial no-op.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libv4l-dev libasound2-dev

      - name: Install cargo-mutants
        uses: taiki-e/install-action@cargo-mutants

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: mutants

      - name: Build PR diff
        run: git diff origin/${{ github.base_ref }}...HEAD > pr.diff

      - name: Mutation testing (PR diff only)
        # cargo-mutants runs a full unmutated baseline build+test first; skip it
        # entirely when the PR touches no Rust, so doc/CI-only PRs stay fast.
        # --features probe: the probe modules are feature-gated, so mutants must
        #   be built+tested with the feature or they all "survive" vacuously.
        # -e <glue>: painter/reader/run/fb/bin drive /dev/fb0 + NDI and are
        #   verified by the on-device loopback E2E, not unit tests — exclude them
        #   (same rationale as the coverage exclusion).
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '\.rs$'; then
            cargo mutants --in-diff pr.diff --features probe \
              -e 'src/probe/painter.rs' \
              -e 'src/probe/reader.rs' \
              -e 'src/probe/run.rs' \
              -e 'src/probe/fb.rs' \
              -e 'src/bin/frame-probe.rs' \
              --timeout 120
          else
            echo "No Rust source changes in this PR — skipping mutation testing."
          fi

  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libv4l-dev libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: build

      - name: Build release
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: camera-box-linux-amd64
          path: target/release/camera-box

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Security audit
        run: cargo audit
