name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:  # on-demand mutation window (#70: mutation is NOT a blocking PR/dev gate)

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libv4l-dev libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libv4l-dev libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Run tests
        run: cargo test --all-features --verbose

      - name: Build benchmarks (compile check only)
        run: cargo bench --no-run

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libv4l-dev libasound2-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Generate coverage report
        # Probe hardware glue (painter/reader/run/fb/kms) and the bin drive /dev/fb0,
        # /dev/dri (DRM page-flip) + NDI and cannot be unit-tested; exclude them so the
        # threshold reflects testable logic. kms.rs's PURE decision functions (pick_mode,
        # copy_plan, copy_bgra_into, next_bo_index) are unit-tested, but its live DRM
        # `hw` glue cannot be, so the file follows the same exclusion as fb.rs.
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info --ignore-filename-regex 'src/probe/(painter|reader|run|fb|kms|multi_reader)\.rs|src/bin/(frame-probe|multitap-probe)\.rs' --fail-under-lines ${{ vars.COVERAGE_THRESHOLD || '47' }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          # Upload is informational only; the real gate is --fail-under-lines above.
          # Codecov flakiness (token/rate-limit) must not fail an already-passing build.
          fail_ci_if_error: false

  mutants:
    name: Mutation Testing
    runs-on: ubuntu-latest
    # ON-DEMAND ONLY (#70): mutation testing must NOT block PR/dev — per the
    # user's global policy it runs in its OWN window via `gh workflow run ci.yml`
    # (or the /mutation-sweep skill), never on push/pull_request, so development
    # is never gated on it. Diff is taken against origin/main for the manual run.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libv4l-dev libasound2-dev

      - name: Install cargo-mutants
        uses: taiki-e/install-action@cargo-mutants

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: mutants

      - name: Build PR diff
        run: git diff origin/main...HEAD > pr.diff

      - name: Mutation testing (PR diff only)
        # cargo-mutants runs a full unmutated baseline build+test first; skip it
        # entirely when the PR touches no Rust, so doc/CI-only PRs stay fast.
        # --features probe: the probe modules are feature-gated, so mutants must
        #   be built+tested with the feature or they all "survive" vacuously.
        # -e <glue>: painter/reader/run/fb/bin drive /dev/fb0 + NDI and are
        #   verified by the on-device loopback E2E, not unit tests — exclude them
        #   (same rationale as the coverage exclusion).
        # --exclude-re NdiSender::send_frame_data: the NDI SDK send path is
        #   integration-only glue (builds the NDIlib frame struct + FFI send,
        #   genlock sleep) — its body-replacement mutant is uncatchable by any
        #   unit test and is covered by the on-device loopback E2E. The genlock
        #   fps math it calls (fps_from_frame_rate, next_boundary_100ns) is a
        #   separate, fully-mutation-tested pure function. Function-scoped, so
        #   the rest of src/ndi.rs (conversions, boundary math) stays mutated.
        # --exclude-re wall_clock_ns / run_capture_loop: the syscall wrapper and
        #   the async capture->NDI hardware loop are integration-only glue
        #   (verified by the on-device loopback E2E). The genlock DECISION logic
        #   they drive (ndi::genlock_emit_gate) is a separate, fully
        #   mutation-tested pure function.
        # --exclude-re set_external_pacing: a one-line setter storing a bool flag
        #   consumed only on the FFI send path (NdiSender::send_frame_data, also
        #   excluded). Its body-replacement mutant is uncatchable by a unit test
        #   without a live NDI sender and is covered by the on-device loopback E2E.
        # --exclude-re clock_ns: reads the real wall/monotonic clock
        #   (SystemTime::now / Instant::elapsed) — the same hardware-glue that lived
        #   in the (already-excluded) painter/multi_reader before it was de-duped
        #   into probe/mod.rs (#7). A return-value mutant (->0/1/-1) is uncatchable
        #   by any unit test that cannot pin a live clock reading; the CONSUMERS of
        #   its output (absolute_latency_stats, the gate, the differ) are fully
        #   mutation-tested pure functions.
        # --exclude-re KmsPresenter / fbcon:: : the DRM/KMS page-flip glue (#79) —
        #   open card / take master / set_crtc / page_flip / map dumb buffer, and the
        #   fbcon sysfs bind/unbind — drives /dev/dri + the live HDMI console and is
        #   verified by the on-device tear-free loopback, not unit tests. Its PURE
        #   decision functions (pick_mode, copy_plan, copy_bgra_into, next_bo_index,
        #   is_phase_lockable) are free functions OUTSIDE these patterns and stay
        #   mutated + are covered by kms unit + kms_pitch_roundtrip integration tests.
        run: |
          if git diff --name-only origin/main...HEAD | grep -q '\.rs$'; then
            cargo mutants --in-diff pr.diff --features probe \
              -e 'src/probe/painter.rs' \
              -e 'src/probe/reader.rs' \
              -e 'src/probe/run.rs' \
              -e 'src/probe/fb.rs' \
              -e 'src/probe/multi_reader.rs' \
              -e 'src/bin/frame-probe.rs' \
              -e 'src/bin/multitap-probe.rs' \
              --exclude-re 'NdiSender::send_frame_data' \
              --exclude-re 'NdiSender::set_external_pacing' \
              --exclude-re '\bwall_clock_ns\b' \
              --exclude-re '\brun_capture_loop\b' \
              --exclude-re '\bclock_ns\b' \
              --exclude-re 'KmsPresenter' \
              --exclude-re 'fbcon::' \
              --timeout 120
          else
            echo "No Rust source changes in this PR — skipping mutation testing."
          fi

  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libv4l-dev libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: build

      - name: Build release
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: camera-box-linux-amd64
          path: target/release/camera-box

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Security audit
        run: cargo audit

  drift-guard:
    name: Drift Guard (pin set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validates that vendor/README.md declares a complete, well-formed pinned set
      # (OBS/DistroAV/NDI versions + critical settings) AND cross-checks the manifest's
      # DistroAV pin against the vendored source (vendor/distroav/buildspec.json) — catching
      # the "subtree bumped but manifest stale" drift class with no production access (#45).
      # The live-prod facet (--compare against strih/stream) is operator/agent-driven via the
      # win-* MCP tools (see .claude/commands/drift-guard.md); CI runners can't reach that LAN.
      - name: Check pinned set (manifest + vendored source)
        run: ./scripts/drift-guard.sh --check-pins

  notify-on-failure:
    name: Notify on red
    # Fires only when a gate above goes RED — replaces silent-red eyeballing
    # (#25). Covers these unit/build gates today and auto-covers #9's scheduled
    # loopback/full-path E2E job once it is added to this workflow. Posts via the
    # NewLevelMedia Discord bot directly to #notifications (the channel the fleet
    # watches). Secrets: DISCORD_BOT_TOKEN (bot token) + DISCORD_CHANNEL_ID
    # (#notifications id). NOTE: the older n8n CLAUDE_DISCORD_WEBHOOK_URL relay
    # accepts POSTs (HTTP 200) but no longer DELIVERS to Discord, so the bot REST
    # API is used directly — Discord returns the created message object on success.
    needs: [lint, test, coverage, mutants, build, security, drift-guard]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Discord alert (bot API → #notifications)
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHANNEL_ID:-}" ]; then
            echo "DISCORD_BOT_TOKEN/DISCORD_CHANNEL_ID not set — skipping alert."
            exit 0
          fi
          # Name every gate job that failed.
          failed=$(printf '%s' "$RESULTS" \
            | jq -r '[to_entries[] | select(.value.result=="failure") | .key] | join(", ")')
          [ -z "$failed" ] && failed="unknown"
          content="🔴 **camera-box CI red** on \`${REF}\` (${SHA:0:7}, ${EVENT}) — failed: ${failed} — ${RUN_URL}"
          payload=$(jq -n --arg c "$content" '{content:$c}')
          curl -fsS --max-time 10 -X POST \
            -H "Authorization: Bot ${BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages" >/dev/null
          echo "Alert posted to #notifications for: ${failed}"
