name: CI

on:
  # Fire CI ONCE per commit (#157). Trigger on push to the two long-lived
  # branches and DELIBERATELY OMIT pull_request: a dev->main PR's pull_request
  # event would re-run a full duplicate cycle for a commit the push:dev event
  # already covered (the old push+pull_request double-fire — 2 runs/commit).
  # push:[dev,main] gives exactly one run per commit AND still runs CI on direct
  # pushes to dev and main (main isn't branch-protected, so no required check
  # needs the pull_request event). Same pattern as the sibling repos devbridge /
  # restreamer / network-monitor.
  push:
    branches: [dev, main]
  workflow_dispatch:  # on-demand mutation window (#70: mutation is NOT a blocking PR/dev gate)

env:
  CARGO_TERM_COLOR: always

# Cancel a superseded run when a new commit lands on the same ref (#157), so a
# re-push doesn't leave the old run burning a runner. Keyed by workflow + ref so
# dev, main, and a manual dispatch each get their own independent group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libv4l-dev libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    # #416: a flaky/hanging test in the --all-features suite must FAIL FAST
    # instead of blocking the run up to GitHub's 6h default job limit (a real
    # 44min hang was observed on the #411 merge; main baseline is ~10.5min).
    # 25min is ~2.5x the baseline — generous headroom, still bounded.
    timeout-minutes: 25
    steps:
      # #949: fetch-depth 0 (full history) — tests/drift_guard.rs's genlock_parity_equivalent
      # tests run a REAL `git diff`/`git rev-parse` against real historical vendor/** commits (the
      # incident SHAs + a genuine vendor/obs-studio skew pair) to prove the #949 fix end-to-end.
      # actions/checkout@v4's default shallow (depth=1) clone does not carry those commits, so
      # they'd fail to resolve and fail CLOSED (never equivalent) — a false RED here, not a real
      # bug. Mirrors the `mutants` job below, which already needed the same for `--in-diff`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libv4l-dev libasound2-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: test

      # ffmpeg/ffprobe: the recorded-file rqrr analysis entrypoint (#106) spawns
      # them to emit gray8 rawvideo frames; the recording_decode integration test
      # drives that full path. ffmpeg is already a camera-box runtime dependency
      # (ndi.rs MJPEG decode).
      - name: Install ffmpeg
        run: |
          # ffmpeg via a prebuilt STATIC binary from GitHub releases (BtbN), NOT apt.
          # `apt-get install ffmpeg` pulls 87 packages / ~63 MB from the (often throttled)
          # Ubuntu mirror and intermittently stalls for many minutes, wedging CI (#114/#127).
          # A single static tarball (GitHub-hosted, retried) is fast + self-contained and
          # ships ffmpeg+ffprobe with all codecs built in — exactly what the #106 recording
          # path needs.
          # PINNED to a REPO-OWNED mirror release (ci-assets-ffmpeg-*), never any BtbN tag:
          # BtbN "latest" is rebuilt daily and its assets 503 during the replacement window
          # (the 2026-08-12 coverage failures), and BtbN PRUNES dated autobuild releases
          # after ~2 weeks, so a dated-tag pin rots too (2026-08-25: autobuild-2026-08-11
          # 404'd, Test+Coverage red on the fetch, run 32872811863). An asset mirrored on
          # THIS repo's own release cannot be pruned by a third party; sha256-verified.
          url=https://github.com/zbynekdrlik/camera-box/releases/download/ci-assets-ffmpeg-20260825/ffmpeg-N-126264-g007cd1fd43-linux64-gpl.tar.xz
          curl -fsSL --retry 3 --retry-delay 5 "$url" -o /tmp/ffmpeg.tar.xz
          echo "aa86544042631a525b03d1b732614d705f74ca971efdb73f298d75e50288ed3e  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p /tmp/ff && tar xf /tmp/ffmpeg.tar.xz -C /tmp/ff --strip-components=1
          sudo install /tmp/ff/bin/ffmpeg /tmp/ff/bin/ffprobe /usr/local/bin/
          ffmpeg -version | head -1

      # #416: cargo-nextest instead of `cargo test` — the per-test slow-timeout
      # in .config/nextest.toml TERMINATES + NAMES a wedged test (instead of
      # letting it silently hang the job to the timeout-minutes cap above).
      # nextest does not run doctests — this crate has NONE (grep for
      # ` ```rust ` doc-comment fences finds only ` ```text `/` ```c `, never
      # rust), so no coverage is dropped and no separate `cargo test --doc`
      # step is needed. If a rust doctest is ever added, add that step here.
      - name: Run tests (nextest)
        run: cargo nextest run --all-features

      - name: Build benchmarks (compile check only)
        run: cargo bench --no-run

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      # #949: same fetch-depth 0 reason as the `test` job above — this job runs the exact same
      # test suite (cargo llvm-cov nextest) and hits the same real-git-history tests.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libv4l-dev libasound2-dev

      # ffmpeg/ffprobe for the #106 recorded-file analysis path covered by the
      # recording_decode integration test (run under llvm-cov here too).
      - name: Install ffmpeg
        run: |
          # ffmpeg via a prebuilt STATIC binary from GitHub releases (BtbN), NOT apt.
          # `apt-get install ffmpeg` pulls 87 packages / ~63 MB from the (often throttled)
          # Ubuntu mirror and intermittently stalls for many minutes, wedging CI (#114/#127).
          # A single static tarball (GitHub-hosted, retried) is fast + self-contained and
          # ships ffmpeg+ffprobe with all codecs built in — exactly what the #106 recording
          # path needs.
          # PINNED to a REPO-OWNED mirror release (ci-assets-ffmpeg-*), never any BtbN tag:
          # BtbN "latest" is rebuilt daily and its assets 503 during the replacement window
          # (the 2026-08-12 coverage failures), and BtbN PRUNES dated autobuild releases
          # after ~2 weeks, so a dated-tag pin rots too (2026-08-25: autobuild-2026-08-11
          # 404'd, Test+Coverage red on the fetch, run 32872811863). An asset mirrored on
          # THIS repo's own release cannot be pruned by a third party; sha256-verified.
          url=https://github.com/zbynekdrlik/camera-box/releases/download/ci-assets-ffmpeg-20260825/ffmpeg-N-126264-g007cd1fd43-linux64-gpl.tar.xz
          curl -fsSL --retry 3 --retry-delay 5 "$url" -o /tmp/ffmpeg.tar.xz
          echo "aa86544042631a525b03d1b732614d705f74ca971efdb73f298d75e50288ed3e  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p /tmp/ff && tar xf /tmp/ffmpeg.tar.xz -C /tmp/ff --strip-components=1
          sudo install /tmp/ff/bin/ffmpeg /tmp/ff/bin/ffprobe /usr/local/bin/
          ffmpeg -version | head -1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Generate coverage report
        # Probe hardware glue (painter/reader/run/fb/kms) and the bin drive /dev/fb0,
        # /dev/dri (DRM page-flip) + NDI and cannot be unit-tested; exclude them so the
        # threshold reflects testable logic. kms.rs's PURE decision functions (pick_mode,
        # copy_plan, copy_bgra_into, next_bo_index) are unit-tested, but its live DRM
        # `hw` glue cannot be, so the file follows the same exclusion as fb.rs.
        # src/affinity.rs (#289): its PURE selection/parse functions are unit- AND
        # mutation-tested, but its sched_setaffinity / /proc-irq / /sys IO glue cannot
        # be — so the file follows the same whole-file exclusion as kms.rs (glue
        # excluded from coverage, pure functions still mutated in the mutants job).
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info --ignore-filename-regex 'src/probe/(painter|reader|run|fb|kms|multi_reader|colour_sample)\.rs|src/bin/(frame-probe|recording-probe|recording-verdict)\.rs|src/affinity\.rs' --fail-under-lines ${{ vars.COVERAGE_THRESHOLD || '47' }}

  mutants:
    name: Mutation Testing
    runs-on: ubuntu-latest
    # ON-DEMAND ONLY (#70): mutation testing must NOT block PR/dev — per the
    # user's global policy it runs in its OWN window via `gh workflow run ci.yml`
    # (or the /mutation-sweep skill), never on push/pull_request, so development
    # is never gated on it. Diff is taken against origin/main for the manual run.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libv4l-dev libasound2-dev

      - name: Install cargo-mutants
        uses: taiki-e/install-action@cargo-mutants

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: mutants

      - name: Build PR diff
        run: git diff origin/main...HEAD > pr.diff

      - name: Mutation testing (PR diff only)
        # cargo-mutants runs a full unmutated baseline build+test first; skip it
        # entirely when the PR touches no Rust, so doc/CI-only PRs stay fast.
        # --features probe: the probe modules are feature-gated, so mutants must
        #   be built+tested with the feature or they all "survive" vacuously.
        # -e <glue>: painter/reader/run/fb/bin drive /dev/fb0 + NDI and are
        #   verified by the on-device loopback E2E, not unit tests — exclude them
        #   (same rationale as the coverage exclusion).
        # --exclude-re NdiSender::send_frame_data: the NDI SDK send path is
        #   integration-only glue (builds the NDIlib frame struct + FFI send,
        #   genlock sleep) — its body-replacement mutant is uncatchable by any
        #   unit test and is covered by the on-device loopback E2E. The genlock
        #   fps math it calls (fps_from_frame_rate, next_boundary_100ns) is a
        #   separate, fully-mutation-tested pure function. Function-scoped, so
        #   the rest of src/ndi.rs (conversions, boundary math) stays mutated.
        # --exclude-re wall_clock_ns / run_capture_loop: the syscall wrapper and
        #   the async capture->NDI hardware loop are integration-only glue
        #   (verified by the on-device loopback E2E). The genlock DECISION logic
        #   they drive (ndi::genlock_emit_gate) is a separate, fully
        #   mutation-tested pure function.
        # --exclude-re set_external_pacing: a one-line setter storing a bool flag
        #   consumed only on the FFI send path (NdiSender::send_frame_data, also
        #   excluded). Its body-replacement mutant is uncatchable by a unit test
        #   without a live NDI sender and is covered by the on-device loopback E2E.
        # --exclude-re clock_ns: reads the real wall/monotonic clock
        #   (SystemTime::now / Instant::elapsed) — the same hardware-glue that lived
        #   in the (already-excluded) painter/multi_reader before it was de-duped
        #   into probe/mod.rs (#7). A return-value mutant (->0/1/-1) is uncatchable
        #   by any unit test that cannot pin a live clock reading; the CONSUMERS of
        #   its output (absolute_latency_stats, the gate, the differ) are fully
        #   mutation-tested pure functions.
        # --exclude-re KmsPresenter / fbcon:: : the DRM/KMS page-flip glue (#79) —
        #   open card / take master / set_crtc / page_flip / map dumb buffer, and the
        #   fbcon sysfs bind/unbind — drives /dev/dri + the live HDMI console and is
        #   verified by the on-device tear-free loopback, not unit tests. Its PURE
        #   decision functions (pick_mode, copy_plan, copy_bgra_into, next_bo_index,
        #   is_phase_lockable) are free functions OUTSIDE these patterns and stay
        #   mutated + are covered by kms unit + kms_pitch_roundtrip integration tests.
        # #208 excludes (decode_for / extract_partial / run_merge / RecordingPartial::{save,load}
        # / report_recording_diag): I/O glue — ffmpeg recording decode, partial-JSON file
        # read/write, and pixel-proof PNG extraction + stdout printing. Uncatchable by a unit test
        # without a live recording on disk, exactly like the run_capture_loop / clock_ns glue. The
        # PURE logic they wrap IS mutated + covered: build_and_print_verdict (the merge==fused +
        # zero-loss/real-drop assertions in merge_of_partials_reproduces_the_fused_verdict), the
        # burn-id contiguity engine, and RecordingPartial::{from_frames,to_json,from_json} (the
        # recording_partial roundtrip + schema unit tests).
        # #289 affinity glue (env_capture_core / read_online_cores / read_isolated_cores /
        # pin_current_thread / pin_capture_thread / pin_off_capture_core / setup_irq_affinity):
        # sched_setaffinity + /sys + /proc-irq IO — uncatchable by a unit test (no live core
        # topology / no writable /proc/irq in CI). The PURE logic they wrap IS mutated + covered:
        # parse_cpulist, select_capture_core, select_painter_cores, parse_capture_irqs,
        # smp_affinity_mask_hex (the src/affinity.rs unit tests).
        # #364 colour-gate I/O glue (src/probe/colour_sample.rs ffmpeg colour pass + ffprobe;
        # build_node_colour_fail in recording-verdict): uncatchable by a unit test without a live
        # recording on disk (exercised by the on-rig recorded fixture), exactly like decode_for /
        # run_merge. The JUDGEMENT they wrap IS mutated + covered: the pure src/colour_verify.rs
        # (classify_patch / summarize_node_colour) and NodeVerdict::is_zero's colour_fail term.
        run: |
          if git diff --name-only origin/main...HEAD | grep -q '\.rs$'; then
            cargo mutants --in-diff pr.diff --features probe \
              -e 'src/probe/painter.rs' \
              -e 'src/probe/reader.rs' \
              -e 'src/probe/run.rs' \
              -e 'src/probe/fb.rs' \
              -e 'src/probe/multi_reader.rs' \
              -e 'src/probe/colour_sample.rs' \
              -e 'src/bin/frame-probe.rs' \
              --exclude-re 'NdiSender::send_frame_data' \
              --exclude-re 'NdiSender::set_external_pacing' \
              --exclude-re '\bwall_clock_ns\b' \
              --exclude-re '\brun_capture_loop\b' \
              --exclude-re '\bclock_ns\b' \
              --exclude-re 'KmsPresenter' \
              --exclude-re 'fbcon::' \
              --exclude-re '\bdecode_for\b' \
              --exclude-re '\bextract_partial\b' \
              --exclude-re '\brun_merge\b' \
              --exclude-re 'RecordingPartial::save' \
              --exclude-re 'RecordingPartial::load' \
              --exclude-re '\breport_recording_diag\b' \
              --exclude-re '\bbuild_node_colour_fail\b' \
              --exclude-re '\benv_capture_core\b' \
              --exclude-re '\bread_online_cores\b' \
              --exclude-re '\bread_isolated_cores\b' \
              --exclude-re '\bpin_current_thread\b' \
              --exclude-re '\bpin_capture_thread\b' \
              --exclude-re '\bpin_off_capture_core\b' \
              --exclude-re '\bsetup_irq_affinity\b' \
              --timeout 120
          else
            echo "No Rust source changes in this PR — skipping mutation testing."
          fi

  python-tests:
    name: Python harness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        # websocket-client: obs_phase2.py imports it at module load (sys.exit if
        # missing), so it must be present for the test module to import.
        # matplotlib: scripts/latency-line-report.py (#209 continuous-line latency
        # proof) imports it at module load; the plotter test renders a real PNG.
        # opencv-python-headless + numpy: scripts/qr_screenshot_check.py (#722 pixel
        # proof) decodes QR codes from OBS screenshots via cv2.QRCodeDetector;
        # headless avoids pulling in GUI/X11 deps this CI runner doesn't have.
        # Pillow + qrcode: test-only, generate REAL fixture QR codes to decode back.
        run: pip install pytest websocket-client matplotlib opencv-python-headless numpy Pillow qrcode pyyaml

      - name: Run harness unit tests (#149 self-verify guard)
        # PYTEST_DISABLE_PLUGIN_AUTOLOAD keeps the run hermetic (no third-party
        # pytest plugins). These tests pin the obs_phase2 self-verify guard that
        # asserts the probe NDI config mirrors the certified prod genlock input.
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest tests/python -v

  bkshading:
    name: bkshading service + relay (issue 808)
    # The bkshading shading-control service + cambox relay are SEPARATE workspace members
    # (bkshading/proto|relay|service). The appliance jobs above run cargo at the root WITHOUT
    # --workspace, so they never build these; THIS job is their first compile + clippy + tests.
    # No libv4l/libasound needed — these crates don't depend on the appliance's Linux tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: bkshading

      # ndi is now the DEFAULT bkshading service build (issue 1157), so this members clippy
      # already compiles the real NDI FFI path (src/preview/ndi_source.rs) with -D warnings.
      # libloading is a RUNTIME dynamic load, so it still compiles here without libndi installed.
      - name: Clippy (bkshading members)
        run: cargo clippy -p bkshading-proto -p bkshading-relay -p bkshading --all-targets -- -D warnings

      # ndi being default means the members clippy above covers the real path; this step instead
      # keeps the OTHER config proven — the `--no-default-features` stub (libndi-free) path — so it
      # stays clippy-clean and can't bit-rot (it was the free default coverage before ndi became
      # the default build).
      - name: Clippy (bkshading service, --no-default-features — stub path)
        run: cargo clippy -p bkshading --no-default-features --all-targets -- -D warnings

      # ndi is the default (issue 1157), so this runs the ndi-gated code path plus the ndi_paths
      # cross-platform discovery unit tests (which pin that the Windows Processing.NDI.Lib runtime
      # DLL is in the search set) and the shared_runtime lifecycle tests. libloading is a runtime
      # dynamic load, so no libndi need be installed to build/run these.
      - name: Test (bkshading members)
        run: cargo test -p bkshading-proto -p bkshading-relay -p bkshading

      # Prove the `--no-default-features` stub path still compiles + passes its tests (StubSource +
      # the pure preview pipeline) so the libndi-free build can't silently break now that it is off
      # the default.
      - name: Test (bkshading service, --no-default-features — stub path)
        run: cargo test -p bkshading --no-default-features

      # Build the DEPLOYABLE binaries in RELEASE (issue 808 M3) so a live rig verify of the merged
      # relay/service has an artifact to deploy — nothing produced one before, though
      # scripts/bkshading-provision-relay.sh explicitly expects "the CI-built bkshading-relay binary".
      # Relay = default features (drives the camera via the gphoto2 CLI, no ndi); service =
      # --features ndi (kept explicit for intent + deploy-shape clarity; it now equals the service
      # default since issue 1157 made ndi the default build). This release build supersedes the
      # earlier debug --bins compile-proof — clippy --all-targets + the tests above already prove
      # the crates compile in debug, so a release build is a strictly stronger proof.
      - name: Build deployable binaries (relay default + service --features ndi)
        run: |
          cargo build --release --bins -p bkshading-relay
          cargo build --release --features ndi --bins -p bkshading

      # Upload the deployable relay + service binaries (issue 808 M3), mirroring the appliance's
      # camera-box-linux-amd64 / probe-tools-linux-amd64 upload pattern. scripts/bkshading-deploy-relay.sh
      # downloads bkshading-relay from this artifact and places it on a cambox (/usr/local/bin).
      - name: Upload bkshading binaries
        uses: actions/upload-artifact@v4
        with:
          name: bkshading-linux-amd64
          # Fail loud if a binary is missing (renamed bin / wrong path) — an empty artifact with a
          # green CI is exactly the "no deployable artifact" failure this milestone exists to fix.
          if-no-files-found: error
          path: |
            target/release/bkshading-relay
            target/release/bkshading

      # Cross-build the relay for aarch64 (issue 808 SBC/handheld milestone): the handheld runs on a
      # mini SBC (Pi Zero 2 W) which is ARM and CANNOT run the amd64 binary. The relay is pure Rust
      # (axum/tokio/serde/clap; no C link deps — no reqwest/rustls/ring on the relay side), so a
      # rustup target + the gcc-aarch64-linux-gnu linker cross-compile it cleanly. Target choice
      # justified (aarch64, not armhf) in scripts/lib/bkshading-sbc-runtime.sh + .claude/rules/bkshading.md.
      - name: Cross-build relay for aarch64 (SBC / Pi Zero 2 W handheld)
        run: |
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          cargo build --release --target aarch64-unknown-linux-gnu --bins -p bkshading-relay
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      # Upload the aarch64 relay for the SBC/handheld deploy path
      # (scripts/bkshading-deploy-relay.sh --arch arm64). Relay-only — the service runs on the strih
      # PC, never on a handheld — hence the distinct bkshading-relay-linux-arm64 name. Fail loud on a
      # missing binary (never a green empty artifact), mirroring the amd64 upload above.
      - name: Upload bkshading relay (aarch64 / SBC handheld)
        uses: actions/upload-artifact@v4
        with:
          name: bkshading-relay-linux-arm64
          if-no-files-found: error
          path: target/aarch64-unknown-linux-gnu/release/bkshading-relay

  bkshading-windows:
    name: bkshading Windows compile check (issue 808)
    # The bkshading service runs on the strih PC — Windows FIRST (Linux only after the
    # frame-loss P0). A Linux compile is not proof the Windows target builds, so cheaply
    # `cargo check` the members on windows-latest. Pure axum/tokio/reqwest-rustls (no platform
    # deps) — but "should build on Windows" isn't a build.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: bkshading-windows

      # ndi is now the DEFAULT service build (issue 1157), so this default-features check compiles
      # the REAL NDI path (src/preview/ndi_source.rs) on the exact Windows strih ship target —
      # libloading resolves Processing.NDI.Lib.x64.dll at runtime, so it builds with no libndi on
      # the runner.
      - name: Check bkshading members (Windows target)
        run: cargo check -p bkshading-proto -p bkshading-relay -p bkshading

      # The strih service is deployed WITH --features ndi (issue 1157) to a Windows PC (Windows
      # FIRST), so build the actual DEPLOYABLE Windows binary in RELEASE (issue 808 M3) — not just
      # `cargo check` — and upload it, so the strih service deploy finally has an artifact (nothing
      # produced one before). libloading resolves the NDI runtime DLL (Processing.NDI.Lib.x64.dll)
      # at runtime, so this builds with no libndi installed on the runner.
      - name: Build deployable service binary (--features ndi, Windows target)
        run: cargo build --release --bins -p bkshading --features ndi

      - name: Upload bkshading Windows service binary
        uses: actions/upload-artifact@v4
        with:
          name: bkshading-windows-amd64
          # Fail loud on a missing binary (see the Linux upload) — never a green empty artifact.
          if-no-files-found: error
          path: target/release/bkshading.exe

  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libv4l-dev libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: build

      - name: Build release
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: camera-box-linux-amd64
          path: target/release/camera-box

      # The probe/verdict tools require --features probe and are NOT in the appliance
      # binary above. Build + upload ALL FOUR binaries the recording-e2e harness needs
      # so a FULL trustworthy rig run can be driven on the dev host WITHOUT a local
      # Tier-0 build (no-local-builds.md, #133):
      #   recording-verdict   — the #186/#198 burn-id contiguity verdict (runs on dev1).
      #   frame-probe         — the cam2 dual-QR painter ground truth (deployed to cam2).
      #   camera-box          — the PROBE-featured appliance with the #174 cam1-capture
      #                         burn (deployed to cam1; the clean prod camera-box above
      #                         has NO burn). Named camera-box-probe in the artifact so
      #                         it is never confused with the production binary.
      #   frozen-camera-gate      — #365 freshness gate (default features, no probe deps).
      #   obs-watchdog-gate       — #391 broadcast-OBS liveness/wedge gate (default features).
      #   av-restart-sync-gate    — #137 OBS-restart A/V-sync-survival gate (default features).
      #   zero-loss-restart-gate  — #109 restart-survival ZERO-LOSS gate (default features).
      #   phase-sync-gate         — #438 4-camera phase-sync offset gate (default features);
      #                             scripts/phase_sync_calibrate.py (#286) shells out to this
      #                             instead of reimplementing compute_phase_sync_offsets.
      - name: Build probe tools (verdict + frame-probe + probe camera-box)
        run: |
          cargo build --release --features probe \
            --bin recording-verdict --bin frame-probe --bin camera-box
          cp target/release/camera-box target/release/camera-box-probe

      - name: Build default-feature gate bins (frozen-camera-gate #365, render-budget-gate #405, obs-watchdog-gate #391, av-restart-sync-gate #137, zero-loss-restart-gate #109, phase-sync-gate #438, mv-fps-gate #771)
        run: cargo build --release --bin frozen-camera-gate --bin render-budget-gate --bin obs-watchdog-gate --bin av-restart-sync-gate --bin zero-loss-restart-gate --bin phase-sync-gate --bin mv-fps-gate

      - name: Upload probe tools
        uses: actions/upload-artifact@v4
        with:
          name: probe-tools-linux-amd64
          path: |
            target/release/recording-verdict
            target/release/frame-probe
            target/release/camera-box-probe
            target/release/frozen-camera-gate
            target/release/render-budget-gate
            target/release/obs-watchdog-gate
            target/release/av-restart-sync-gate
            target/release/zero-loss-restart-gate
            target/release/phase-sync-gate
            target/release/mv-fps-gate

  windows-probe:
    name: Windows probe build (recording-verdict.exe + obs-watchdog-gate.exe + obs-self-heal-gate.exe)
    # #193: build recording-verdict for WINDOWS so the recording decode runs ON stream.lan
    # (10.77.9.204) where the multi-GB OBS recording already lives — never downloaded to slow
    # dev1 (the root of the slow transfers + the #187 OOM + the disk drain). recording-verdict
    # is pure Rust (ffmpeg/ffprobe spawn + rqrr + image, all cross-platform); the Linux-only
    # appliance/hardware-glue crates (v4l/alsa/cpal/evdev/drm/libc-ioctl) are confined to
    # cfg(target_os="linux") in Cargo.toml + src so the verdict cross-builds clean here.
    # ffmpeg/ffprobe are NOT bundled — they are already installed on stream.lan (winget;
    # ffmpeg 8.0.1 on PATH at C:\Users\newlevel\AppData\Local\Microsoft\WinGet\Links).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-probe

      # Only the verdict bin is built with the probe feature — the other probe bins (frame-probe /
      # camera-box) drive Linux hardware (/dev/fb0, v4l, NDI on Linux) and are NOT needed on the
      # stream box, so they are deliberately excluded from this Windows build.
      #
      # #411: obs-watchdog-gate AND obs-self-heal-gate are ALSO built here (default features, no
      # probe deps) — the Windows-local self-heal Task Scheduler job
      # (scripts/obs-self-heal-install.sh) needs BOTH on-box: obs-watchdog-gate reuses
      # camera_box::obs_watchdog::classify for the LOCAL wedge verdict, obs-self-heal-gate reuses
      # camera_box::obs_self_heal::decide for the confirm/throttle/lock RECOVERY decision — never
      # reimplementing either in PowerShell. Building both in the same `cargo build` invocation
      # reuses the already-compiled dependency graph.
      - name: Build recording-verdict.exe + obs-watchdog-gate.exe + obs-self-heal-gate.exe
        run: cargo build --release --features probe --bin recording-verdict --bin obs-watchdog-gate --bin obs-self-heal-gate

      - name: Smoke-check the binaries run (--help)
        run: |
          ./target/release/recording-verdict.exe --help
          if ($LASTEXITCODE -ne 0) { throw "recording-verdict.exe --help failed: exit $LASTEXITCODE" }
          '{}' | ./target/release/obs-watchdog-gate.exe
          $gateExit = $LASTEXITCODE
          if ($gateExit -ne 2) { throw "obs-watchdog-gate.exe: expected exit 2 on empty JSON (no boxes to gate), got $gateExit" }
          '{"wedged":true}' | ./target/release/obs-self-heal-gate.exe
          $selfHealExit = $LASTEXITCODE
          if ($selfHealExit -ne 2) { throw "obs-self-heal-gate.exe: expected exit 2 on a payload missing required fields, got $selfHealExit" }
          # GH Actions fails a pwsh step on any lingering non-zero $LASTEXITCODE at script end —
          # exit 2 above is the EXPECTED pass condition, so explicitly clear it here.
          exit 0

      - name: Upload Windows probe tools
        uses: actions/upload-artifact@v4
        with:
          name: probe-tools-windows-amd64
          path: |
            target/release/recording-verdict.exe
            target/release/obs-watchdog-gate.exe
            target/release/obs-self-heal-gate.exe

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Security audit
        run: cargo audit

  drift-guard:
    name: Drift Guard (pin set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validates that vendor/README.md declares a complete, well-formed pinned set
      # (OBS/DistroAV/NDI versions + critical settings) AND cross-checks the manifest's
      # DistroAV pin against the vendored source (vendor/distroav/buildspec.json) — catching
      # the "subtree bumped but manifest stale" drift class with no production access (#45).
      # The live-prod facet (--compare against strih/stream) is operator/agent-driven via the
      # win-* MCP tools (see .claude/commands/drift-guard.md); CI runners can't reach that LAN.
      - name: Check pinned set (manifest + vendored source)
        run: ./scripts/drift-guard.sh --check-pins

  shellcheck:
    name: Shellcheck (provisioning/ops scripts)
    runs-on: ubuntu-latest
    # #545: the provisioning/ops shell scripts (setup-device.sh, setup-imag.sh, rig-mode.sh,
    # drift-guard.sh, launch-obs-genlock.sh, purge-target.sh, ...) run as ROOT on fresh cam
    # boxes + imag-nb during provisioning (#448-#454) and carry non-trivial logic (idempotent
    # GRUB_CMDLINE flag loops, git-arg-injection guards, fail-closed abort guards). A silent
    # shell bug (bad quoting in a cmdline edit, an unguarded rm) can brick a box. Lints both
    # scripts/*.sh AND scripts/lib/*.sh -- lib/ holds standalone root-run helpers like
    # camera-box-grow-root.sh (first-boot growpart/resize2fs) that NO top-level script sources,
    # so the non-recursive glob would otherwise leave them uncovered. Gate at `-S warning`
    # (errors + warnings fail the build); the many style/info-level findings are a DELIBERATE
    # floor, not weakening -- advisory-only, no CI block. GitHub's
    # ubuntu-latest ships shellcheck preinstalled, so no separate install step is needed; the
    # apt-get fallback below is a cheap belt-and-suspenders in case that ever changes upstream.
    steps:
      - uses: actions/checkout@v4

      - name: Ensure shellcheck is installed
        run: command -v shellcheck >/dev/null || (sudo apt-get update && sudo apt-get install -y shellcheck)

      - name: Shellcheck (warning severity, binary gate)
        run: shellcheck -S warning scripts/*.sh scripts/lib/*.sh

  deploy-fleet:
    name: Deploy to camera fleet (post-merge, main only)
    # #1136: automatic post-merge fleet deploy — closes the hole where a merged fix sat in main
    # UNDEPLOYED for a week (the fleet ran a stale build while the E2E gate stayed green). Runs ONLY
    # on a push to main (never dev — dev builds must not auto-deploy to prod cameras), on the
    # self-hosted dev1 runner (the ONLY box with SSH to the rig LAN). Downloads the
    # camera-box-linux-amd64 artifact built by THIS SAME run's `build` job and deploys it to every
    # ACTIVE cam box (CAMERA_ACTIVE_SET minus acked-offline, via scripts/lib/deploy-set.sh) by
    # REUSING scripts/deploy-fleet.sh (stop → remount,rw → scp → start → remount,ro → byte-verify →
    # version read-back → genlock-emit check — no new deploy code, no new credential: deploy-fleet.sh
    # already defaults SSH_PASS to the fleet-wide value). Fails LOUDLY on any active-and-unacked box
    # that mismatches or is unreachable; an acked-offline box is skipped. The push:[dev,main] E2E
    # gate's #1136 pin layer then holds "fleet == main" as a hard invariant on every run.
    # Gate on every job that bears on the SHIPPED Linux binary or the deploy SCRIPTS this job
    # reuses: lint+test (binary correctness), build (the artifact), security (cargo audit — an
    # advisory DB can turn a yesterday-green commit red), shellcheck (guards deploy-fleet.sh /
    # deploy-set.sh / camera-set.sh — a shell bug here can brick a box). A RED in any of these must
    # NOT auto-deploy to prod cameras. (coverage/mutants/python-tests/windows-probe/drift-guard are
    # deliberately excluded — they don't bear on the Linux binary or the deploy shell.)
    needs: [lint, test, build, security, shellcheck]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, camera-lan]
    # Share the E2E hardware-serialization slot (loopback-e2e.yml / full-path-e2e.yml's group) so a
    # deploy NEVER restarts camera-box mid-E2E. cancel-in-progress:false = queue, never cancel.
    concurrency:
      group: loopback-e2e-hardware
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download camera-box binary (this run's build job)
        uses: actions/download-artifact@v4
        with:
          name: camera-box-linux-amd64
          path: dist

      # #1138: also fetch the frame-probe (cam2 painter) binary from THIS SAME run's build job so
      # the fleet deploy re-arms cam2's painter on the current build too (closing the "frame-probe
      # never auto-deployed" hole — it was previously installed only by setup-device.sh provisioning).
      - name: Download probe tools (frame-probe — this run's build job, #1138)
        uses: actions/download-artifact@v4
        with:
          name: probe-tools-linux-amd64
          path: dist-probe

      - name: Deploy to the active cam fleet (acked-offline boxes skipped)
        run: |
          set -euo pipefail
          chmod +x dist/camera-box
          chmod +x dist-probe/frame-probe
          echo "Deploying camera-box $(dist/camera-box --version 2>/dev/null | awk '{print $NF}') to the active fleet"
          # shellcheck source=scripts/camera-set.sh
          . scripts/camera-set.sh            # CAMERA_ACTIVE_SET
          # shellcheck source=scripts/lib/cambox-offline-ack.sh
          . scripts/lib/cambox-offline-ack.sh
          # shellcheck source=scripts/lib/deploy-set.sh
          . scripts/lib/deploy-set.sh
          # Effective offline-ack = rig-fleet.txt default (the automatic push carries no override).
          ack="$(cambox_offline_ack_effective "${CAMBOX_OFFLINE_ACK:-}" rig-fleet.txt)"
          deploy_set="$(deploy_set_active_minus_acked "$CAMERA_ACTIVE_SET" "$ack")"
          if [ -z "$deploy_set" ]; then
            echo "::error::no active cam box to deploy to (every box in CAMERA_ACTIVE_SET is acked-offline in rig-fleet.txt) — refusing a vacuous deploy"
            exit 1
          fi
          echo "Active set: [$CAMERA_ACTIVE_SET]  ->  deploy set (minus acked): [$deploy_set]"
          CAMERA_SET="$deploy_set" scripts/deploy-fleet.sh --binary dist/camera-box --frame-probe dist-probe/frame-probe

  notify-on-failure:
    name: Notify on red
    # Fires only when a gate above goes RED — replaces silent-red eyeballing
    # (#25). Covers these unit/build gates today and auto-covers #9's scheduled
    # loopback/full-path E2E job once it is added to this workflow. Posts via the
    # NewLevelMedia Discord bot directly to #notifications (the channel the fleet
    # watches). Secrets: DISCORD_BOT_TOKEN (bot token) + DISCORD_CHANNEL_ID
    # (#notifications id). NOTE: the older n8n CLAUDE_DISCORD_WEBHOOK_URL relay
    # accepts POSTs (HTTP 200) but no longer DELIVERS to Discord, so the bot REST
    # API is used directly — Discord returns the created message object on success.
    needs: [lint, test, coverage, mutants, python-tests, bkshading, bkshading-windows, build, windows-probe, security, drift-guard, shellcheck, deploy-fleet]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Discord alert (bot API → #notifications)
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHANNEL_ID:-}" ]; then
            echo "DISCORD_BOT_TOKEN/DISCORD_CHANNEL_ID not set — skipping alert."
            exit 0
          fi
          # Name every gate job that failed.
          failed=$(printf '%s' "$RESULTS" \
            | jq -r '[to_entries[] | select(.value.result=="failure") | .key] | join(", ")')
          [ -z "$failed" ] && failed="unknown"
          content="🔴 **camera-box CI red** on \`${REF}\` (${SHA:0:7}, ${EVENT}) — failed: ${failed} — ${RUN_URL}"
          payload=$(jq -n --arg c "$content" '{content:$c}')
          curl -fsS --max-time 10 -X POST \
            -H "Authorization: Bot ${BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages" >/dev/null
          echo "Alert posted to #notifications for: ${failed}"
