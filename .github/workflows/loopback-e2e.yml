name: Loopback E2E (hardware · self-hosted dev1)

# Hardware frame-loss/latency evidence run for the single-box cam2 HDMI loopback
# (scripts/loopback-e2e.sh). This is the ONLY camera-box workflow that drives real
# hardware, so it is deliberately:
#   * MANUAL ONLY (workflow_dispatch) — NO push / pull_request triggers. The run stops
#     camera-box on cam2 and runs it without --display for the duration, taking that
#     camera OFF-AIR. An operator must dispatch it knowing cam2 is free to disrupt — the
#     operator is the guard (per project decision; no automated streaming guard).
#   * runs-on the self-hosted dev1 runner (label `camera-lan`) — GitHub-hosted runners
#     cannot reach cam2/strih/stream on the 10.77.9.0/24 LAN. See docs/self-hosted-runner.md.
#   * NOT part of ci.yml — it never gates a PR.
# It touches ONLY cam2 (the off-air rig), NOT the production strih/stream OBS boxes.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "coverage (gate) | full-rate (stress)"
        type: choice
        options: [coverage, full-rate]
        default: coverage
      duration_secs:
        description: "Run duration in seconds (job ceiling 30 min incl. build — keep ≤1500)"
        default: "300"
      cam_ip:
        description: "cam2 IP"
        default: "10.77.9.62"
      source:
        description: "NDI source name (\"<machine> (<ndi_name>)\")"
        default: "CAM2 (usb)"

permissions:
  contents: read

# Never run two hardware runs at once (they both fight for cam2).
concurrency:
  group: loopback-e2e-hardware
  cancel-in-progress: false

jobs:
  loopback:
    runs-on: [self-hosted, linux, camera-lan]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run cam2 loopback frame-loss E2E
        env:
          CAM_IP: ${{ inputs.cam_ip }}
          SOURCE: ${{ inputs.source }}
          MODE: ${{ inputs.mode }}
          DURATION_SECS: ${{ inputs.duration_secs }}
          # Optional: set repo secret CAM_PASS to override; empty falls back to the
          # script's documented LAN default, so no credential is committed here.
          CAM_PASS: ${{ secrets.CAM_PASS }}
          LOCAL_OUT: ./frame-probe-${{ inputs.mode }}.json
        run: bash scripts/loopback-e2e.sh

      - name: Upload metrics artifact
        if: always() # keep the evidence even on a failing verdict
        uses: actions/upload-artifact@v4
        with:
          name: frame-probe-${{ inputs.mode }}
          path: ./frame-probe-*.json
          if-no-files-found: warn

      - name: Re-assert camera-box is running on cam2 (cancel-safe)
        if: always() # the script's trap restores it; this is a belt-and-braces check
        env:
          CAM_IP: ${{ inputs.cam_ip }}
          CAM_PASS: ${{ secrets.CAM_PASS }}
        run: |
          PASS="${CAM_PASS:-newlevel}"
          # Kill any orphaned MANUAL frame-probe/camera-box first (edge: hard network
          # partition can strand the script's remote processes, which would hold
          # /dev/video0 against the service restart). pkill -x = exact process-NAME
          # match — it can never match this ssh command's own remote shell (a `-f`
          # cmdline pattern did exactly that on the first dispatch: it matched the
          # plain 'camera-box' text in the systemctl part of the same command line,
          # killed the shell, and the repair never ran → exit 255).
          sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            "root@${CAM_IP}" \
            "pkill -x frame-probe 2>/dev/null; \
             systemctl is-active camera-box >/dev/null || { pkill -x camera-box 2>/dev/null; sleep 1; systemctl restart camera-box; }; \
             echo -n 'camera-box: '; systemctl is-active camera-box || { sleep 5; systemctl is-active camera-box; }"
