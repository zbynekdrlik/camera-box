        shell: pwsh
        run: |
          $src = (Get-Content "vendor/distroav/src/ndi-source.cpp" -Raw) -replace '\s+', ' '
          if ($src -notmatch [regex]::Escape('pthread_mutex_t config_mutex')) {
            Write-Error "ndi-source.cpp: per-source config_mutex missing — #93 source-name UAF fix reverted"; exit 1
          }
          if ($src -notmatch [regex]::Escape('pthread_mutex_init(&s->config_mutex')) {
            Write-Error "ndi-source.cpp: config_mutex never pthread_mutex_init'd — #93 fix reverted"; exit 1
          }
          if ($src -notmatch [regex]::Escape('pthread_mutex_destroy(&s->config_mutex')) {
            Write-Error "ndi-source.cpp: config_mutex never pthread_mutex_destroy'd — #93 fix reverted"; exit 1
          }
          if ($src -notmatch [regex]::Escape('recv_desc.source_to_connect_to.p_ndi_name = owned_source_name')) {
            Write-Error "ndi-source.cpp: recv_desc no longer binds the av_thread-owned source-name copy — #93 fix reverted"; exit 1
          }
          if ($src -notmatch [regex]::Escape('recv_desc.p_ndi_recv_name = owned_receiver_name')) {
            Write-Error "ndi-source.cpp: recv_desc no longer binds the av_thread-owned receiver-name copy — #93 fix reverted"; exit 1
          }
          if ($src -match [regex]::Escape('recv_desc.source_to_connect_to.p_ndi_name = s->config.ndi_source_name')) {
            Write-Error "ndi-source.cpp: recv_desc is borrowing the live s->config.ndi_source_name again (stock code) — #93 UAF is BACK"; exit 1
          }
          if ($src -match [regex]::Escape('recv_desc.p_ndi_recv_name = s->config.ndi_receiver_name')) {
            Write-Error "ndi-source.cpp: recv_desc is borrowing the live s->config.ndi_receiver_name again (stock code) — #93 UAF is BACK"; exit 1
          }
          # on_ndi_source_renamed is the SECOND writer of ndi_receiver_name and must hold
          # the lock too (review). Assert the renamed handler still takes config_mutex.
          # Capture from its signature to its closing brace (the handler currently has no
          # inner '{ }' block, so [^}]*?\} reaches the right brace). The canonical robust
          # guard is the Rust test on_ndi_source_renamed_takes_the_config_lock (next-
          # function-boundary extraction); this pwsh check keeps the prod build in
          # lock-step with it.
          $renamed = ''
          if ($src -match 'void on_ndi_source_renamed\([^}]*?\}') { $renamed = $matches[0] }
          if ($renamed -notmatch [regex]::Escape('pthread_mutex_lock(&s->config_mutex')) {
            Write-Error "ndi-source.cpp: on_ndi_source_renamed no longer locks config_mutex around the ndi_receiver_name realloc — #93 residual UAF"; exit 1
          }
          Write-Output "DistroAV NDI source-name UAF fix present (config_mutex at update + reset + rename, av_thread-owned name copies, no live config-pointer borrow) — OK"

      # #150: assert the genlock NDI-source config LOCKDOWN is present in the vendored
      # DistroAV BEFORE the 150-min build. The root fix (confirmed live 2026-06-22): a
      # genlock NDI source must EXPOSE ONLY source-selection + genlock preload and
      # HARDCODE every other certified zero-loss value at the code level, so no input,
      # scene, human or harness can misconfigure it (an incompletely-configured probe
      # ingest decoded 0 at strih while the certified prod input decoded 100% off the
      # SAME NDI source). Mirrors the canonical Linux-CI guard
      # tests/distroav_genlock_lockdown.rs (that crate is Linux-only — it can't compile
      # on this windows-2022 runner), so the same source tokens are re-asserted here in
      # pwsh. A future `git subtree pull` (#44) that drops the lockdown fails HERE.
      - name: Assert genlock NDI-source config lockdown present (#150)
        shell: pwsh
        run: |
          $ndi = (Get-Content "vendor/distroav/src/ndi-source.cpp" -Raw) -replace '\s+', ' '
          if ($ndi -notmatch [regex]::Escape('force_genlock_certified_settings')) {
            Write-Error "ndi-source.cpp: the #150 certified-value forcer (force_genlock_certified_settings) is gone — a genlock source could come up misconfigured. Re-apply the #150 lockdown"; exit 1
          }
          # #257: the forcer is driven by the GENLOCK_FORCED_SETTINGS const table (the COMPLEMENT of
          # the whitelist), not individual obs_data_set calls. Assert every certified key is a table
          # entry — the critical ones that caused the live 0-decode (hw_accel, audio) + the timing
          # trio (sync/bw/latency) + ptz (now forced too).
          foreach ($needle in @(
            '{PROP_SYNC, false, PROP_SYNC_NDI_SOURCE_TIMECODE, false}',
            # #764 deliberately re-pinned this from STOP_RESUME_LAST_FRAME to KEEP_ACTIVE
            # (see the `/* #764: was STOP_RESUME_LAST_FRAME */` comment on the table entry in
            # ndi-source.cpp). This assert was never updated with it, so the Windows genlock
            # build has failed on a STALE expectation since 2026-07-15 — invisible because the
            # workflow is workflow_dispatch-only and was not run again until 2026-07-29. Assert
            # the value the forcer is SUPPOSED to pin today; the guard's job is that the key is
            # pinned at all, and that its certified value cannot drift unnoticed.
            '{PROP_BEHAVIOR, false, PROP_BEHAVIOR_KEEP_ACTIVE, false}',
            '{PROP_BANDWIDTH, false, PROP_BW_HIGHEST, false}',
            '{PROP_LATENCY, false, PROP_LATENCY_NORMAL, false}',
            '{PROP_HW_ACCEL, true, 0, true}',
            '{PROP_AUDIO, true, 0, false}',
            '{PROP_FRAMESYNC, true, 0, false}',
            '{PROP_FIX_ALPHA, true, 0, false}',
            '{PROP_PTZ, true, 0, false}')) {
            if ($ndi -notmatch [regex]::Escape($needle)) {
              Write-Error "ndi-source.cpp: GENLOCK_FORCED_SETTINGS no longer pins '$needle' — that key could be left misconfigured on the genlock path. Re-apply the full #150/#257 forcer table"; exit 1
            }
          }
          if ($ndi -notmatch [regex]::Escape('force_genlock_certified_settings(settings)')) {
            Write-Error "ndi-source.cpp: ndi_source_update no longer CALLS force_genlock_certified_settings(settings) — the certified values are not enforced at update time. Re-apply the #150 lockdown"; exit 1
          }
          # camera-box #767: reconnect-on-sender-restart watchdog. A genlocked, CONNECTED source
          # with no new frame for GENLOCK_RECONNECT_STALE_NS must force a full receiver rebind — the
          # steady loop has no self-rebind path, and a hard-reboot half-open connection never drops
          # no_connections to 0, so NDI's own name-based reconnect never fires (41-min silent black,
          # 2026-08-13). A subtree pull re-importing stock DistroAV silently drops this.
          if ($ndi -notmatch [regex]::Escape('static inline bool genlock_reconnect_decision(')) {
            Write-Error "ndi-source.cpp: the #767 genlock_reconnect_decision watchdog helper is gone -- a genlocked source never rebinds when its sender instance restarts. Re-apply the #767 watchdog"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('genlock_reconnect_decision(genlock_source_is_active(s->obs_source), no_conn,')) {
            Write-Error "ndi-source.cpp: the receiver loop no longer CALLS the #767 reconnect watchdog with the live source state -- a stale genlocked source is never force-rebound. Re-apply the #767 wiring"; exit 1
          }
          # camera-box #1080: a failed recv_create_v3 in the reset path must NOT permanently kill the
          # receiver thread. A break there leaves s->running true, so ndi_source_update's if (s->running)
          # never restarts it (reattach-proof black); since #767 the stale watchdog reaches this path
          # unattended. It must back off + retry instead. A subtree pull re-importing stock DistroAV
          # silently drops this (mirrors tests/distroav_recv_create_retry_1080.rs).
          if ($ndi -notmatch [regex]::Escape('static inline uint64_t ndi_recv_create_retry_backoff_ns(')) {
            Write-Error "ndi-source.cpp: the #1080 ndi_recv_create_retry_backoff_ns backoff helper is gone -- a transient recv_create_v3 failure permanently kills the receiver thread. Re-apply the #1080 retry"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('ndi_recv_create_retry_backoff_ns(recv_create_fail_count)')) {
            Write-Error "ndi-source.cpp: the reset block no longer CALLS ndi_recv_create_retry_backoff_ns(recv_create_fail_count) -- a failed recv_create_v3 is no longer backed off + retried (reverts to the permanent-death break). Re-apply the #1080 retry"; exit 1
          }
          # camera-box #1096: the strih receiver wedges after a cambox sender restart -- recv_create_v3
          # connect-by-name re-consults the poisoned long-lived per-process finder (stale rotated-port
          # address) and never re-resolves; only an OBS restart clears it. The fix resolves the source
          # via a FRESH NDIlib_find per reset and connects BY-ADDRESS (p_url_address). A subtree pull
          # re-importing stock DistroAV silently drops this (mirrors tests/distroav_fresh_finder_connect_1096.rs).
          if ($ndi -notmatch [regex]::Escape('static inline const char *ndi_find_url_for_source_name(')) {
            Write-Error "ndi-source.cpp: the #1096 ndi_find_url_for_source_name URL-picker helper is gone -- the receiver can no longer connect BY-ADDRESS and stays wedged after a sender restart. Re-apply the #1096 fix"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('ndiLib->find_create_v2(')) {
            Write-Error "ndi-source.cpp: the #1096 reset block no longer creates a FRESH NDIlib_find (find_create_v2) -- the receiver keeps resolving through the poisoned long-lived finder. Re-apply the #1096 fix"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('ndi_find_url_for_source_name(owned_source_name,')) {
            Write-Error "ndi-source.cpp: the #1096 reset block no longer calls ndi_find_url_for_source_name(owned_source_name, ...) to pick the fresh URL. Re-apply the #1096 wiring"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('recv_desc.source_to_connect_to.p_url_address = owned_source_url;')) {
            Write-Error "ndi-source.cpp: the #1096 reset block no longer binds the fresh URL onto recv_desc.source_to_connect_to.p_url_address -- it still connects by name through the poisoned finder. Re-apply the #1096 connect-by-URL"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('ndiLib->find_destroy(')) {
            Write-Error "ndi-source.cpp: the #1096 fresh finder is never find_destroy'd (per-reset leak). Re-apply the #1096 fix"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('uint64_t no_conn_since_ns = 0;')) {
            Write-Error "ndi-source.cpp: the #1096 no_conn_since_ns disconnect timer is gone -- the no_connections==0 path can no longer arm a fresh-finder reset, so a GRACEFUL cambox restart (clean FIN -> no_conn==0, where #767 never fires) leaves the strih source black. Re-apply the #1096 no-connection recovery"; exit 1
          }
          # camera-box #1180 (P0 2026-08-23): a BY-URL bind (#1096) never verifies the connected
          # sender's NAME, so a sender-restart NDI port reshuffle can bind the receiver to the WRONG
          # sender and frames flow from the wrong camera under the stored label with nothing re-checking
          # (every "2ME PGM" receiver showed Grading/cam3 live). The fix re-resolves the name via a
          # FRESH finder once frames flow and forces a BY-NAME reset on a confirmed mismatch. A subtree
          # pull re-importing stock DistroAV silently drops this (mirrors tests/distroav_by_url_identity_verify_1180.rs).
          if ($ndi -notmatch [regex]::Escape('static inline bool ndi_by_url_identity_mismatch(')) {
            Write-Error "ndi-source.cpp: the #1180 ndi_by_url_identity_mismatch decision helper is gone -- a BY-URL receiver never re-validates it is bound to the RIGHT sender, so a reshuffled port shows the wrong camera under the stored label. Re-apply the #1180 identity verify"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('if (!force_by_name_1180 && owned_source_name && owned_source_name[0]) {')) {
            Write-Error "ndi-source.cpp: the #1180 reset block no longer gates the #1096 fresh-finder BY-URL resolution on !force_by_name_1180 -- a confirmed identity mismatch cannot force a BY-NAME reset and would re-resolve the SAME wrong-sender URL. Re-apply the #1180 force-by-name gate"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('ndi_by_url_identity_mismatch(owned_source_url, verify_url_1180)')) {
            Write-Error "ndi-source.cpp: the #1180 verify block no longer calls ndi_by_url_identity_mismatch(owned_source_url, verify_url_1180) once frames flow -- a wrong-sender BY-URL bind is never detected. Re-apply the #1180 verify wiring"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('force_by_name_next_reset_1180 = true;')) {
            Write-Error "ndi-source.cpp: the #1180 verify no longer sets force_by_name_next_reset_1180 = true on a mismatch -- the wrong-sender feed is never corrected. Re-apply the #1180 corrective reset"; exit 1
          }
          # camera-box #1097: the framesync_create failure branch in the reset path must retry (not
          # break) -- the dormant sibling of #1080 (framesync forced OFF today, but a break there is
          # the SAME permanent, reattach-proof receiver-thread death). It uses its OWN
          # framesync_create_fail_count with the SHARED #1080 backoff helper. A subtree pull
          # re-importing stock DistroAV silently drops this (mirrors tests/distroav_framesync_create_retry_1097.rs).
          if ($ndi -notmatch [regex]::Escape('unsigned framesync_create_fail_count = 0;')) {
            Write-Error "ndi-source.cpp: the #1097 framesync_create_fail_count retry counter is gone -- a transient framesync_create failure would break the receiver loop and permanently kill the thread (reattach-proof black). Re-apply the #1097 retry"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('ndi_recv_create_retry_backoff_ns(framesync_create_fail_count)')) {
            Write-Error "ndi-source.cpp: the #1097 framesync branch no longer CALLS ndi_recv_create_retry_backoff_ns(framesync_create_fail_count) -- a failed framesync_create reverts to the permanent-death break. Re-apply the #1097 retry"; exit 1
          }
          # #257: the UI is a HARD WHITELIST — the forced knobs are REMOVED from the UI (not hidden via
          # apply_genlock_lockdown_visibility, which is gone). getproperties must expose EXACTLY the
          # 4 whitelist props and the forced knobs (e.g. behavior list) must NOT be added.
          if ($ndi -match [regex]::Escape('apply_genlock_lockdown_visibility')) {
            Write-Error "ndi-source.cpp: apply_genlock_lockdown_visibility is BACK — #257 replaced hide-on-lockdown with a hard whitelist (the knob is removed from the UI, not hidden)"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('GENLOCK_WHITELIST_PROPS')) {
            Write-Error "ndi-source.cpp: the GENLOCK_WHITELIST_PROPS whitelist is gone — #257 hard-lock UI reverted"; exit 1
          }
          if ($ndi -match [regex]::Escape('obs_properties_add_list(props, PROP_BEHAVIOR')) {
            Write-Error "ndi-source.cpp: PROP_BEHAVIOR is BACK in the UI — #257 whitelist exposes only source/Genlock/Latency/burn"; exit 1
          }
          # #257: the burn is a per-source bool applied at runtime in ndi_source_update.
          if ($ndi -notmatch [regex]::Escape('obs_properties_add_bool(props, PROP_BURN')) {
            Write-Error "ndi-source.cpp: the PROP_BURN measurement-burn toggle is gone from the whitelist UI — #257 reverted"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('obs_source_set_genlock_burn')) {
            Write-Error "ndi-source.cpp: ndi_source_update no longer applies obs_source_set_genlock_burn — #257 runtime burn toggle inert"; exit 1
          }
          # #795: the NDI source selector must be a NON-editable LIST combo (free text into the source
          # name black-screened a live event 2026-07-17), and the currently-saved source name must be
          # injected so a LIST combo can never clobber a saved-but-undiscovered source on open.
          if ($ndi -match [regex]::Escape('OBS_COMBO_TYPE_EDITABLE')) {
            Write-Error "ndi-source.cpp: OBS_COMBO_TYPE_EDITABLE is BACK — #795 the genlock NDI source selector must be list-only; a free-text combo let a keystroke mangle the stored source name black (2026-07-17)"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('OBS_COMBO_TYPE_LIST, OBS_COMBO_FORMAT_STRING')) {
            Write-Error "ndi-source.cpp: the PROP_SOURCE selector is no longer a LIST combo (OBS_COMBO_TYPE_LIST) — #795 reverted"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('genlock_ensure_saved_source_listed(source_list, s)')) {
            Write-Error "ndi-source.cpp: ndi_source_getproperties no longer injects the saved source name (genlock_ensure_saved_source_listed) — #795 a LIST combo would clobber a saved-but-undiscovered source on properties-open"; exit 1
          }
          Write-Output "Genlock NDI-source HARD-LOCK present (#257: GENLOCK_FORCED_SETTINGS table forces sync/behavior/bw/latency/hw_accel/audio/framesync/alpha/ptz; whitelist UI = source/Genlock/Latency/burn; burn applied at runtime; #795 source selector is LIST-only + saved-name preserved) — OK"

      # cmake steps run under bash: pwsh tokenization splits -DNAME=32.2.0 at the
      # #111: assert the QR render-time burn filter (Path B) is present + build-wired in
      # the vendored DistroAV BEFORE the 150-min build, so a future `git subtree pull`
      # (#44) or a build-wiring regression that drops the burn filter fails HERE rather
      # than shipping a distroav.dll without the #108 per-hop-latency probe foundation.
      # Mirrors the canonical Linux-CI guard tests/burn_payload_parity.rs (Linux-only —
      # it compiles+runs the C++ encoder with g++, which can't run in this build job).
      # Keep both in lock-step.
      - name: Assert QR render-time burn filter present (#111)
        shell: pwsh
        run: |
          $flt = (Get-Content "vendor/distroav/src/ndi-burn-filter.cpp" -Raw) -replace '\s+', ' '
          if ($flt -notmatch [regex]::Escape('burn_payload::encode')) {
            Write-Error "ndi-burn-filter.cpp: no longer calls burn_payload::encode — the burned payload would not match the Rust decoder (#111 reverted)"; exit 1
          }
          if ($flt -notmatch [regex]::Escape('burn_clock::gen_ts_ns')) {
            Write-Error "ndi-burn-filter.cpp: no longer stamps the RAW render-instant wall-clock gen_ts_ns (burn_clock::gen_ts_ns) — node stamp would not share cam2's RAW painter timebase and #108's cam->strih subtraction would be biased (finding #2)"; exit 1
          }
          # #257: the burn is gated by the per-source genlock_burn bool (read LIVE from the parent
          # source each render), NOT env. The OBS_BURN_* env reads MUST be gone; the run_id/corner come
          # from the host role; the reserved run_ids (911002/911004) stay.
          if ($flt -match [regex]::Escape('getenv("OBS_BURN')) {
            Write-Error "ndi-burn-filter.cpp: OBS_BURN_* env read is BACK — #257 made the burn a per-source genlock_burn bool (no env)"; exit 1
          }
          if ($flt -notmatch [regex]::Escape('obs_source_get_genlock_burn')) {
            Write-Error "ndi-burn-filter.cpp: the burn no longer reads the parent source's genlock_burn flag (obs_source_get_genlock_burn) — #257 runtime burn gate reverted"; exit 1
          }
          if ($flt -notmatch [regex]::Escape('BURN_RUN_ID_DEFAULT_STRIH 911002') -or $flt -notmatch [regex]::Escape('BURN_RUN_ID_DEFAULT_STREAM 911004')) {
            Write-Error "ndi-burn-filter.cpp: the reserved per-node run_ids (911002 strih / 911004 stream) drifted — #108 pairing would break"; exit 1
          }
          if ($flt -notmatch [regex]::Escape('burn_host_is_stream')) {
            Write-Error "ndi-burn-filter.cpp: run_id no longer derived from the host role (burn_host_is_stream) — #257 reverted"; exit 1
          }
          # #111 4-corner layout: the burn MUST be placed in this node's bottom CORNER via the
          # shared corner geometry (strih=bottom-left, stream=bottom-right), NOT a center-bottom
          # strip — otherwise the strih + stream burns overlap each other (strih->stream 0 paired
          # frames) and the camera dual-QR. Lock-step with tests/burn_payload_parity.rs.
          if ($flt -notmatch [regex]::Escape('burn_geom::corner_placement')) {
            Write-Error "ndi-burn-filter.cpp: the burn no longer uses burn_geom::corner_placement — it would draw a center-bottom strip that overlaps the other node's burn and the camera QR (the #111 readability/0-paired-frames bug)"; exit 1
          }
          if (!(Test-Path "vendor/distroav/src/burn-geom.hpp")) {
            Write-Error "vendor/distroav/src/burn-geom.hpp missing — the #111 4-corner placement geometry was dropped; the burn would fall back to a center strip that overlaps the other QRs"; exit 1
          }
          $pm = (Get-Content "vendor/distroav/src/plugin-main.cpp" -Raw) -replace '\s+', ' '
          if ($pm -notmatch [regex]::Escape('create_ndi_burn_filter_info')) {
            Write-Error "plugin-main.cpp: the burn filter is not registered (create_ndi_burn_filter_info) — OBS would not expose it (#111 reverted)"; exit 1
          }
          $cm = (Get-Content "vendor/distroav/CMakeLists.txt" -Raw) -replace '\s+', ' '
          if ($cm -notmatch [regex]::Escape('src/ndi-burn-filter.cpp')) {
            Write-Error "CMakeLists.txt: ndi-burn-filter.cpp not in target_sources — it would not compile into distroav.dll (#111 build-wiring reverted)"; exit 1
          }
          if ($cm -notmatch [regex]::Escape('src/qrcodegen/qrcodegen.cpp')) {
            Write-Error "CMakeLists.txt: vendored qrcodegen.cpp not in target_sources — the burn filter would not link (#111 build-wiring reverted)"; exit 1
          }
          if (!(Test-Path "vendor/distroav/src/qrcodegen/qrcodegen.hpp")) {
            Write-Error "vendor/distroav/src/qrcodegen/qrcodegen.hpp missing — the vendored QR encoder (Nayuki, MIT) was dropped (#111 reverted)"; exit 1
          }
          Write-Output "QR render-time burn filter present (#257: burn_payload::encode + gen_ts_ns + per-source genlock_burn gate + host-role run_ids 911002/911004 + 4-corner burn_geom::corner_placement + registered + CMake-wired + vendored qrcodegen) — OK"

      # dots (cmake received a stray '.1.2' preset path) — bash quoting is exact.
      - name: Configure OBS (windows-x64 preset + genlock build flags)
        working-directory: vendor/obs-studio
        shell: bash
        run: >
          cmake --preset windows-x64
          '-DOBS_VERSION_OVERRIDE=32.2.0'
          -DENABLE_WHATSNEW=OFF
          -DENABLE_AJA=OFF
          -DENABLE_VLC=OFF
          -DENABLE_TEST_INPUT=OFF

      - name: Build OBS
        working-directory: vendor/obs-studio
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      - name: Install OBS SDK prefix
        working-directory: vendor/obs-studio
        shell: bash
        run: |
          cmake --install build_x64 --config RelWithDebInfo --prefix "$GITHUB_WORKSPACE/obs-sdk"
          # #188: the default install omits the EXCLUDE_FROM_ALL "Development" component (the cmake
          # package configs libobsConfig.cmake / obs-frontend-apiConfig.cmake + headers + import
          # libs). The standalone av-sync-dock build needs them, so install it explicitly.
          cmake --install build_x64 --config RelWithDebInfo --prefix "$GITHUB_WORKSPACE/obs-sdk" --component Development

      - name: Configure DistroAV against the genlocked OBS
        working-directory: vendor/distroav
        shell: bash
        run: >
          cmake -B build_x64 -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/obs-sdk"
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build DistroAV
        working-directory: vendor/distroav
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      # #398 (Option A, the #269 lock-step) — see windows-genlock-fast.yml for the full rationale;
      # duplicated here so the slow/full build path can't silently ship a reverted dock either.
      - name: Assert camera-box dual-QR dock patch present (#398)
        shell: pwsh
        run: |
          if (-not (Test-Path "vendor/av-sync-dock/src/camera-box-qr.hpp")) { Write-Error "camera-box-qr.hpp is gone (#398) — the dock no longer knows our dual-QR wire format"; exit 1 }
          $hdr = (Get-Content "vendor/av-sync-dock/src/camera-box-qr.hpp" -Raw)
          if ($hdr -notmatch [regex]::Escape('decode_camera_box_qr')) { Write-Error "decode_camera_box_qr gone (#398)"; exit 1 }
          if ($hdr -notmatch [regex]::Escape('0xEDB88320')) { Write-Error "camera-box-qr.hpp CRC-32/ISO-HDLC polynomial gone (#398) — no longer matches src/payload.rs"; exit 1 }
          $src = (Get-Content "vendor/av-sync-dock/src/sync-test-output.cpp" -Raw) -replace '\s+', ' '
          if ($src -notmatch [regex]::Escape('#include "camera-box-qr.hpp"')) { Write-Error "camera-box-qr.hpp include gone from sync-test-output.cpp (#398)"; exit 1 }
          if ($src -notmatch [regex]::Escape('decode_camera_box_qr((char *)data.payload, &cb)')) { Write-Error "camera-box dual-QR try-first decode gone (#398) — dock reverted to norihiro-only"; exit 1 }
          if ($src -notmatch [regex]::Escape('cb_video_ts_ns[256]')) { Write-Error "camera-box video-ring (live pairing) gone (#398)"; exit 1 }
          if ($src -notmatch [regex]::Escape('signal_sync_found(st->context, &si)')) { Write-Error "camera-box live sync_found emit gone (#398) — dock would stop showing our live offset"; exit 1 }
          if (([regex]::Matches($src, [regex]::Escape('si.gate_convention = true;'))).Count -ne 2) { Write-Error "camera-box gate_convention emit tags != 2 (#999) — the display sign-convention fix dropped from an emit site"; exit 1 }
          if (([regex]::Matches($src, [regex]::Escape('camerabox::cb_corrected_video_ts_is_valid(corrected_video_ts)'))).Count -ne 2) { Write-Error "camera-box corrected_video_ts validity guard != 2 (#1005) — the garbage-clamp fix dropped from an emit site"; exit 1 }
          if ($src -match [regex]::Escape('corrected_video_ts > 0 ? (uint64_t)corrected_video_ts : 0')) { Write-Error "camera-box OLD garbage-clamp ternary still present (#1005) — the clamp-and-emit-anyway fix was reverted"; exit 1 }
          $dock = (Get-Content "vendor/av-sync-dock/src/sync-test-dock.cpp" -Raw) -replace '\s+', ' '
          if ($dock -notmatch [regex]::Escape('cb_dock_latency_display_ms(dock_native_ts_ns, data.gate_convention)')) { Write-Error "on_sync_found no longer routes through cb_dock_latency_display_ms (#999) — dock display sign fix reverted"; exit 1 }
          Write-Output "#398 camera-box dual-QR dock patch present - OK"

      # #188: build the A/V sync dock (norihiro/obs-audio-video-sync-dock, vendored) against the
      # SAME genlocked OBS SDK, standalone, mirroring the DistroAV path above. Ships as a
      # first-party OBS plugin so the user can measure LIVE A/V sync inside his own OBS.
      - name: Configure av-sync-dock against the genlocked OBS (#188)
        working-directory: vendor/av-sync-dock
        shell: bash
        run: |
          set -eu
          WS=$(cygpath "$GITHUB_WORKSPACE")
          # obs-sdk now carries the Development component (libobs / obs-frontend-api / w32-pthreads
          # cmake configs + the finders/ modules). libobsConfig also find_dependency(SIMDe, Threads)
          # and obs-frontend-api needs Qt6 — SIMDe + Qt6 live in the obs-deps the OBS/DistroAV build
          # downloaded, so add every .deps root to the prefix so all transitive deps resolve.
          PREFIX="$(cygpath -m "$WS/obs-sdk")"
          for d in "$WS"/vendor/obs-studio/.deps/*-x64 "$WS"/vendor/distroav/.deps/*-x64; do
            [ -d "$d" ] && PREFIX="$PREFIX;$(cygpath -m "$d")"
          done
          LIBOBS_CFG=$(find "$WS/obs-sdk" -maxdepth 6 -iname 'libobs*config.cmake' | head -1)
          FRONTEND_CFG=$(find "$WS/obs-sdk" -maxdepth 6 -iname 'obs-frontend-api*config.cmake' | head -1)
          echo "prefix=$PREFIX"; echo "libobs cfg=$LIBOBS_CFG"; echo "frontend cfg=$FRONTEND_CFG"
          test -n "$LIBOBS_CFG"   || { echo "ERROR: libobsConfig.cmake not in obs-sdk (Development install failed?)"; find "$WS/obs-sdk" -iname '*.cmake' | head -60; exit 1; }
          test -n "$FRONTEND_CFG" || { echo "ERROR: obs-frontend-apiConfig.cmake not in obs-sdk"; exit 1; }
          cmake -B build_x64 -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -Dlibobs_DIR="$(cygpath -m "$(dirname "$LIBOBS_CFG")")" \
            -Dobs-frontend-api_DIR="$(cygpath -m "$(dirname "$FRONTEND_CFG")")" \
            -DQT_VERSION=6 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build av-sync-dock (#188)
        working-directory: vendor/av-sync-dock
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      # SECONDARY / defense-in-depth (#55): the disable MECHANISM is the SOURCE gate at
      # the top of this job; this is a packaging-layout check that the built rundir ships
      # no `updater.exe` binary at all. It is intentionally redundant — belt-and-braces
      # against a rundir copy-rule change — and is NOT, on its own, proof the in-app
      # updater is disabled (a subtree bump could add/remove the copy rule independently
      # of the source flag). Keep both: source-flag primary, this packaging check secondary.
      - name: Assert no updater.exe in the artifact (#43 defense-in-depth, secondary to source gate, #55)
        shell: pwsh
        run: |
          $rundir = "vendor/obs-studio/build_x64/rundir/RelWithDebInfo"
          if (Test-Path "$rundir/bin/64bit/updater.exe") { Write-Error "updater.exe present in artifact — defense-in-depth packaging check failed (#43)"; exit 1 }
          Write-Output "no updater.exe in artifact — OK"

      - name: Stage artifact
        shell: pwsh
        run: |
          $rundir = "vendor/obs-studio/build_x64/rundir/RelWithDebInfo"
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item -Recurse "$rundir/*" stage/
          # DistroAV plugin + data into the OBS rundir layout
          Copy-Item "vendor/distroav/build_x64/RelWithDebInfo/distroav.dll" "stage/obs-plugins/64bit/" -ErrorAction SilentlyContinue
          if (!(Test-Path "stage/obs-plugins/64bit/distroav.dll")) {
            $dll = Get-ChildItem -Recurse vendor/distroav/build_x64 -Filter distroav.dll | Select-Object -First 1
            Copy-Item $dll.FullName "stage/obs-plugins/64bit/"
          }
          New-Item -ItemType Directory -Force -Path "stage/data/obs-plugins/distroav" | Out-Null
          Copy-Item -Recurse "vendor/distroav/data/*" "stage/data/obs-plugins/distroav/" -ErrorAction SilentlyContinue
          # av-sync-dock plugin + data (first-party OBS plugin path, #188). Fail loud if unbuilt.
          $dockdll = Get-ChildItem -Recurse vendor/av-sync-dock/build_x64 -Filter obs-audio-video-sync-dock.dll | Select-Object -First 1
          if (!$dockdll) { Write-Error "obs-audio-video-sync-dock.dll not built (#188)"; exit 1 }
          Copy-Item $dockdll.FullName "stage/obs-plugins/64bit/"
          New-Item -ItemType Directory -Force -Path "stage/data/obs-plugins/obs-audio-video-sync-dock" | Out-Null
          Copy-Item -Recurse "vendor/av-sync-dock/data/*" "stage/data/obs-plugins/obs-audio-video-sync-dock/"
          git rev-parse HEAD | Out-File stage/GENLOCK_BUILD_SHA.txt -Encoding ascii

      # #120: emit the per-component SHA manifest INTO the bundle (stage/BUNDLE_MANIFEST.json).
      # EPIC #125 / #119: a single git-HEAD txt (above) cannot catch a stale-BYTES build of the
      # right version (the #119 inert preload). The manifest records each rebuilt component's pinned
      # SOURCE (OBS/DistroAV version + vendored subtree commit, read from vendor/README.md +
      # vendor/distroav/buildspec.json — the same source-of-truth drift-guard.sh uses) AND the
      # per-file sha256 of EVERY shipped file, walked from stage/ so it is self-consistent with the
      # bundle by construction. #121 (post-deploy verify) byte/SHA-checks the deployed stack against
      # it. The generator's logic is unit-proven on the Linux CI (`test` job, tests/genlock_manifest.rs)
      # — this is the production EMISSION. git-bash on windows-2022 ships bash + sha256sum + git.
      - name: Generate per-component SHA manifest (#120)
        shell: bash
        run: |
          scripts/genlock-manifest.sh --stage stage --out stage/BUNDLE_MANIFEST.json

      # #120: self-consistency GATE — fail the build if the produced manifest does NOT match the
      # bundle (every shipped file listed with the correct sha256, no un-manifested bytes, no stale
      # entries). The generator already self-checks; this is the explicit, independent build gate so
      # the windows-genlock CI run itself proves the manifest is produced + correct (no rig needed).
      - name: Assert bundle manifest self-consistent (#120)
        shell: bash
        run: |
          scripts/genlock-manifest.sh --check stage/BUNDLE_MANIFEST.json --stage stage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-genlock-windows-x64
          path: stage/
          if-no-files-found: error
