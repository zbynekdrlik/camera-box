name: Windows genlock build (vendored OBS + DistroAV)

# Builds the PRODUCTION Windows artifact for strih/stream from the vendored,
# genlock-patched tree (#42): OBS 32.1.2 (browser ON for production parity,
# What's New / update prompts OFF per #43) + DistroAV 6.2.1 against it.
# Manual dispatch; artifacts are deployed off-air to the boxes (portable mode
# first — never overwriting the production install).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-genlock-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # PRIMARY updater-disable gate (#55): assert the SOURCE mechanism that actually
      # disables the in-app updater, NOT the packaging outcome. The genlock #43 patch
      # defaults `opt_disable_updater` to true and wires `IsUpdaterDisabled()` to it —
      # that is what stops every timed/menu/whatsnew update prompt. A future
      # `git subtree pull` (#44) that reverts the flag fails HERE — fast, before the
      # 150-min build, and independently of whether `updater.exe` lands in the rundir
      # (the secondary packaging check, below). Mirrors the canonical Linux-CI guard
      # tests/obs_updater_disabled.rs; that crate is Linux-only (v4l/alsa/evdev) and
      # cannot compile on this Windows runner, so the same source tokens are re-asserted
      # here in pwsh. The Rust guard keeps these two checks in lock-step.
      - name: Assert updater disabled at SOURCE (#43 primary mechanism, #55)
        shell: pwsh
        run: |
          $main = (Get-Content "vendor/obs-studio/frontend/obs-main.cpp" -Raw) -replace '\s+', ' '
          if ($main -notmatch [regex]::Escape('bool opt_disable_updater = true;')) {
            Write-Error "obs-main.cpp: opt_disable_updater no longer defaults to true — genlock #43 patch reverted (#55)"; exit 1
          }
          if ($main -match [regex]::Escape('bool opt_disable_updater = false;')) {
            Write-Error "obs-main.cpp: upstream 'opt_disable_updater = false' default is back — genlock #43 patch reverted (#55)"; exit 1
          }
          $app = (Get-Content "vendor/obs-studio/frontend/OBSApp.cpp" -Raw) -replace '\s+', ' '
          if ($app -notmatch [regex]::Escape('bool OBSApp::IsUpdaterDisabled() { return opt_disable_updater; }')) {
            Write-Error "OBSApp.cpp: IsUpdaterDisabled() no longer returns opt_disable_updater — #43 source wiring broken (#55)"; exit 1
          }
          Write-Output "source-flag updater-disable patch present (opt_disable_updater=true + IsUpdaterDisabled wiring) — OK"

      # #70/#102: assert the genlock FIFO patch is present in the vendored OBS source
      # BEFORE the 150-min build, so a future `git subtree pull` (#44) that reverts the
      # zero-loss fix fails HERE rather than shipping a regressed binary. #102 changed
      # the consume gate from the #70 hard-hold (`depth>preload` -> repeat, which lost a
      # distinct frame per jitter dip: 11.6%->34.3% on the live rig) to consume-when-
      # queued with a one-time startup-fill latch. Mirrors the canonical Linux-CI guard
      # tests/genlock_preload.rs (that crate is Linux-only and cannot compile on this
      # Windows runner). Keep both in lock-step.
      - name: Assert genlock FIFO consume-when-queued patch present (#70/#102)
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          # #257: OBS_GENLOCK_PRELOAD_FRAMES env was removed (preload is internal/auto). The env
          # read must be GONE; the consume-when-queued gate (#102) stays.
          if ($src -match [regex]::Escape('getenv("OBS_GENLOCK_PRELOAD_FRAMES")')) {
            Write-Error "obs-source.c: OBS_GENLOCK_PRELOAD_FRAMES env is BACK — #257 removed all genlock env (preload is internal/auto)"; exit 1
          }
          if ($src -notmatch [regex]::Escape('genlock_decide(source->async_frames.num, preload, source->genlock_filled)')) {
            Write-Error "obs-source.c: genlock_fifo no longer uses the #102 consume-when-queued decision (genlock_decide + startup-fill latch) — the loss fix reverted"; exit 1
          }
          if ($src -match [regex]::Escape('genlock_should_consume(source->async_frames.num, preload)')) {
            Write-Error "obs-source.c: the old #70 hard-hold gate genlock_should_consume is back — it repeats-on-hold and loses a distinct frame per jitter dip (#102)"; exit 1
          }
          if ($src -notmatch [regex]::Escape('source->genlock_filled')) {
            Write-Error "obs-source.c: the #102 startup-fill latch (genlock_filled) is missing — the delay line cannot build before consume-when-queued"; exit 1
          }
          if ($src -notmatch [regex]::Escape('source->genlock_underruns++')) {
            Write-Error "obs-source.c: genlock underrun audit counter missing — #70/#102 patch reverted"; exit 1
          }
          # #257: render tick + ts-align are build defaults (always on, no env). Assert both gates
          # return true unconditionally and no OBS_GENLOCK_WALL_CLOCK / _TS_ALIGN env remains.
          $vid = (Get-Content "vendor/obs-studio/libobs/obs-video.c" -Raw) -replace '\s+', ' '
          if ($vid -match [regex]::Escape('getenv("OBS_GENLOCK_WALL_CLOCK")')) {
            Write-Error "obs-video.c: OBS_GENLOCK_WALL_CLOCK env is BACK — #257 made the render tick a build default (always on)"; exit 1
          }
          if ($src -match [regex]::Escape('getenv("OBS_GENLOCK_TS_ALIGN")')) {
            Write-Error "obs-source.c: OBS_GENLOCK_TS_ALIGN env is BACK — #257 made ts-align a build default (always on)"; exit 1
          }
          Write-Output "genlock FIFO consume-when-queued patch present (#102 genlock_decide + startup-fill latch + audit) + render tick/ts-align build-default (#257, no env) — OK"

      # #97: assert the per-source runtime preload (video-delay) patch is present in
      # BOTH the vendored libobs (the API + per-source field + raised cap) and the
      # DistroAV NDI source (the slider + apply) BEFORE the 150-min build, so a future
      # `git subtree pull` (#44) that drops the runtime video-delay control fails HERE
      # rather than shipping a build without it while the version pins still pass.
      # Mirrors the canonical Linux-CI guard tests/genlock_preload.rs (Linux-only,
      # can't compile on this windows runner). Keep both in lock-step.
      - name: Assert per-source genlock preload video-delay patch present (#97)
        shell: pwsh
        run: |
          $obs = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($obs -notmatch [regex]::Escape('void obs_source_set_genlock_preload(obs_source_t *source, uint32_t')) {
            Write-Error "obs-source.c: obs_source_set_genlock_preload missing — #97 per-source preload API reverted"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('source->genlock_preload')) {
            Write-Error "obs-source.c: per-source source->genlock_preload not read in the render path — #97 reverted"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('#define GENLOCK_PRELOAD_MAX 128')) {
            Write-Error "obs-source.c: GENLOCK_PRELOAD_MAX no longer 128 — #97 video-delay headroom reverted"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('genlock_drop_cap') -and $obs -notmatch [regex]::Escape('genlock_source_drop_cap')) {
            Write-Error "obs-source.c: per-source FIFO drop-cap (genlock_source_drop_cap) missing — #97 reverted"; exit 1
          }
          # #257: preload is fully INTERNAL — the DistroAV UI slider + the set_preload apply were
          # removed (the whitelist UI). The libobs setter/field/cap stay (internal auto-derive). The
          # DistroAV slider must be GONE.
          $ndi = (Get-Content "vendor/distroav/src/ndi-source.cpp" -Raw) -replace '\s+', ' '
          if ($ndi -match [regex]::Escape('obs_properties_add_int_slider(props, PROP_GENLOCK_PRELOAD')) {
            Write-Error "ndi-source.cpp: the legacy genlock-preload slider is BACK — #257 removed it from the whitelist UI"; exit 1
          }
          Write-Output "per-source genlock preload video-delay patch present (libobs API + per-source field + cap 128 + drop-cap; #257 DistroAV slider removed) — OK"

      # #245: assert the PER-SOURCE genlock latency (ms) override is present in the
      # vendored source BEFORE the 150-min build, so a `git subtree pull` (#44) that
      # reverts it fails HERE rather than shipping a binary where the per-source latency
      # field is inert (the #235 regression: latency collapsed to one GLOBAL env knob and
      # an operator could not set 1000 ms on a single source while the others stayed low).
      # Mirrors the canonical Linux-CI guards in tests/genlock_preload.rs (probe-gated,
      # can't compile on this windows runner). Keep both in lock-step.
      - name: Assert per-source genlock latency (ms) override present (#245)
        shell: pwsh
        run: |
          $obs = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($obs -notmatch [regex]::Escape('void obs_source_set_genlock_latency_ms(obs_source_t *source, uint32_t')) {
            Write-Error "obs-source.c: obs_source_set_genlock_latency_ms missing — #245 per-source latency API reverted"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('source->genlock_latency_ms > 0 ? source->genlock_latency_ms : genlock_reserve_ms()')) {
            Write-Error "obs-source.c: the per-source latency release-deadline gate is gone — #245 override inert in the render path"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('#define GENLOCK_SOURCE_LATENCY_MS_MAX 2000')) {
            Write-Error "obs-source.c: GENLOCK_SOURCE_LATENCY_MS_MAX no longer 2000 — #245 per-source cap reverted"; exit 1
          }
          $api = (Get-Content "vendor/obs-studio/libobs/obs.h" -Raw) -replace '\s+', ' '
          if ($api -notmatch [regex]::Escape('EXPORT void obs_source_set_genlock_latency_ms(obs_source_t *source, uint32_t')) {
            Write-Error "obs.h: obs_source_set_genlock_latency_ms not EXPORTed — #245 DistroAV cannot resolve the setter"; exit 1
          }
          $ndi = (Get-Content "vendor/distroav/src/ndi-source.cpp" -Raw) -replace '\s+', ' '
          if ($ndi -notmatch [regex]::Escape('obs_properties_add_int(props, PROP_GENLOCK_LATENCY_MS_SRC')) {
            Write-Error "ndi-source.cpp: the editable per-source latency int field is gone — #245 reverted"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('obs_source_set_genlock_latency_ms')) {
            Write-Error "ndi-source.cpp: ndi_source_update no longer applies obs_source_set_genlock_latency_ms — #245 field inert"; exit 1
          }
          # #257: the latency is a build const with a FLOOR of 3 ms, and genlock is DEFAULT ON.
          if ($obs -notmatch [regex]::Escape('#define GENLOCK_LATENCY_MS_MIN 3')) {
            Write-Error "obs-source.c: GENLOCK_LATENCY_MS_MIN no longer 3 — #257 latency floor reverted"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('#define GENLOCK_LATENCY_MS_DEFAULT 3')) {
            Write-Error "obs-source.c: GENLOCK_LATENCY_MS_DEFAULT no longer 3 — #257 build-const latency reverted"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('ms < GENLOCK_LATENCY_MS_MIN ? GENLOCK_LATENCY_MS_MIN')) {
            Write-Error "obs-source.c: obs_source_set_genlock_latency_ms no longer floors at GENLOCK_LATENCY_MS_MIN (3) — #257 floor reverted (1->3, 0->3)"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('ms < PROP_GENLOCK_LATENCY_MS_MIN')) {
            Write-Error "ndi-source.cpp: ndi_source_update no longer floors the per-source latency at PROP_GENLOCK_LATENCY_MS_MIN (3) — #257 floor reverted"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('obs_data_set_default_bool(settings, PROP_GENLOCK_FIFO, true)')) {
            Write-Error "ndi-source.cpp: genlock is no longer DEFAULT ON (PROP_GENLOCK_FIFO default true) — #257 reverted"; exit 1
          }
          Write-Output "per-source genlock latency (ms) override present + #257 floor 3 (build const, 1->3/0->3) + genlock default-ON — OK"

      # #116: assert the build-latch drain-to-target patch is present in the vendored
      # OBS source BEFORE the 150-min build, so a future `git subtree pull` (#44) that
      # reverts it fails HERE rather than shipping a binary where cameras freeze at
      # unequal startup-burst depths (different latency) and the preload knob becomes
      # one-directional ("only goes up"). #116 erases the excess oldest frames at the
      # build latch so every input + every restart settles at the deterministic target
      # depth (preload+1). Mirrors the canonical Linux-CI guard tests/genlock_preload.rs
      # (Linux-only, can't compile on this windows runner). Keep both in lock-step.
      - name: Assert genlock build-latch drain-to-target patch present (#116)
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($src -notmatch [regex]::Escape('genlock_build_drain(source->async_frames.num, preload)')) {
            Write-Error "obs-source.c: ready_async_frame no longer computes the #116 build-latch drain (genlock_build_drain) — cameras freeze at unequal depths and preload becomes one-directional"; exit 1
          }
          if ($src -notmatch [regex]::Escape('static inline size_t genlock_build_drain(size_t queue_depth, uint32_t preload)')) {
            Write-Error "obs-source.c: the #116 genlock_build_drain helper is missing — re-apply the drain-to-target fix"; exit 1
          }
          if ($src -notmatch [regex]::Escape('remove_async_frame(source, dropped)')) {
            Write-Error "obs-source.c: the #116 build-latch drain no longer frees each dropped oldest frame via remove_async_frame(source, dropped) — leak/double-free risk"; exit 1
          }
          Write-Output "genlock build-latch drain-to-target patch present (genlock_build_drain + da_erase/remove_async_frame oldest-frame free) — OK"

      # #126: assert the reconnect re-arm patch is present in the vendored OBS source
      # BEFORE the 150-min build, so a future `git subtree pull` (#44) that reverts it
      # fails HERE rather than shipping a binary where an upstream OBS restart silently
      # collapses the downstream preload reserve to ~0 (A/V drift) until a manual nudge.
      # #126 tracks consecutive true-empty ticks (genlock_empty_run) and re-arms the
      # build latch on resume after a SUSTAINED run (>= GENLOCK_REARM_EMPTY_TICKS) so the
      # existing #102 build path + #116 drain rebuild the reserve. Mirrors the canonical
      # Linux-CI guard tests/genlock_preload.rs (Linux-only, can't compile on this windows
      # runner). Keep both in lock-step.
      - name: Assert genlock reconnect re-arm patch present (#126)
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($src -notmatch [regex]::Escape('#define GENLOCK_REARM_EMPTY_TICKS 30')) {
            Write-Error "obs-source.c: the #126 re-arm threshold GENLOCK_REARM_EMPTY_TICKS (30, ~1s @ 30fps) is missing — normal jitter would spuriously re-arm or the reconnect rebuild is gone"; exit 1
          }
          if ($src -notmatch [regex]::Escape('source->genlock_empty_run++')) {
            Write-Error "obs-source.c: the #126 consecutive true-empty counter (genlock_empty_run) is no longer incremented at the num==0 underrun — the reconnect re-arm can't detect a sustained gap"; exit 1
          }
          if ($src -notmatch [regex]::Escape('source->genlock_empty_run >= GENLOCK_REARM_EMPTY_TICKS')) {
            Write-Error "obs-source.c: the #126 sustained-empty re-arm guard (genlock_empty_run >= GENLOCK_REARM_EMPTY_TICKS) is gone — the downstream preload reserve will not rebuild after an upstream restart"; exit 1
          }
          if ($src -notmatch [regex]::Escape('source->genlock_empty_run = 0')) {
            Write-Error "obs-source.c: the #126 empty-run counter is never reset on a consume — a flickering queue would creep to the threshold and spuriously re-arm"; exit 1
          }
          Write-Output "genlock reconnect re-arm patch present (genlock_empty_run counter + GENLOCK_REARM_EMPTY_TICKS=30 threshold + reset-on-consume) — OK"

      # #136: assert the timestamp-aligned release patch (multi-source IN-SYNC) is
      # present in the vendored libobs BEFORE the 150-min build, so a future
      # `git subtree pull` (#44) that reverts it fails HERE rather than shipping a
      # binary that desyncs cameras (the depth-FIFO drifts per-source). #136 presents,
      # from every genlock source, the frame captured at the shared wall-clock instant
      # present_ts = wall_now - preload*interval (env-gated OBS_GENLOCK_TS_ALIGN + a
      # per-frame wall-clock guard, count-gate fallback otherwise). Mirrors the
      # canonical Linux-CI guard tests/genlock_preload.rs::vendored_source::
      # timestamp_aligned_release_present (Linux-only, can't compile on this runner).
      - name: Assert genlock timestamp-aligned release patch present (#136)
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          # #257: ts-align is a BUILD DEFAULT (genlock_ts_align_enabled returns true, no env). The
          # per-source ms gate + the wall-clock guard + the present_ts deadline stay.
          if ($src -notmatch [regex]::Escape('genlock_ts_align_enabled() || source->genlock_latency_ms > 0')) {
            Write-Error "obs-source.c: the ts-align release gate is gone — #136/#245 timestamp-aligned release reverted"; exit 1
          }
          if ($src -notmatch [regex]::Escape('genlock_is_wallclock_ts(next_frame->timestamp)')) {
            Write-Error "obs-source.c: #136 wall-clock guard (genlock_is_wallclock_ts) on the ts-align path gone — re-apply"; exit 1
          }
          if ($src -notmatch [regex]::Escape('wall_now = genlock_wall_now_ns();')) {
            Write-Error "obs-source.c: #136 wall-clock source (genlock_wall_now_ns -> wall_now) gone — re-apply"; exit 1
          }
          if ($src -notmatch [regex]::Escape('genlock_present_ts(wall_now, preload, interval)')) {
            Write-Error "obs-source.c: #136 presentation deadline (genlock_present_ts(wall_now,...)) gone — re-apply"; exit 1
          }
          Write-Output "genlock timestamp-aligned release patch present (#257 build-default ts-align + wall-clock guard + present_ts) — OK"

      # #85: assert the #78 "B′" real-wall-clock emit-timecode patch is present in the
      # vendored DistroAV OUTPUT source BEFORE the 150-min build, so a future `git
      # subtree pull` (#44) that restores `NDIlib_send_timecode_synthesize` fails HERE
      # rather than shipping a distroav.dll that reintroduces the ~150 ms emit-timecode
      # lag (#76) — which drift-guard.sh would NOT catch (it pins the DistroAV VERSION
      # 6.2.1, not fork-patch CONTENT). Mirrors the canonical Linux-CI guard
      # tests/distroav_timecode_patch.rs (that crate is Linux-only and cannot compile on
      # this Windows runner). Keep both in lock-step. The negative check targets the
      # assignment, NOT the bare token (which legitimately appears in the explanatory
      # comment here and in the unrelated ndi-filter.cpp path).
      - name: Assert DistroAV real-wall-clock emit-timecode patch present (#78, #85)
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/distroav/src/ndi-output.cpp" -Raw) -replace '\s+', ' '
          if ($src -notmatch [regex]::Escape('genlock_wall_now_100ns')) {
            Write-Error "ndi-output.cpp: genlock_wall_now_100ns missing — #78 real-wall-clock timecode patch reverted (#85)"; exit 1
          }
          if ($src -notmatch [regex]::Escape('genlock_emit_timecode_100ns')) {
            Write-Error "ndi-output.cpp: genlock_emit_timecode_100ns missing — #78 real-wall-clock timecode patch reverted (#85)"; exit 1
          }
          if ($src -notmatch [regex]::Escape('video_frame.timecode = genlock_emit_timecode_100ns(')) {
            Write-Error "ndi-output.cpp: video output frame no longer stamps genlock_emit_timecode_100ns — #78 emit patch reverted (#85)"; exit 1
          }
          if ($src -notmatch [regex]::Escape('audio_frame.timecode = genlock_wall_now_100ns()')) {
            Write-Error "ndi-output.cpp: audio output frame no longer stamps genlock_wall_now_100ns — #78 emit patch reverted (#85)"; exit 1
          }
          if ($src -match [regex]::Escape('video_frame.timecode = NDIlib_send_timecode_synthesize')) {
            Write-Error "ndi-output.cpp: stock NDIlib_send_timecode_synthesize video assignment is BACK — #78 reverted, ~150ms lag (#76) reintroduced (#85)"; exit 1
          }
          if ($src -match [regex]::Escape('audio_frame.timecode = NDIlib_send_timecode_synthesize')) {
            Write-Error "ndi-output.cpp: stock NDIlib_send_timecode_synthesize audio assignment is BACK — #78 reverted (#85)"; exit 1
          }
          Write-Output "DistroAV real-wall-clock emit-timecode patch present (genlock_emit_timecode_100ns video + genlock_wall_now_100ns audio, no synthesize assignment) — OK"

      # #93: assert the NDI source-name use-after-free fix is present in the vendored
      # DistroAV source BEFORE the 150-min build, so a future `git subtree pull` (#44)
      # that reverts it fails HERE rather than shipping a distroav.dll that re-crashes
      # strih OBS with STATUS_HEAP_CORRUPTION when a live source is re-pointed. Mirrors
      # the canonical Linux-CI guard tests/distroav_source_config_lock.rs (that crate is
      # Linux-only and cannot compile on this Windows runner). Keep both in lock-step.
      # The negative checks target the stock direct config-pointer borrows into recv_desc
      # (the exact UAF); the positive checks require the config_mutex + av_thread-owned
      # name copies.
      - name: Assert DistroAV NDI source-name UAF fix present (#93)
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/distroav/src/ndi-source.cpp" -Raw) -replace '\s+', ' '
          if ($src -notmatch [regex]::Escape('pthread_mutex_t config_mutex')) {
            Write-Error "ndi-source.cpp: per-source config_mutex missing — #93 source-name UAF fix reverted"; exit 1
          }
          if ($src -notmatch [regex]::Escape('pthread_mutex_init(&s->config_mutex')) {
            Write-Error "ndi-source.cpp: config_mutex never pthread_mutex_init'd — #93 fix reverted"; exit 1
          }
          if ($src -notmatch [regex]::Escape('pthread_mutex_destroy(&s->config_mutex')) {
            Write-Error "ndi-source.cpp: config_mutex never pthread_mutex_destroy'd — #93 fix reverted"; exit 1
          }
          if ($src -notmatch [regex]::Escape('recv_desc.source_to_connect_to.p_ndi_name = owned_source_name')) {
            Write-Error "ndi-source.cpp: recv_desc no longer binds the av_thread-owned source-name copy — #93 fix reverted"; exit 1
          }
          if ($src -notmatch [regex]::Escape('recv_desc.p_ndi_recv_name = owned_receiver_name')) {
            Write-Error "ndi-source.cpp: recv_desc no longer binds the av_thread-owned receiver-name copy — #93 fix reverted"; exit 1
          }
          if ($src -match [regex]::Escape('recv_desc.source_to_connect_to.p_ndi_name = s->config.ndi_source_name')) {
            Write-Error "ndi-source.cpp: recv_desc is borrowing the live s->config.ndi_source_name again (stock code) — #93 UAF is BACK"; exit 1
          }
          if ($src -match [regex]::Escape('recv_desc.p_ndi_recv_name = s->config.ndi_receiver_name')) {
            Write-Error "ndi-source.cpp: recv_desc is borrowing the live s->config.ndi_receiver_name again (stock code) — #93 UAF is BACK"; exit 1
          }
          # on_ndi_source_renamed is the SECOND writer of ndi_receiver_name and must hold
          # the lock too (review). Assert the renamed handler still takes config_mutex.
          # Capture from its signature to its closing brace (the handler currently has no
          # inner '{ }' block, so [^}]*?\} reaches the right brace). The canonical robust
          # guard is the Rust test on_ndi_source_renamed_takes_the_config_lock (next-
          # function-boundary extraction); this pwsh check keeps the prod build in
          # lock-step with it.
          $renamed = ''
          if ($src -match 'void on_ndi_source_renamed\([^}]*?\}') { $renamed = $matches[0] }
          if ($renamed -notmatch [regex]::Escape('pthread_mutex_lock(&s->config_mutex')) {
            Write-Error "ndi-source.cpp: on_ndi_source_renamed no longer locks config_mutex around the ndi_receiver_name realloc — #93 residual UAF"; exit 1
          }
          Write-Output "DistroAV NDI source-name UAF fix present (config_mutex at update + reset + rename, av_thread-owned name copies, no live config-pointer borrow) — OK"

      # #150: assert the genlock NDI-source config LOCKDOWN is present in the vendored
      # DistroAV BEFORE the 150-min build. The root fix (confirmed live 2026-06-22): a
      # genlock NDI source must EXPOSE ONLY source-selection + genlock preload and
      # HARDCODE every other certified zero-loss value at the code level, so no input,
      # scene, human or harness can misconfigure it (an incompletely-configured probe
      # ingest decoded 0 at strih while the certified prod input decoded 100% off the
      # SAME NDI source). Mirrors the canonical Linux-CI guard
      # tests/distroav_genlock_lockdown.rs (that crate is Linux-only — it can't compile
      # on this windows-2022 runner), so the same source tokens are re-asserted here in
      # pwsh. A future `git subtree pull` (#44) that drops the lockdown fails HERE.
      - name: Assert genlock NDI-source config lockdown present (#150)
        shell: pwsh
        run: |
          $ndi = (Get-Content "vendor/distroav/src/ndi-source.cpp" -Raw) -replace '\s+', ' '
          if ($ndi -notmatch [regex]::Escape('force_genlock_certified_settings')) {
            Write-Error "ndi-source.cpp: the #150 certified-value forcer (force_genlock_certified_settings) is gone — a genlock source could come up misconfigured. Re-apply the #150 lockdown"; exit 1
          }
          # #257: the forcer is driven by the GENLOCK_FORCED_SETTINGS const table (the COMPLEMENT of
          # the whitelist), not individual obs_data_set calls. Assert every certified key is a table
          # entry — the critical ones that caused the live 0-decode (hw_accel, audio) + the timing
          # trio (sync/bw/latency) + ptz (now forced too).
          foreach ($needle in @(
            '{PROP_SYNC, false, PROP_SYNC_NDI_SOURCE_TIMECODE, false}',
            '{PROP_BEHAVIOR, false, PROP_BEHAVIOR_STOP_RESUME_LAST_FRAME, false}',
            '{PROP_BANDWIDTH, false, PROP_BW_HIGHEST, false}',
            '{PROP_LATENCY, false, PROP_LATENCY_NORMAL, false}',
            '{PROP_HW_ACCEL, true, 0, true}',
            '{PROP_AUDIO, true, 0, false}',
            '{PROP_FRAMESYNC, true, 0, false}',
            '{PROP_FIX_ALPHA, true, 0, false}',
            '{PROP_PTZ, true, 0, false}')) {
            if ($ndi -notmatch [regex]::Escape($needle)) {
              Write-Error "ndi-source.cpp: GENLOCK_FORCED_SETTINGS no longer pins '$needle' — that key could be left misconfigured on the genlock path. Re-apply the full #150/#257 forcer table"; exit 1
            }
          }
          if ($ndi -notmatch [regex]::Escape('force_genlock_certified_settings(settings)')) {
            Write-Error "ndi-source.cpp: ndi_source_update no longer CALLS force_genlock_certified_settings(settings) — the certified values are not enforced at update time. Re-apply the #150 lockdown"; exit 1
          }
          # #257: the UI is a HARD WHITELIST — the forced knobs are REMOVED from the UI (not hidden via
          # apply_genlock_lockdown_visibility, which is gone). getproperties must expose EXACTLY the
          # 4 whitelist props and the forced knobs (e.g. behavior list) must NOT be added.
          if ($ndi -match [regex]::Escape('apply_genlock_lockdown_visibility')) {
            Write-Error "ndi-source.cpp: apply_genlock_lockdown_visibility is BACK — #257 replaced hide-on-lockdown with a hard whitelist (the knob is removed from the UI, not hidden)"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('GENLOCK_WHITELIST_PROPS')) {
            Write-Error "ndi-source.cpp: the GENLOCK_WHITELIST_PROPS whitelist is gone — #257 hard-lock UI reverted"; exit 1
          }
          if ($ndi -match [regex]::Escape('obs_properties_add_list(props, PROP_BEHAVIOR')) {
            Write-Error "ndi-source.cpp: PROP_BEHAVIOR is BACK in the UI — #257 whitelist exposes only source/Genlock/Latency/burn"; exit 1
          }
          # #257: the burn is a per-source bool applied at runtime in ndi_source_update.
          if ($ndi -notmatch [regex]::Escape('obs_properties_add_bool(props, PROP_BURN')) {
            Write-Error "ndi-source.cpp: the PROP_BURN measurement-burn toggle is gone from the whitelist UI — #257 reverted"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('obs_source_set_genlock_burn')) {
            Write-Error "ndi-source.cpp: ndi_source_update no longer applies obs_source_set_genlock_burn — #257 runtime burn toggle inert"; exit 1
          }
          Write-Output "Genlock NDI-source HARD-LOCK present (#257: GENLOCK_FORCED_SETTINGS table forces sync/behavior/bw/latency/hw_accel/audio/framesync/alpha/ptz; whitelist UI = source/Genlock/Latency/burn; burn applied at runtime) — OK"

      # cmake steps run under bash: pwsh tokenization splits -DNAME=32.1.2 at the
      # #111: assert the QR render-time burn filter (Path B) is present + build-wired in
      # the vendored DistroAV BEFORE the 150-min build, so a future `git subtree pull`
      # (#44) or a build-wiring regression that drops the burn filter fails HERE rather
      # than shipping a distroav.dll without the #108 per-hop-latency probe foundation.
      # Mirrors the canonical Linux-CI guard tests/burn_payload_parity.rs (Linux-only —
      # it compiles+runs the C++ encoder with g++, which can't run in this build job).
      # Keep both in lock-step.
      - name: Assert QR render-time burn filter present (#111)
        shell: pwsh
        run: |
          $flt = (Get-Content "vendor/distroav/src/ndi-burn-filter.cpp" -Raw) -replace '\s+', ' '
          if ($flt -notmatch [regex]::Escape('burn_payload::encode')) {
            Write-Error "ndi-burn-filter.cpp: no longer calls burn_payload::encode — the burned payload would not match the Rust decoder (#111 reverted)"; exit 1
          }
          if ($flt -notmatch [regex]::Escape('burn_clock::gen_ts_ns')) {
            Write-Error "ndi-burn-filter.cpp: no longer stamps the RAW render-instant wall-clock gen_ts_ns (burn_clock::gen_ts_ns) — node stamp would not share cam2's RAW painter timebase and #108's cam->strih subtraction would be biased (finding #2)"; exit 1
          }
          # #257: the burn is gated by the per-source genlock_burn bool (read LIVE from the parent
          # source each render), NOT env. The OBS_BURN_* env reads MUST be gone; the run_id/corner come
          # from the host role; the reserved run_ids (911002/911004) stay.
          if ($flt -match [regex]::Escape('getenv("OBS_BURN')) {
            Write-Error "ndi-burn-filter.cpp: OBS_BURN_* env read is BACK — #257 made the burn a per-source genlock_burn bool (no env)"; exit 1
          }
          if ($flt -notmatch [regex]::Escape('obs_source_get_genlock_burn')) {
            Write-Error "ndi-burn-filter.cpp: the burn no longer reads the parent source's genlock_burn flag (obs_source_get_genlock_burn) — #257 runtime burn gate reverted"; exit 1
          }
          if ($flt -notmatch [regex]::Escape('BURN_RUN_ID_DEFAULT_STRIH 911002') -or $flt -notmatch [regex]::Escape('BURN_RUN_ID_DEFAULT_STREAM 911004')) {
            Write-Error "ndi-burn-filter.cpp: the reserved per-node run_ids (911002 strih / 911004 stream) drifted — #108 pairing would break"; exit 1
          }
          if ($flt -notmatch [regex]::Escape('burn_host_is_stream')) {
            Write-Error "ndi-burn-filter.cpp: run_id no longer derived from the host role (burn_host_is_stream) — #257 reverted"; exit 1
          }
          # #111 4-corner layout: the burn MUST be placed in this node's bottom CORNER via the
          # shared corner geometry (strih=bottom-left, stream=bottom-right), NOT a center-bottom
          # strip — otherwise the strih + stream burns overlap each other (strih->stream 0 paired
          # frames) and the camera dual-QR. Lock-step with tests/burn_payload_parity.rs.
          if ($flt -notmatch [regex]::Escape('burn_geom::corner_placement')) {
            Write-Error "ndi-burn-filter.cpp: the burn no longer uses burn_geom::corner_placement — it would draw a center-bottom strip that overlaps the other node's burn and the camera QR (the #111 readability/0-paired-frames bug)"; exit 1
          }
          if (!(Test-Path "vendor/distroav/src/burn-geom.hpp")) {
            Write-Error "vendor/distroav/src/burn-geom.hpp missing — the #111 4-corner placement geometry was dropped; the burn would fall back to a center strip that overlaps the other QRs"; exit 1
          }
          $pm = (Get-Content "vendor/distroav/src/plugin-main.cpp" -Raw) -replace '\s+', ' '
          if ($pm -notmatch [regex]::Escape('create_ndi_burn_filter_info')) {
            Write-Error "plugin-main.cpp: the burn filter is not registered (create_ndi_burn_filter_info) — OBS would not expose it (#111 reverted)"; exit 1
          }
          $cm = (Get-Content "vendor/distroav/CMakeLists.txt" -Raw) -replace '\s+', ' '
          if ($cm -notmatch [regex]::Escape('src/ndi-burn-filter.cpp')) {
            Write-Error "CMakeLists.txt: ndi-burn-filter.cpp not in target_sources — it would not compile into distroav.dll (#111 build-wiring reverted)"; exit 1
          }
          if ($cm -notmatch [regex]::Escape('src/qrcodegen/qrcodegen.cpp')) {
            Write-Error "CMakeLists.txt: vendored qrcodegen.cpp not in target_sources — the burn filter would not link (#111 build-wiring reverted)"; exit 1
          }
          if (!(Test-Path "vendor/distroav/src/qrcodegen/qrcodegen.hpp")) {
            Write-Error "vendor/distroav/src/qrcodegen/qrcodegen.hpp missing — the vendored QR encoder (Nayuki, MIT) was dropped (#111 reverted)"; exit 1
          }
          Write-Output "QR render-time burn filter present (#257: burn_payload::encode + gen_ts_ns + per-source genlock_burn gate + host-role run_ids 911002/911004 + 4-corner burn_geom::corner_placement + registered + CMake-wired + vendored qrcodegen) — OK"

      # dots (cmake received a stray '.1.2' preset path) — bash quoting is exact.
      - name: Configure OBS (windows-x64 preset + genlock build flags)
        working-directory: vendor/obs-studio
        shell: bash
        run: >
          cmake --preset windows-x64
          '-DOBS_VERSION_OVERRIDE=32.1.2'
          -DENABLE_WHATSNEW=OFF
          -DENABLE_AJA=OFF
          -DENABLE_VLC=OFF
          -DENABLE_TEST_INPUT=OFF

      - name: Build OBS
        working-directory: vendor/obs-studio
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      - name: Install OBS SDK prefix
        working-directory: vendor/obs-studio
        shell: bash
        run: cmake --install build_x64 --config RelWithDebInfo --prefix "$GITHUB_WORKSPACE/obs-sdk"

      - name: Configure DistroAV against the genlocked OBS
        working-directory: vendor/distroav
        shell: bash
        run: >
          cmake -B build_x64 -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/obs-sdk"
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build DistroAV
        working-directory: vendor/distroav
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      # SECONDARY / defense-in-depth (#55): the disable MECHANISM is the SOURCE gate at
      # the top of this job; this is a packaging-layout check that the built rundir ships
      # no `updater.exe` binary at all. It is intentionally redundant — belt-and-braces
      # against a rundir copy-rule change — and is NOT, on its own, proof the in-app
      # updater is disabled (a subtree bump could add/remove the copy rule independently
      # of the source flag). Keep both: source-flag primary, this packaging check secondary.
      - name: Assert no updater.exe in the artifact (#43 defense-in-depth, secondary to source gate, #55)
        shell: pwsh
        run: |
          $rundir = "vendor/obs-studio/build_x64/rundir/RelWithDebInfo"
          if (Test-Path "$rundir/bin/64bit/updater.exe") { Write-Error "updater.exe present in artifact — defense-in-depth packaging check failed (#43)"; exit 1 }
          Write-Output "no updater.exe in artifact — OK"

      - name: Stage artifact
        shell: pwsh
        run: |
          $rundir = "vendor/obs-studio/build_x64/rundir/RelWithDebInfo"
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item -Recurse "$rundir/*" stage/
          # DistroAV plugin + data into the OBS rundir layout
          Copy-Item "vendor/distroav/build_x64/RelWithDebInfo/distroav.dll" "stage/obs-plugins/64bit/" -ErrorAction SilentlyContinue
          if (!(Test-Path "stage/obs-plugins/64bit/distroav.dll")) {
            $dll = Get-ChildItem -Recurse vendor/distroav/build_x64 -Filter distroav.dll | Select-Object -First 1
            Copy-Item $dll.FullName "stage/obs-plugins/64bit/"
          }
          New-Item -ItemType Directory -Force -Path "stage/data/obs-plugins/distroav" | Out-Null
          Copy-Item -Recurse "vendor/distroav/data/*" "stage/data/obs-plugins/distroav/" -ErrorAction SilentlyContinue
          git rev-parse HEAD | Out-File stage/GENLOCK_BUILD_SHA.txt -Encoding ascii

      # #120: emit the per-component SHA manifest INTO the bundle (stage/BUNDLE_MANIFEST.json).
      # EPIC #125 / #119: a single git-HEAD txt (above) cannot catch a stale-BYTES build of the
      # right version (the #119 inert preload). The manifest records each rebuilt component's pinned
      # SOURCE (OBS/DistroAV version + vendored subtree commit, read from vendor/README.md +
      # vendor/distroav/buildspec.json — the same source-of-truth drift-guard.sh uses) AND the
      # per-file sha256 of EVERY shipped file, walked from stage/ so it is self-consistent with the
      # bundle by construction. #121 (post-deploy verify) byte/SHA-checks the deployed stack against
      # it. The generator's logic is unit-proven on the Linux CI (`test` job, tests/genlock_manifest.rs)
      # — this is the production EMISSION. git-bash on windows-2022 ships bash + sha256sum + git.
      - name: Generate per-component SHA manifest (#120)
        shell: bash
        run: |
          scripts/genlock-manifest.sh --stage stage --out stage/BUNDLE_MANIFEST.json

      # #120: self-consistency GATE — fail the build if the produced manifest does NOT match the
      # bundle (every shipped file listed with the correct sha256, no un-manifested bytes, no stale
      # entries). The generator already self-checks; this is the explicit, independent build gate so
      # the windows-genlock CI run itself proves the manifest is produced + correct (no rig needed).
      - name: Assert bundle manifest self-consistent (#120)
        shell: bash
        run: |
          scripts/genlock-manifest.sh --check stage/BUNDLE_MANIFEST.json --stage stage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-genlock-windows-x64
          path: stage/
          if-no-files-found: error
