name: Windows genlock build (vendored OBS + DistroAV)

# Builds the PRODUCTION Windows artifact for strih/stream from the vendored,
# genlock-patched tree (#42): OBS 32.1.2 (browser ON for production parity,
# What's New / update prompts OFF per #43) + DistroAV 6.2.1 against it.
# Manual dispatch; artifacts are deployed off-air to the boxes (portable mode
# first — never overwriting the production install).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-genlock-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # PRIMARY updater-disable gate (#55): assert the SOURCE mechanism that actually
      # disables the in-app updater, NOT the packaging outcome. The genlock #43 patch
      # defaults `opt_disable_updater` to true and wires `IsUpdaterDisabled()` to it —
      # that is what stops every timed/menu/whatsnew update prompt. A future
      # `git subtree pull` (#44) that reverts the flag fails HERE — fast, before the
      # 150-min build, and independently of whether `updater.exe` lands in the rundir
      # (the secondary packaging check, below). Mirrors the canonical Linux-CI guard
      # tests/obs_updater_disabled.rs; that crate is Linux-only (v4l/alsa/evdev) and
      # cannot compile on this Windows runner, so the same source tokens are re-asserted
      # here in pwsh. The Rust guard keeps these two checks in lock-step.
      - name: Assert updater disabled at SOURCE (#43 primary mechanism, #55)
        shell: pwsh
        run: |
          $main = (Get-Content "vendor/obs-studio/frontend/obs-main.cpp" -Raw) -replace '\s+', ' '
          if ($main -notmatch [regex]::Escape('bool opt_disable_updater = true;')) {
            Write-Error "obs-main.cpp: opt_disable_updater no longer defaults to true — genlock #43 patch reverted (#55)"; exit 1
          }
          if ($main -match [regex]::Escape('bool opt_disable_updater = false;')) {
            Write-Error "obs-main.cpp: upstream 'opt_disable_updater = false' default is back — genlock #43 patch reverted (#55)"; exit 1
          }
          $app = (Get-Content "vendor/obs-studio/frontend/OBSApp.cpp" -Raw) -replace '\s+', ' '
          if ($app -notmatch [regex]::Escape('bool OBSApp::IsUpdaterDisabled() { return opt_disable_updater; }')) {
            Write-Error "OBSApp.cpp: IsUpdaterDisabled() no longer returns opt_disable_updater — #43 source wiring broken (#55)"; exit 1
          }
          Write-Output "source-flag updater-disable patch present (opt_disable_updater=true + IsUpdaterDisabled wiring) — OK"

      # #70: assert the genlock FIFO preload-reserve patch is present in the
      # vendored OBS source BEFORE the 150-min build, so a future `git subtree
      # pull` (#44) that reverts the zero-loss fix fails HERE rather than shipping
      # a regressed binary. Mirrors the canonical Linux-CI guard
      # tests/genlock_preload.rs (that crate is Linux-only and cannot compile on
      # this Windows runner). Keep both in lock-step.
      - name: Assert genlock FIFO preload-reserve patch present (#70)
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($src -notmatch [regex]::Escape('getenv("OBS_GENLOCK_PRELOAD_FRAMES")')) {
            Write-Error "obs-source.c: OBS_GENLOCK_PRELOAD_FRAMES no longer read — #70 genlock preload patch reverted"; exit 1
          }
          if ($src -notmatch [regex]::Escape('genlock_should_consume(source->async_frames.num, preload)')) {
            Write-Error "obs-source.c: genlock_fifo no longer gates on the preload reserve — #70 zero-slack FIFO is back"; exit 1
          }
          if ($src -notmatch [regex]::Escape('source->genlock_underruns++')) {
            Write-Error "obs-source.c: genlock underrun audit counter missing — #70 patch reverted"; exit 1
          }
          Write-Output "genlock FIFO preload-reserve patch present (OBS_GENLOCK_PRELOAD_FRAMES + preload-gated consume + audit) — OK"

      # #97: assert the per-source runtime preload (video-delay) patch is present in
      # BOTH the vendored libobs (the API + per-source field + raised cap) and the
      # DistroAV NDI source (the slider + apply) BEFORE the 150-min build, so a future
      # `git subtree pull` (#44) that drops the runtime video-delay control fails HERE
      # rather than shipping a build without it while the version pins still pass.
      # Mirrors the canonical Linux-CI guard tests/genlock_preload.rs (Linux-only,
      # can't compile on this windows runner). Keep both in lock-step.
      - name: Assert per-source genlock preload video-delay patch present (#97)
        shell: pwsh
        run: |
          $obs = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($obs -notmatch [regex]::Escape('void obs_source_set_genlock_preload(obs_source_t *source, uint32_t')) {
            Write-Error "obs-source.c: obs_source_set_genlock_preload missing — #97 per-source preload API reverted"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('source->genlock_preload')) {
            Write-Error "obs-source.c: per-source source->genlock_preload not read in the render path — #97 reverted"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('#define GENLOCK_PRELOAD_MAX 128')) {
            Write-Error "obs-source.c: GENLOCK_PRELOAD_MAX no longer 128 — #97 video-delay headroom reverted"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('genlock_drop_cap') -and $obs -notmatch [regex]::Escape('genlock_source_drop_cap')) {
            Write-Error "obs-source.c: per-source FIFO drop-cap (genlock_source_drop_cap) missing — #97 reverted"; exit 1
          }
          $ndi = (Get-Content "vendor/distroav/src/ndi-source.cpp" -Raw) -replace '\s+', ' '
          if ($ndi -notmatch [regex]::Escape('obs_source_set_genlock_preload')) {
            Write-Error "ndi-source.cpp: ndi_source_update no longer applies obs_source_set_genlock_preload — #97 slider inert"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('obs_properties_add_int_slider(props, PROP_GENLOCK_PRELOAD')) {
            Write-Error "ndi-source.cpp: the genlock-preload int slider is gone — #97 reverted"; exit 1
          }
          Write-Output "per-source genlock preload video-delay patch present (API + per-source field + cap 128 + drop-cap + DistroAV slider + apply) — OK"

      # #85: assert the #78 "B′" real-wall-clock emit-timecode patch is present in the
      # vendored DistroAV OUTPUT source BEFORE the 150-min build, so a future `git
      # subtree pull` (#44) that restores `NDIlib_send_timecode_synthesize` fails HERE
      # rather than shipping a distroav.dll that reintroduces the ~150 ms emit-timecode
      # lag (#76) — which drift-guard.sh would NOT catch (it pins the DistroAV VERSION
      # 6.2.1, not fork-patch CONTENT). Mirrors the canonical Linux-CI guard
      # tests/distroav_timecode_patch.rs (that crate is Linux-only and cannot compile on
      # this Windows runner). Keep both in lock-step. The negative check targets the
      # assignment, NOT the bare token (which legitimately appears in the explanatory
      # comment here and in the unrelated ndi-filter.cpp path).
      - name: Assert DistroAV real-wall-clock emit-timecode patch present (#78, #85)
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/distroav/src/ndi-output.cpp" -Raw) -replace '\s+', ' '
          if ($src -notmatch [regex]::Escape('genlock_wall_now_100ns')) {
            Write-Error "ndi-output.cpp: genlock_wall_now_100ns missing — #78 real-wall-clock timecode patch reverted (#85)"; exit 1
          }
          if ($src -notmatch [regex]::Escape('genlock_emit_timecode_100ns')) {
            Write-Error "ndi-output.cpp: genlock_emit_timecode_100ns missing — #78 real-wall-clock timecode patch reverted (#85)"; exit 1
          }
          if ($src -notmatch [regex]::Escape('video_frame.timecode = genlock_emit_timecode_100ns(')) {
            Write-Error "ndi-output.cpp: video output frame no longer stamps genlock_emit_timecode_100ns — #78 emit patch reverted (#85)"; exit 1
          }
          if ($src -notmatch [regex]::Escape('audio_frame.timecode = genlock_wall_now_100ns()')) {
            Write-Error "ndi-output.cpp: audio output frame no longer stamps genlock_wall_now_100ns — #78 emit patch reverted (#85)"; exit 1
          }
          if ($src -match [regex]::Escape('video_frame.timecode = NDIlib_send_timecode_synthesize')) {
            Write-Error "ndi-output.cpp: stock NDIlib_send_timecode_synthesize video assignment is BACK — #78 reverted, ~150ms lag (#76) reintroduced (#85)"; exit 1
          }
          if ($src -match [regex]::Escape('audio_frame.timecode = NDIlib_send_timecode_synthesize')) {
            Write-Error "ndi-output.cpp: stock NDIlib_send_timecode_synthesize audio assignment is BACK — #78 reverted (#85)"; exit 1
          }
          Write-Output "DistroAV real-wall-clock emit-timecode patch present (genlock_emit_timecode_100ns video + genlock_wall_now_100ns audio, no synthesize assignment) — OK"

      # #93: assert the NDI source-name use-after-free fix is present in the vendored
      # DistroAV source BEFORE the 150-min build, so a future `git subtree pull` (#44)
      # that reverts it fails HERE rather than shipping a distroav.dll that re-crashes
      # strih OBS with STATUS_HEAP_CORRUPTION when a live source is re-pointed. Mirrors
      # the canonical Linux-CI guard tests/distroav_source_config_lock.rs (that crate is
      # Linux-only and cannot compile on this Windows runner). Keep both in lock-step.
      # The negative checks target the stock direct config-pointer borrows into recv_desc
      # (the exact UAF); the positive checks require the config_mutex + av_thread-owned
      # name copies.
      - name: Assert DistroAV NDI source-name UAF fix present (#93)
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/distroav/src/ndi-source.cpp" -Raw) -replace '\s+', ' '
          if ($src -notmatch [regex]::Escape('pthread_mutex_t config_mutex')) {
            Write-Error "ndi-source.cpp: per-source config_mutex missing — #93 source-name UAF fix reverted"; exit 1
          }
          if ($src -notmatch [regex]::Escape('pthread_mutex_init(&s->config_mutex')) {
            Write-Error "ndi-source.cpp: config_mutex never pthread_mutex_init'd — #93 fix reverted"; exit 1
          }
          if ($src -notmatch [regex]::Escape('pthread_mutex_destroy(&s->config_mutex')) {
            Write-Error "ndi-source.cpp: config_mutex never pthread_mutex_destroy'd — #93 fix reverted"; exit 1
          }
          if ($src -notmatch [regex]::Escape('recv_desc.source_to_connect_to.p_ndi_name = owned_source_name')) {
            Write-Error "ndi-source.cpp: recv_desc no longer binds the av_thread-owned source-name copy — #93 fix reverted"; exit 1
          }
          if ($src -notmatch [regex]::Escape('recv_desc.p_ndi_recv_name = owned_receiver_name')) {
            Write-Error "ndi-source.cpp: recv_desc no longer binds the av_thread-owned receiver-name copy — #93 fix reverted"; exit 1
          }
          if ($src -match [regex]::Escape('recv_desc.source_to_connect_to.p_ndi_name = s->config.ndi_source_name')) {
            Write-Error "ndi-source.cpp: recv_desc is borrowing the live s->config.ndi_source_name again (stock code) — #93 UAF is BACK"; exit 1
          }
          if ($src -match [regex]::Escape('recv_desc.p_ndi_recv_name = s->config.ndi_receiver_name')) {
            Write-Error "ndi-source.cpp: recv_desc is borrowing the live s->config.ndi_receiver_name again (stock code) — #93 UAF is BACK"; exit 1
          }
          # on_ndi_source_renamed is the SECOND writer of ndi_receiver_name and must hold
          # the lock too (review). Assert the renamed handler still takes config_mutex.
          # Capture from its signature to its closing brace (the handler currently has no
          # inner '{ }' block, so [^}]*?\} reaches the right brace). The canonical robust
          # guard is the Rust test on_ndi_source_renamed_takes_the_config_lock (next-
          # function-boundary extraction); this pwsh check keeps the prod build in
          # lock-step with it.
          $renamed = ''
          if ($src -match 'void on_ndi_source_renamed\([^}]*?\}') { $renamed = $matches[0] }
          if ($renamed -notmatch [regex]::Escape('pthread_mutex_lock(&s->config_mutex')) {
            Write-Error "ndi-source.cpp: on_ndi_source_renamed no longer locks config_mutex around the ndi_receiver_name realloc — #93 residual UAF"; exit 1
          }
          Write-Output "DistroAV NDI source-name UAF fix present (config_mutex at update + reset + rename, av_thread-owned name copies, no live config-pointer borrow) — OK"

      # cmake steps run under bash: pwsh tokenization splits -DNAME=32.1.2 at the
      # dots (cmake received a stray '.1.2' preset path) — bash quoting is exact.
      - name: Configure OBS (windows-x64 preset + genlock build flags)
        working-directory: vendor/obs-studio
        shell: bash
        run: >
          cmake --preset windows-x64
          '-DOBS_VERSION_OVERRIDE=32.1.2'
          -DENABLE_WHATSNEW=OFF
          -DENABLE_AJA=OFF
          -DENABLE_VLC=OFF
          -DENABLE_TEST_INPUT=OFF

      - name: Build OBS
        working-directory: vendor/obs-studio
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      - name: Install OBS SDK prefix
        working-directory: vendor/obs-studio
        shell: bash
        run: cmake --install build_x64 --config RelWithDebInfo --prefix "$GITHUB_WORKSPACE/obs-sdk"

      - name: Configure DistroAV against the genlocked OBS
        working-directory: vendor/distroav
        shell: bash
        run: >
          cmake -B build_x64 -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/obs-sdk"
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build DistroAV
        working-directory: vendor/distroav
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      # SECONDARY / defense-in-depth (#55): the disable MECHANISM is the SOURCE gate at
      # the top of this job; this is a packaging-layout check that the built rundir ships
      # no `updater.exe` binary at all. It is intentionally redundant — belt-and-braces
      # against a rundir copy-rule change — and is NOT, on its own, proof the in-app
      # updater is disabled (a subtree bump could add/remove the copy rule independently
      # of the source flag). Keep both: source-flag primary, this packaging check secondary.
      - name: Assert no updater.exe in the artifact (#43 defense-in-depth, secondary to source gate, #55)
        shell: pwsh
        run: |
          $rundir = "vendor/obs-studio/build_x64/rundir/RelWithDebInfo"
          if (Test-Path "$rundir/bin/64bit/updater.exe") { Write-Error "updater.exe present in artifact — defense-in-depth packaging check failed (#43)"; exit 1 }
          Write-Output "no updater.exe in artifact — OK"

      - name: Stage artifact
        shell: pwsh
        run: |
          $rundir = "vendor/obs-studio/build_x64/rundir/RelWithDebInfo"
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item -Recurse "$rundir/*" stage/
          # DistroAV plugin + data into the OBS rundir layout
          Copy-Item "vendor/distroav/build_x64/RelWithDebInfo/distroav.dll" "stage/obs-plugins/64bit/" -ErrorAction SilentlyContinue
          if (!(Test-Path "stage/obs-plugins/64bit/distroav.dll")) {
            $dll = Get-ChildItem -Recurse vendor/distroav/build_x64 -Filter distroav.dll | Select-Object -First 1
            Copy-Item $dll.FullName "stage/obs-plugins/64bit/"
          }
          New-Item -ItemType Directory -Force -Path "stage/data/obs-plugins/distroav" | Out-Null
          Copy-Item -Recurse "vendor/distroav/data/*" "stage/data/obs-plugins/distroav/" -ErrorAction SilentlyContinue
          git rev-parse HEAD | Out-File stage/GENLOCK_BUILD_SHA.txt -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-genlock-windows-x64
          path: stage/
          if-no-files-found: error
