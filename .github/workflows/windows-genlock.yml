name: Windows genlock build (vendored OBS + DistroAV)

# Builds the PRODUCTION Windows artifact for strih/stream from the vendored,
# genlock-patched tree (#42): OBS 32.1.2 (browser ON for production parity,
# What's New / update prompts OFF per #43) + DistroAV 6.2.1 against it.
# Manual dispatch; artifacts are deployed off-air to the boxes (portable mode
# first — never overwriting the production install).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-genlock-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # PRIMARY updater-disable gate (#55): assert the SOURCE mechanism that actually
      # disables the in-app updater, NOT the packaging outcome. The genlock #43 patch
      # defaults `opt_disable_updater` to true and wires `IsUpdaterDisabled()` to it —
      # that is what stops every timed/menu/whatsnew update prompt. A future
      # `git subtree pull` (#44) that reverts the flag fails HERE — fast, before the
      # 150-min build, and independently of whether `updater.exe` lands in the rundir
      # (the secondary packaging check, below). Mirrors the canonical Linux-CI guard
      # tests/obs_updater_disabled.rs; that crate is Linux-only (v4l/alsa/evdev) and
      # cannot compile on this Windows runner, so the same source tokens are re-asserted
      # here in pwsh. The Rust guard keeps these two checks in lock-step.
      - name: Assert updater disabled at SOURCE (#43 primary mechanism, #55)
        shell: pwsh
        run: |
          $main = (Get-Content "vendor/obs-studio/frontend/obs-main.cpp" -Raw) -replace '\s+', ' '
          if ($main -notmatch [regex]::Escape('bool opt_disable_updater = true;')) {
            Write-Error "obs-main.cpp: opt_disable_updater no longer defaults to true — genlock #43 patch reverted (#55)"; exit 1
          }
          if ($main -match [regex]::Escape('bool opt_disable_updater = false;')) {
            Write-Error "obs-main.cpp: upstream 'opt_disable_updater = false' default is back — genlock #43 patch reverted (#55)"; exit 1
          }
          $app = (Get-Content "vendor/obs-studio/frontend/OBSApp.cpp" -Raw) -replace '\s+', ' '
          if ($app -notmatch [regex]::Escape('bool OBSApp::IsUpdaterDisabled() { return opt_disable_updater; }')) {
            Write-Error "OBSApp.cpp: IsUpdaterDisabled() no longer returns opt_disable_updater — #43 source wiring broken (#55)"; exit 1
          }
          Write-Output "source-flag updater-disable patch present (opt_disable_updater=true + IsUpdaterDisabled wiring) — OK"

      # #70: assert the genlock FIFO preload-reserve patch is present in the
      # vendored OBS source BEFORE the 150-min build, so a future `git subtree
      # pull` (#44) that reverts the zero-loss fix fails HERE rather than shipping
      # a regressed binary. Mirrors the canonical Linux-CI guard
      # tests/genlock_preload.rs (that crate is Linux-only and cannot compile on
      # this Windows runner). Keep both in lock-step.
      - name: Assert genlock FIFO preload-reserve patch present (#70)
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($src -notmatch [regex]::Escape('getenv("OBS_GENLOCK_PRELOAD_FRAMES")')) {
            Write-Error "obs-source.c: OBS_GENLOCK_PRELOAD_FRAMES no longer read — #70 genlock preload patch reverted"; exit 1
          }
          if ($src -notmatch [regex]::Escape('genlock_should_consume(source->async_frames.num, preload)')) {
            Write-Error "obs-source.c: genlock_fifo no longer gates on the preload reserve — #70 zero-slack FIFO is back"; exit 1
          }
          if ($src -notmatch [regex]::Escape('source->genlock_underruns++')) {
            Write-Error "obs-source.c: genlock underrun audit counter missing — #70 patch reverted"; exit 1
          }
          Write-Output "genlock FIFO preload-reserve patch present (OBS_GENLOCK_PRELOAD_FRAMES + preload-gated consume + audit) — OK"

      # cmake steps run under bash: pwsh tokenization splits -DNAME=32.1.2 at the
      # dots (cmake received a stray '.1.2' preset path) — bash quoting is exact.
      - name: Configure OBS (windows-x64 preset + genlock build flags)
        working-directory: vendor/obs-studio
        shell: bash
        run: >
          cmake --preset windows-x64
          '-DOBS_VERSION_OVERRIDE=32.1.2'
          -DENABLE_WHATSNEW=OFF
          -DENABLE_AJA=OFF
          -DENABLE_VLC=OFF
          -DENABLE_TEST_INPUT=OFF

      - name: Build OBS
        working-directory: vendor/obs-studio
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      - name: Install OBS SDK prefix
        working-directory: vendor/obs-studio
        shell: bash
        run: cmake --install build_x64 --config RelWithDebInfo --prefix "$GITHUB_WORKSPACE/obs-sdk"

      - name: Configure DistroAV against the genlocked OBS
        working-directory: vendor/distroav
        shell: bash
        run: >
          cmake -B build_x64 -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/obs-sdk"
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build DistroAV
        working-directory: vendor/distroav
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      # SECONDARY / defense-in-depth (#55): the disable MECHANISM is the SOURCE gate at
      # the top of this job; this is a packaging-layout check that the built rundir ships
      # no `updater.exe` binary at all. It is intentionally redundant — belt-and-braces
      # against a rundir copy-rule change — and is NOT, on its own, proof the in-app
      # updater is disabled (a subtree bump could add/remove the copy rule independently
      # of the source flag). Keep both: source-flag primary, this packaging check secondary.
      - name: Assert no updater.exe in the artifact (#43 defense-in-depth, secondary to source gate, #55)
        shell: pwsh
        run: |
          $rundir = "vendor/obs-studio/build_x64/rundir/RelWithDebInfo"
          if (Test-Path "$rundir/bin/64bit/updater.exe") { Write-Error "updater.exe present in artifact — defense-in-depth packaging check failed (#43)"; exit 1 }
          Write-Output "no updater.exe in artifact — OK"

      - name: Stage artifact
        shell: pwsh
        run: |
          $rundir = "vendor/obs-studio/build_x64/rundir/RelWithDebInfo"
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item -Recurse "$rundir/*" stage/
          # DistroAV plugin + data into the OBS rundir layout
          Copy-Item "vendor/distroav/build_x64/RelWithDebInfo/distroav.dll" "stage/obs-plugins/64bit/" -ErrorAction SilentlyContinue
          if (!(Test-Path "stage/obs-plugins/64bit/distroav.dll")) {
            $dll = Get-ChildItem -Recurse vendor/distroav/build_x64 -Filter distroav.dll | Select-Object -First 1
            Copy-Item $dll.FullName "stage/obs-plugins/64bit/"
          }
          New-Item -ItemType Directory -Force -Path "stage/data/obs-plugins/distroav" | Out-Null
          Copy-Item -Recurse "vendor/distroav/data/*" "stage/data/obs-plugins/distroav/" -ErrorAction SilentlyContinue
          git rev-parse HEAD | Out-File stage/GENLOCK_BUILD_SHA.txt -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-genlock-windows-x64
          path: stage/
          if-no-files-found: error
