            Write-Error "ndi-output.cpp: stock NDIlib_send_timecode_synthesize audio assignment is BACK — #78 reverted (#85)"; exit 1
          }
          # camera-box #1009: the emit stamp must be the FLOOR boundary (at-or-before the emit
          # instant), never the strictly-next/ceil one — the ceil bias dated every frame 0..1
          # interval into the receiver's future and armed the issue-147 hair-trigger (the
