name: Windows genlock build (vendored OBS + DistroAV)

# Builds the PRODUCTION Windows artifact for strih/stream from the vendored,
# genlock-patched tree (#42): OBS 32.2.0 (browser ON for production parity,
# What's New / update prompts OFF per #43) + DistroAV 6.2.1 against it.
# Manual dispatch; artifacts are deployed off-air to the boxes (portable mode
# first — never overwriting the production install).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-genlock-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # PRIMARY updater-disable gate (#55): assert the SOURCE mechanism that actually
      # disables the in-app updater, NOT the packaging outcome. The genlock #43 patch
      # defaults `opt_disable_updater` to true and wires `IsUpdaterDisabled()` to it —
      # that is what stops every timed/menu/whatsnew update prompt. A future
      # `git subtree pull` (#44) that reverts the flag fails HERE — fast, before the
      # 150-min build, and independently of whether `updater.exe` lands in the rundir
      # (the secondary packaging check, below). Mirrors the canonical Linux-CI guard
      # tests/obs_updater_disabled.rs; that crate is Linux-only (v4l/alsa/evdev) and
      # cannot compile on this Windows runner, so the same source tokens are re-asserted
      # here in pwsh. The Rust guard keeps these two checks in lock-step.
      - name: Assert updater disabled at SOURCE (#43 primary mechanism, #55)
        shell: pwsh
        run: |
          $main = (Get-Content "vendor/obs-studio/frontend/obs-main.cpp" -Raw) -replace '\s+', ' '
          if ($main -notmatch [regex]::Escape('bool opt_disable_updater = true;')) {
            Write-Error "obs-main.cpp: opt_disable_updater no longer defaults to true — genlock #43 patch reverted (#55)"; exit 1
          }
          if ($main -match [regex]::Escape('bool opt_disable_updater = false;')) {
            Write-Error "obs-main.cpp: upstream 'opt_disable_updater = false' default is back — genlock #43 patch reverted (#55)"; exit 1
          }
          $app = (Get-Content "vendor/obs-studio/frontend/OBSApp.cpp" -Raw) -replace '\s+', ' '
          if ($app -notmatch [regex]::Escape('bool OBSApp::IsUpdaterDisabled() { return opt_disable_updater; }')) {
            Write-Error "OBSApp.cpp: IsUpdaterDisabled() no longer returns opt_disable_updater — #43 source wiring broken (#55)"; exit 1
          }
          Write-Output "source-flag updater-disable patch present (opt_disable_updater=true + IsUpdaterDisabled wiring) — OK"

      # #152: the FULL build compiles the frontend where UpdateTitleBar() lives, so assert
      # the newlevel.media build-identity title marker is present in the vendored source
      # BEFORE the 150-min build. Without it a `git subtree pull` (#44) could restore the
      # stock OBS title and ship a production OBS with no build identity on the box (the
      # version-integrity gap epic #125). Mirrors the canonical Linux-CI guard
      # tests/obs_titlebar_newlevel.rs (that crate is Linux-only and cannot compile on this
      # Windows runner). Keep both — and the FAST workflow's copy — in lock-step.
      - name: Assert newlevel.media build identity + deployed SHA in OBS title (#152/#1018)
        shell: pwsh
        run: |
          $b = (Get-Content "vendor/obs-studio/frontend/widgets/OBSBasic.cpp" -Raw) -replace '\s+', ' '
          if ($b -notmatch [regex]::Escape('name << " - newlevel.media build " << NewlevelBuildSha();')) {
            Write-Error "OBSBasic.cpp: the #152/#1018 newlevel.media build marker is missing from the OBS window title — upstream merge likely restored the stock title; re-apply the genlock title patch"; exit 1
          }
          if ($b -notmatch [regex]::Escape('static std::string NewlevelBuildSha()')) {
            Write-Error "OBSBasic.cpp: the #1018 NewlevelBuildSha() helper is gone — the title would lose its build identity; re-apply"; exit 1
          }
          if ($b -notmatch [regex]::Escape('GENLOCK_BUILD_SHA.txt')) {
            Write-Error "OBSBasic.cpp: the #1018 title no longer reads GENLOCK_BUILD_SHA.txt — the deployed build id would be lost; re-apply"; exit 1
          }
          if ($b -notmatch [regex]::Escape('os_get_executable_path_ptr(')) {
            Write-Error "OBSBasic.cpp: the #1018 title no longer resolves GENLOCK_BUILD_SHA.txt relative to the executable (os_get_executable_path_ptr) — a cwd-relative read regresses to the #1018 'unknown' bug; re-apply"; exit 1
          }
          Write-Output "#152/#1018 newlevel.media build identity + deployed SHA in OBS title — OK"

      # #1195: the rig build must NEVER stop on the stock unclean-shutdown "Run in Safe
      # Mode?" modal -- checkForUncleanShutdown() auto-selects a NORMAL launch instead. The
      # FULL build compiles the frontend where this lives; assert the auto-normal patch is
      # present (and the upstream blocking modal is gone) in the vendored source BEFORE the
      # 150-min build, so a future `git subtree pull` (#44) that re-imports the modal fails
      # HERE. Mirrors the canonical Linux-CI guard
      # tests/obs_unclean_shutdown_auto_normal_1195.rs (Linux-only, cannot compile on this
      # Windows runner). Keep this and the FAST workflow's copy in lock-step.
      - name: Assert OBS auto-selects a NORMAL launch, never the crash modal (#1195)
        shell: pwsh
        run: |
          $app = (Get-Content "vendor/obs-studio/frontend/OBSApp.cpp" -Raw) -replace '\s+', ' '
          if ($app -notmatch [regex]::Escape('auto-selecting NORMAL launch (rig build: never block on a modal)')) {
            Write-Error "OBSApp.cpp: the #1195 auto-normal WARNING is missing -- checkForUncleanShutdown() must auto-select a NORMAL launch instead of the Safe-Mode modal. A subtree pull likely restored the upstream modal; re-apply the #1195 patch."; exit 1
          }
          if ($app -match [regex]::Escape('crashWarning.exec()')) {
            Write-Error "OBSApp.cpp: the upstream blocking Safe-Mode modal (crashWarning.exec()) is BACK -- re-apply the #1195 patch (remove the modal, auto-select NORMAL)."; exit 1
          }
          Write-Output "#1195 auto-normal unclean-shutdown launch (no blocking Safe-Mode modal) -- OK"

      # #70/#102: assert the genlock FIFO patch is present in the vendored OBS source
      # BEFORE the 150-min build, so a future `git subtree pull` (#44) that reverts the
      # zero-loss fix fails HERE rather than shipping a regressed binary. #102 changed
      # the consume gate from the #70 hard-hold (`depth>preload` -> repeat, which lost a
      # distinct frame per jitter dip: 11.6%->34.3% on the live rig) to consume-when-
      # queued with a one-time startup-fill latch. Mirrors the canonical Linux-CI guard
      # tests/genlock_preload.rs (that crate is Linux-only and cannot compile on this
      # Windows runner). Keep both in lock-step.
      - name: Assert genlock FIFO consume-when-queued patch present (#70/#102)
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          # #257: OBS_GENLOCK_PRELOAD_FRAMES env was removed (preload is internal/auto). The env
          # read must be GONE; the consume-when-queued gate (#102) stays.
          if ($src -match [regex]::Escape('getenv("OBS_GENLOCK_PRELOAD_FRAMES")')) {
            Write-Error "obs-source.c: OBS_GENLOCK_PRELOAD_FRAMES env is BACK — #257 removed all genlock env (preload is internal/auto)"; exit 1
          }
          if ($src -notmatch [regex]::Escape('genlock_decide(source->async_frames.num, preload, source->genlock_filled)')) {
            Write-Error "obs-source.c: genlock_fifo no longer uses the #102 consume-when-queued decision (genlock_decide + startup-fill latch) — the loss fix reverted"; exit 1
          }
          if ($src -match [regex]::Escape('genlock_should_consume(source->async_frames.num, preload)')) {
            Write-Error "obs-source.c: the old #70 hard-hold gate genlock_should_consume is back — it repeats-on-hold and loses a distinct frame per jitter dip (#102)"; exit 1
          }
          if ($src -notmatch [regex]::Escape('source->genlock_filled')) {
            Write-Error "obs-source.c: the #102 startup-fill latch (genlock_filled) is missing — the delay line cannot build before consume-when-queued"; exit 1
          }
          if ($src -notmatch [regex]::Escape('source->genlock_underruns++')) {
            Write-Error "obs-source.c: genlock underrun audit counter missing — #70/#102 patch reverted"; exit 1
          }
          # #257: render tick + ts-align are build defaults (always on, no env). Assert both gates
          # return true unconditionally and no OBS_GENLOCK_WALL_CLOCK / _TS_ALIGN env remains.
          $vid = (Get-Content "vendor/obs-studio/libobs/obs-video.c" -Raw) -replace '\s+', ' '
          if ($vid -match [regex]::Escape('getenv("OBS_GENLOCK_WALL_CLOCK")')) {
            Write-Error "obs-video.c: OBS_GENLOCK_WALL_CLOCK env is BACK — #257 made the render tick a build default (always on)"; exit 1
          }
          if ($src -match [regex]::Escape('getenv("OBS_GENLOCK_TS_ALIGN")')) {
            Write-Error "obs-source.c: OBS_GENLOCK_TS_ALIGN env is BACK — #257 made ts-align a build default (always on)"; exit 1
          }
          Write-Output "genlock FIFO consume-when-queued patch present (#102 genlock_decide + startup-fill latch + audit) + render tick/ts-align build-default (#257, no env) — OK"

      # #97: assert the per-source runtime preload (video-delay) patch is present in
      # BOTH the vendored libobs (the API + per-source field + raised cap) and the
      # DistroAV NDI source (the slider + apply) BEFORE the 150-min build, so a future
      # `git subtree pull` (#44) that drops the runtime video-delay control fails HERE
      # rather than shipping a build without it while the version pins still pass.
      # Mirrors the canonical Linux-CI guard tests/genlock_preload.rs (Linux-only,
      # can't compile on this windows runner). Keep both in lock-step.
      - name: Assert per-source genlock preload video-delay patch present (#97)
        shell: pwsh
        run: |
          $obs = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($obs -notmatch [regex]::Escape('void obs_source_set_genlock_preload(obs_source_t *source, uint32_t')) {
            Write-Error "obs-source.c: obs_source_set_genlock_preload missing — #97 per-source preload API reverted"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('source->genlock_preload')) {
            Write-Error "obs-source.c: per-source source->genlock_preload not read in the render path — #97 reverted"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('#define GENLOCK_PRELOAD_MAX 128')) {
            Write-Error "obs-source.c: GENLOCK_PRELOAD_MAX no longer 128 — #97 video-delay headroom reverted"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('genlock_drop_cap') -and $obs -notmatch [regex]::Escape('genlock_source_drop_cap')) {
            Write-Error "obs-source.c: per-source FIFO drop-cap (genlock_source_drop_cap) missing — #97 reverted"; exit 1
          }
          # #257: preload is fully INTERNAL — the DistroAV UI slider + the set_preload apply were
          # removed (the whitelist UI). The libobs setter/field/cap stay (internal auto-derive). The
          # DistroAV slider must be GONE.
          $ndi = (Get-Content "vendor/distroav/src/ndi-source.cpp" -Raw) -replace '\s+', ' '
          if ($ndi -match [regex]::Escape('obs_properties_add_int_slider(props, PROP_GENLOCK_PRELOAD')) {
            Write-Error "ndi-source.cpp: the legacy genlock-preload slider is BACK — #257 removed it from the whitelist UI"; exit 1
          }
          Write-Output "per-source genlock preload video-delay patch present (libobs API + per-source field + cap 128 + drop-cap; #257 DistroAV slider removed) — OK"

      # #245: assert the PER-SOURCE genlock latency (ms) override is present in the
      # vendored source BEFORE the 150-min build, so a `git subtree pull` (#44) that
      # reverts it fails HERE rather than shipping a binary where the per-source latency
      # field is inert (the #235 regression: latency collapsed to one GLOBAL env knob and
      # an operator could not set 1000 ms on a single source while the others stayed low).
      # Mirrors the canonical Linux-CI guards in tests/genlock_preload.rs (probe-gated,
      # can't compile on this windows runner). Keep both in lock-step.
      - name: Assert per-source genlock latency (ms) override present (#245)
        shell: pwsh
        run: |
          $obs = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($obs -notmatch [regex]::Escape('void obs_source_set_genlock_latency_ms(obs_source_t *source, uint32_t')) {
            Write-Error "obs-source.c: obs_source_set_genlock_latency_ms missing — #245 per-source latency API reverted"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('source->genlock_latency_ms > 0 ? source->genlock_latency_ms : genlock_reserve_ms()')) {
            Write-Error "obs-source.c: the per-source latency release-deadline gate is gone — #245 override inert in the render path"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('#define GENLOCK_SOURCE_LATENCY_MS_MAX 2000')) {
            Write-Error "obs-source.c: GENLOCK_SOURCE_LATENCY_MS_MAX no longer 2000 — #245 per-source cap reverted"; exit 1
          }
          # #292: the drop-cap must budget the held depth at the SOURCE arrival fps (60), not the canvas
          # output fps — a 60fps NDI feed into a 30fps stream canvas parks 2x the canvas-rate frames, so a
          # canvas-fps budget force-drains a deep latency at ~450ms. A subtree revert that drops the define
          # or the budget term silently re-caps the operator's A/V-align delay; fail the build at the token.
          if ($obs -notmatch [regex]::Escape('#define GENLOCK_MAX_SOURCE_FPS 60')) {
            Write-Error "obs-source.c: GENLOCK_MAX_SOURCE_FPS no longer 60 — #292 drop-cap arrival-fps budget reverted (latency re-caps at ~450ms)"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('source->genlock_latency_ms * GENLOCK_MAX_SOURCE_FPS')) {
            Write-Error "obs-source.c: genlock_source_drop_cap no longer budgets latency_frames at the source arrival rate — #292 deep latency force-drains at ~450ms"; exit 1
          }
          $api = (Get-Content "vendor/obs-studio/libobs/obs.h" -Raw) -replace '\s+', ' '
          if ($api -notmatch [regex]::Escape('EXPORT void obs_source_set_genlock_latency_ms(obs_source_t *source, uint32_t')) {
            Write-Error "obs.h: obs_source_set_genlock_latency_ms not EXPORTed — #245 DistroAV cannot resolve the setter"; exit 1
          }
          $ndi = (Get-Content "vendor/distroav/src/ndi-source.cpp" -Raw) -replace '\s+', ' '
          if ($ndi -notmatch [regex]::Escape('obs_properties_add_int(props, PROP_GENLOCK_LATENCY_MS_SRC')) {
            Write-Error "ndi-source.cpp: the editable per-source latency int field is gone — #245 reverted"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('obs_source_set_genlock_latency_ms')) {
            Write-Error "ndi-source.cpp: ndi_source_update no longer applies obs_source_set_genlock_latency_ms — #245 field inert"; exit 1
          }
          # #257: the latency is a build const with a FLOOR of 3 ms, and genlock is DEFAULT ON.
          if ($obs -notmatch [regex]::Escape('#define GENLOCK_LATENCY_MS_MIN 3')) {
            Write-Error "obs-source.c: GENLOCK_LATENCY_MS_MIN no longer 3 — #257 latency floor reverted"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('#define GENLOCK_LATENCY_MS_DEFAULT 3')) {
            Write-Error "obs-source.c: GENLOCK_LATENCY_MS_DEFAULT no longer 3 — #257 build-const latency reverted"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('ms < GENLOCK_LATENCY_MS_MIN ? GENLOCK_LATENCY_MS_MIN')) {
            Write-Error "obs-source.c: obs_source_set_genlock_latency_ms no longer floors at GENLOCK_LATENCY_MS_MIN (3) — #257 floor reverted (1->3, 0->3)"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('ms < PROP_GENLOCK_LATENCY_MS_MIN')) {
            Write-Error "ndi-source.cpp: ndi_source_update no longer floors the per-source latency at PROP_GENLOCK_LATENCY_MS_MIN (3) — #257 floor reverted"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('obs_data_set_default_bool(settings, PROP_GENLOCK_FIFO, true)')) {
            Write-Error "ndi-source.cpp: genlock is no longer DEFAULT ON (PROP_GENLOCK_FIFO default true) — #257 reverted"; exit 1
          }
          Write-Output "per-source genlock latency (ms) override present + #257 floor 3 (build const, 1->3/0->3) + genlock default-ON — OK"

      # #912: ASRC (issue 803's per-source clock-drift servo) must be a BUILD DEFAULT, mirroring
      # the #257 render-tick/ts-align hard-lock — no env, no per-source opt-in required. Nothing
      # in the vendored tree ever called obs_source_set_asrc_enabled(), so the servo shipped
      # permanently inert until this default-on init; a `git subtree pull` (#44) reverting it back
      # to a bzalloc-zero default would silently re-inert ASRC. Mirrors the canonical Linux-CI
      # guard tests/genlock_preload.rs::vendored_source::asrc_default_on_present_in_vendored_source
      # (probe-gated, can't compile on this windows runner). Keep both in lock-step.
      - name: Assert ASRC always-on-by-default (#912)
        shell: pwsh
        run: |
          $obs = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($obs -notmatch [regex]::Escape('source->asrc_enabled = true;')) {
            Write-Error "obs-source.c: obs_source_create_internal no longer defaults asrc_enabled to true — #912 ASRC build-default reverted (would ship silently OFF again)"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('void obs_source_set_asrc_enabled(obs_source_t *source, bool')) {
            Write-Error "obs-source.c: obs_source_set_asrc_enabled missing — the #912 optional override API must stay live"; exit 1
          }
          $api = (Get-Content "vendor/obs-studio/libobs/obs.h" -Raw) -replace '\s+', ' '
          if ($api -notmatch [regex]::Escape('EXPORT void obs_source_set_asrc_enabled(obs_source_t *source, bool')) {
            Write-Error "obs.h: obs_source_set_asrc_enabled not EXPORTed — #912 override path unreachable"; exit 1
          }
          Write-Output "ASRC always-on-by-default (#912 build-default init + live override API kept) — OK"

      # #960: the ASRC estimator must reject a starved/bursting block (no real timing
      # information) rather than fold it into the EMA and rail the servo at -ASRC_MAX_PPM. A
      # `git subtree pull` (#44) or hand-edit reverting this guard would silently reintroduce the
      # live incident (-737,600ppm diagnostic poisoning / permanent rail on two muted sources).
      # Mirrors the canonical Linux-CI guard tests/genlock_preload.rs::vendored_source::
      # asrc_starvation_guard_present_in_vendored_source (probe-gated, can't compile on this
      # windows runner). Keep both in lock-step.
      - name: Assert ASRC starvation guard present (#960)
        shell: pwsh
        run: |
          $h = (Get-Content "vendor/obs-studio/libobs/media-io/asrc-compensator.h" -Raw) -replace '\s+', ' '
          if ($h -notmatch [regex]::Escape('#define ASRC_MAX_SANE_INSTANTANEOUS_PPM 100000.0')) {
            Write-Error "asrc-compensator.h: #960 starvation-guard sanity ceiling (ASRC_MAX_SANE_INSTANTANEOUS_PPM) missing or changed"; exit 1
          }
          if ($h -notmatch [regex]::Escape('uint32_t starved_block_count;')) {
            Write-Error "asrc-compensator.h: #960 starved_block_count telemetry field missing from struct asrc_compensator"; exit 1
          }
          $src = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($src -notmatch [regex]::Escape('starved_blocks=%u')) {
            Write-Error "obs-source.c: #960 asrc: telemetry log line no longer reports starved_blocks=N"; exit 1
          }
          Write-Output "ASRC starvation guard present (#960 sanity ceiling + rejection branch + telemetry) — OK"

      # #962: the #960 starvation ceiling must gate the WINDOWED (duration-weighted-summed) ppm
      # value, not a single block's own instantaneous ratio — per-block instantaneous ppm is
      # unmeasurable noise for small, bursty-delivery blocks (the live mbc incident: 128-sample
      # Dante VSC blocks, 100% starved-rejected under the pre-#962 per-block guard). Mirrors the
      # canonical Linux-CI guard tests/genlock_preload.rs::vendored_source::
      # asrc_starvation_guard_gates_the_windowed_ppm_962 (probe-gated, can't compile on this
      # windows runner). Keep both in lock-step.
      - name: Assert ASRC estimator windows its measurement before gating (#962)
        shell: pwsh
        run: |
          $h = (Get-Content "vendor/obs-studio/libobs/media-io/asrc-compensator.h" -Raw) -replace '\s+', ' '
          if ($h -notmatch [regex]::Escape('#define ASRC_WINDOW_S 1.0')) {
            Write-Error "asrc-compensator.h: #962 measurement-window duration constant (ASRC_WINDOW_S) missing or changed"; exit 1
          }
          if ($h -notmatch [regex]::Escape('double window_raw_s;') -or $h -notmatch [regex]::Escape('double window_master_s;') -or $h -notmatch [regex]::Escape('uint32_t window_block_count;')) {
            Write-Error "asrc-compensator.h: #962 window-accumulator fields missing from struct asrc_compensator"; exit 1
          }
          $c = (Get-Content "vendor/obs-studio/libobs/media-io/asrc-compensator.c" -Raw) -replace '\s+', ' '
          if ($c -notmatch [regex]::Escape('if (fabs(window_ppm) > ASRC_MAX_SANE_INSTANTANEOUS_PPM) {') -or $c -notmatch [regex]::Escape('c->starved_block_count += window_block_count;')) {
            Write-Error "asrc-compensator.c: #962 starvation ceiling no longer gates the WINDOWED ppm value"; exit 1
          }
          Write-Output "ASRC windowed measurement present (#962 window constant + accumulator fields + windowed gate) — OK"

      # #1084: the inner rate estimator must be the sliding least-squares RATE regression (over the
      # #962 window points), NOT the pre-#1084 fixed-gain time-EMA — the EMA's endpoint-jitter
      # variance was the global A/V-wander root cause. Mirrors the canonical Linux-CI guard
      # tests/genlock_preload.rs::vendored_source::asrc_uses_sliding_regression_estimator_1084
      # (probe-gated, can't compile on this windows runner). Keep both in lock-step.
      - name: Assert ASRC uses the sliding regression estimator (#1084)
        shell: pwsh
        run: |
          $h = (Get-Content "vendor/obs-studio/libobs/media-io/asrc-compensator.h" -Raw) -replace '\s+', ' '
          if ($h -notmatch [regex]::Escape('#define ASRC_REGRESSION_SPAN_S 600.0') -or $h -notmatch [regex]::Escape('#define ASRC_REGRESSION_LOCK_SPAN_S 60.0') -or $h -notmatch [regex]::Escape('#define ASRC_REGRESSION_MIN_POINTS 30')) {
            Write-Error "asrc-compensator.h: #1084 regression constant (ASRC_REGRESSION_SPAN_S/LOCK_SPAN_S/MIN_POINTS) missing or changed"; exit 1
          }
          if ($h -notmatch [regex]::Escape('double reg_x[ASRC_REGRESSION_CAP];') -or $h -notmatch [regex]::Escape('bool reg_locked;')) {
            Write-Error "asrc-compensator.h: #1084 regression point-buffer fields (reg_x[]/reg_locked) missing from struct asrc_compensator"; exit 1
          }
          $c = (Get-Content "vendor/obs-studio/libobs/media-io/asrc-compensator.c" -Raw) -replace '\s+', ' '
          if ($c -notmatch [regex]::Escape('c->estimated_ppm = slope * 1000000.0;')) {
            Write-Error "asrc-compensator.c: #1084 estimated_ppm no longer set from the least-squares slope (the inner estimator was reverted)"; exit 1
          }
          if ($c -notmatch [regex]::Escape('asrc_regression_flush(c);')) {
            Write-Error "asrc-compensator.c: #1084 regression buffer never FLUSHED on a level shift (starved window / non-positive master)"; exit 1
          }
          if ($c -match [regex]::Escape('exp(-window_master_s') -or $c -match [regex]::Escape('ASRC_TIME_CONSTANT_S')) {
            Write-Error "asrc-compensator.c: #1084 the pre-#1084 time-EMA smoothing is BACK — the estimator must be the sliding regression only"; exit 1
          }
          Write-Output "ASRC sliding-regression estimator present (#1084 constants + buffer fields + slope + flush; EMA gone) — OK"

      # #942: the A/V-sync dock's in-process lock corrector must be MONITOR-ONLY by build
      # default — the E2E gate (scripts/av_sync_calibrate.py --apply) is the only CONTINUOUS/
      # closed-loop writer of genlock_latency_ms_src (scripts/obs_phase2.py's own bounded
      # snapshot-and-restore around a single delivery-verify test run, #358/#691, is a separate,
      # non-closed-loop exception — it is not a second actuator). Two independent CONTINUOUS
      # actuators writing the same live knob never
      # converge (root-cause evidence on the #942 ticket: a 20-run random walk while both were
      # live). Same hard-lock convention as #257/#912 above — no env, no WebSocket flag, no
      # per-source opt-in; the write call site must consult the hard-locked
      # cb_dock_lock_may_actuate() seam before ever applying a decide() result. Mirrors the
