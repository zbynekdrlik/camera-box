name: Full-path E2E (recording-based · hardware · self-hosted dev1)

# Recording-based 4-NODE full-path zero-loss + per-hop latency HARD GATE (#105/#7):
# drives the real broadcast chain cam2 → cam1 → strih OBS → stream OBS and decides the
# verdict ONLY from RECORDED output — the cam2 painter ground truth, cam1's grab
# recording, and the strih/stream OBS PROGRAM recordings — NEVER an NDI tap (the tap
# live NDI-tap harness produced false sampling artifacts and was removed, #210).
# scripts/recording-e2e.sh exits non-zero on ANY strict-hop loss / undecodable / a span
# below 300 s. The cam2 loopback Phase-1 twin is loopback-e2e.yml.
#
# THE FOUR EVIDENCE NODES (per-frame id + ts at each, dual-QR tick=max):
#   1. cam2  — QR GENERATED: painter `tick,gen_ts_ns` CSV (--paint-log).
#   2. cam1  — camera GRAB: camera-box --record-grab streams gray8 to a dev1 ffmpeg
#              listener (cam1 has no ffmpeg) → ffv1 cam1.mkv + a grab-ts sidecar.
#   3. strih — OBS PROGRAM recording (obs-ws StartRecord/StopRecord).
#   4. stream— OBS PROGRAM recording.
#
# #406/#312 item5 (2026-07-09): this workflow was ORIGINALLY manual-only by project decision
# ("the operator is the guard, no automated streaming guard") — that decision is now SUPERSEDED.
# The rig-based E2E is now an ACTUAL BLOCKING merge gate on dev->main PRs (see the branch
# protection required-status-check on the `full-path` job), automatically triggered by
# `pull_request` below. The automated-streaming-guard gap this closes is filled by
# scripts/rig-busy-gate.sh (the FIRST step of the job): it polls OBS WebSocket on strih+stream
# for GetStreamStatus/GetRecordStatus and refuses to reroute the production program scenes while
# a REAL broadcast is live — polling up to a 30-minute budget, failing CLOSED (never proceeding
# as "free") if the rig is unreachable. `workflow_dispatch` remains available for an operator-run
# manual soak up to 1800 s.
#
# Deliberately, like loopback-e2e.yml:
#   * This REROUTES the production strih + stream OBS program to the probe scene AND RECORDS it
#     for the run duration — gated by rig-busy-gate.sh (above), which refuses to run while the
#     rig is genuinely busy with a live broadcast. The harness teardown trap restores each box's
#     program+preview scene AND the cam1/cam2 services AND kills the dev1 grab listener on exit
#     (incl. cancel) — see scripts/recording-e2e.sh cleanup().
#   * runs-on the self-hosted dev1 runner (label `camera-lan`) — GitHub-hosted runners
#     cannot reach cam1/cam2/strih/stream on the 10.77.9.0/24 LAN, and the cam1 grab
#     stream is encoded by ffmpeg ON dev1.
#   * NOT part of ci.yml — kept as its own workflow so the busy-gate + hardware concurrency
#     group can be scoped to just this job and loopback-e2e.yml's job, without affecting the
#     lint/test/coverage/build jobs that DO run on every push.
#   * PREREQS on the boxes: DistroAV "NDI Main Output" enabled on strih+stream; OBS
#     WebSocket :4455 reachable; a standing `python -m http.server 8899` on each Windows
#     box serving its OBS record directory (dev1 curls the recordings from it — scp to
#     Windows is denied); ffmpeg on dev1 (encodes cam1's grab stream).

on:
  workflow_dispatch:
    inputs:
      duration_secs:
        # Default 300 s = the acceptance floor (a regression gate needs >=300 s, not a
        # full 30-min soak each dispatch). cam1's ffv1 grab is ~20 MB/s, so 300 s ≈ 6 GB
        # on dev1; raise toward 1800 only when dev1 has the disk headroom (the script's
        # disk preflight fails early otherwise). Ideal soak (1800 s) is an operator opt-in.
        description: "Steady-state run seconds (>=300; cam1 grab ~20 MB/s on dev1)"
        default: "300"
      trap_test_657:
        # #657 investigation ONLY (remove once the investigation is closed out): runs a
        # bash EXIT/HUP/INT/TERM trap + long `sleep` in place of the real rig E2E (busy-gate
        # and recording-e2e.sh are both SKIPPED — no rig interaction at all). Dispatch this
        # with trap_test_657=true, then `gh run cancel` the run while it is mid-sleep, to
        # empirically prove whether an Actions cancellation on this self-hosted runner
        # actually delivers a signal that runs a bash trap to completion (#657 hypothesis 1).
        description: "#657 ONLY: 'true' runs a trap+sleep signal-delivery smoke test instead of the real E2E"
        default: "false"
  # #406/#312 item5: the automatic BLOCKING merge gate. Fires on every dev->main PR
  # open/update — the busy-gate step protects the live rig, so this can safely run
  # unattended (never on every push to dev — only when a PR targeting main exists/changes).
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read  # #646: the docs-only detection step reads the PR diff via `gh pr diff`

# Workflow-level: supersede a stale run on a re-push to the SAME PR (or the same ref for a
# manual dispatch) so a fast follow-up push doesn't leave an old 30-min-busy-wait run burning
# the self-hosted runner. This is INDEPENDENT of the job-level hardware-serialization group
# below — GitHub Actions supports both a workflow-level group (governs whether a NEW RUN
# supersedes an older run of THIS workflow) and a job-level group (governs whether a JOB,
# possibly from a DIFFERENT workflow, may run concurrently with another job in the same
# group) at once; they are enforced independently, not merged into one.
concurrency:
  group: full-path-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-path:
    name: Full-path E2E (rig zero-loss gate)
    # #406/#312 item5: never run this on a FORK PR — it reroutes + records production OBS on
    # the LAN-only self-hosted runner, which a fork PR must never be able to trigger with
    # untrusted code. workflow_dispatch (always same-repo, operator-run) is unaffected.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, camera-lan]
    # 30 min rig-busy-gate budget + up to 300s (PR)/1800s (manual soak) recording + decode headroom.
    timeout-minutes: 75
    # Job-level: never run this job concurrently with loopback-e2e.yml's job — they both drive
    # the same physical cam2/strih/stream hardware. Shares loopback-e2e.yml's exact group string.
    concurrency:
      group: loopback-e2e-hardware
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: "#657 investigation: bash trap+sleep signal-delivery smoke test (no rig interaction)"
        # ONLY runs when dispatched with trap_test_657=true. Deliberately touches NEITHER
        # strih/stream OBS NOR any cam box — this step exists purely to answer #657
        # hypothesis 1: does an Actions cancellation on this self-hosted runner actually
        # deliver a signal that runs a bash EXIT/HUP/INT/TERM trap to completion, the same
        # way recording-e2e.sh's own cleanup() trap (armed via `trap cleanup EXIT HUP INT
        # TERM`) would need to during the real harness's long foreground `sleep` recording
        # window? Dispatch this, then `gh run cancel` the run while the log shows
        # "SLEEPING", then read the log file directly on dev1 (this IS the self-hosted
        # runner host) — TRAP_RAN present = the trap fired; absent = it never ran.
        # Deliberately no `set -e`: a step that aborts on its own trap's failure would
        # defeat the point of observing whatever actually happens under cancellation.
        if: inputs.trap_test_657 == 'true'
        run: |
          set -uo pipefail
          LOG="/tmp/trap-test-657-${{ github.run_id }}.log"
          # The trap must live in a NESTED bash process — exactly the structure recording-e2e.sh
          # is actually invoked with (`run: bash scripts/recording-e2e.sh`, a plain external
          # command from this outer runner-managed script, NOT `exec`'d and NOT inline in this
          # step's own top-level process). Testing the trap inline in THIS top-level script would
          # be a structurally different case from the real harness and could answer a different
          # question than #657 is actually asking.
          cat > /tmp/trap-test-657-inner.sh <<'INNER_EOF'
          #!/usr/bin/env bash
          set -uo pipefail
          echo "START pid=$$ ppid=$PPID $(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" > "$LOG"
          trap 'echo "TRAP_RAN sig_exit=$? $(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$LOG"' EXIT HUP INT TERM
          echo "SLEEPING pid=$$ $(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$LOG"
          sleep 180
          echo "SLEEP_COMPLETED_NORMALLY (not cancelled in time) $(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$LOG"
          INNER_EOF
          chmod +x /tmp/trap-test-657-inner.sh
          LOG="$LOG" bash /tmp/trap-test-657-inner.sh

      - name: Detect docs-only diff (#646 — skip busy-gate+E2E on docs-only PRs)
        id: docs-only
        # #646: a RUNTIME `if:`-based skip, NEVER `on.pull_request.paths`/`paths-ignore` at the
        # trigger level — a trigger-level path filter means a docs-only PR gets NO check run at
        # all for this workflow, and a required status check with no check run ever created reads
        # as eternally "pending" to branch protection (the PR could never merge). This step still
        # runs the job and reports a genuine (skipped) outcome instead. workflow_dispatch has no
        # PR to diff — never treated as docs-only, always runs in full (an operator-run manual
        # soak should never be silently skipped).
        if: github.event_name == 'pull_request' && inputs.trap_test_657 != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHANGED="$(gh pr diff ${{ github.event.pull_request.number }} --name-only)"
          echo "changed files:"
          echo "$CHANGED"
          DOCS_ONLY=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*|.claude/*) ;;
              *) DOCS_ONLY=false ;;
            esac
          done <<< "$CHANGED"
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          echo "Docs-only PR: $DOCS_ONLY"

      - name: Rig-busy gate — refuse to reroute prod OBS while a REAL broadcast is live (#406/#312)
        # Polls OBS WebSocket on strih+stream (GetStreamStatus/GetRecordStatus) for up to 30 min.
        # Distinct exit codes: 0 = free (proceed), 42 = still busy after the budget, 43 = rig
        # unreachable (fails CLOSED, never assumes "free"). See scripts/rig-busy-gate.sh.
        # #646: SKIPPED (reported skipped, not silently absent) on a confirmed docs-only PR;
        # always runs for workflow_dispatch (manual soak) regardless.
        # #657: also SKIPPED when trap_test_657=true — that mode never touches the rig.
        if: inputs.trap_test_657 != 'true' && (github.event_name == 'workflow_dispatch' || steps.docs-only.outputs.docs_only != 'true')
        run: bash scripts/rig-busy-gate.sh

      - name: Recording-based 4-node cam2→cam1→strih→stream zero-loss E2E (HARD GATE)
        # recording-e2e.sh runs recording-verdict with the strict any-drop-fails verdict
        # on the cam1→strih + strih→stream hops (0 undecodable, 0 net loss, >=300 s).
        # set -e in the script + this step's default shell make a breach a hard CI fail.
        # #406: recording-e2e.sh ALSO re-checks rig-busy-check itself immediately before it
        # reroutes strih/stream's program scenes (belt-and-braces against the rig going busy
        # in the window between this gate passing and the reroute actually happening).
        # #646: SKIPPED alongside the busy-gate on a confirmed docs-only PR (never just one of
        # the two skipped) — always runs for workflow_dispatch regardless.
        # #657: also SKIPPED when trap_test_657=true — that mode never touches the rig.
        if: inputs.trap_test_657 != 'true' && (github.event_name == 'workflow_dispatch' || steps.docs-only.outputs.docs_only != 'true')
        env:
          NDI_RUNTIME_DIR_V6: /usr/lib/ndi
          # PR-triggered runs use the 300s acceptance-floor profile (no `inputs.duration_secs`
          # on a pull_request event); workflow_dispatch keeps its own default/operator override.
          DURATION: ${{ inputs.duration_secs || '300' }}
        run: bash scripts/recording-e2e.sh

      - name: Upload verdict JSON + report PNG + pixel proof
        if: always() # keep the evidence even on a failing verdict
        uses: actions/upload-artifact@v4
        with:
          name: recording-e2e-full-path
          path: |
            /tmp/recording-e2e-*/verdict-*.json
            /tmp/recording-e2e-*/report-*.png
            /tmp/recording-e2e-*/pixel-proof/**
          if-no-files-found: warn

      - name: Discord alert on frame-loss regression (bot API → #notifications)
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHANNEL_ID:-}" ]; then
            echo "DISCORD_BOT_TOKEN/DISCORD_CHANNEL_ID not set — skipping alert."
            exit 0
          fi
          content="🔴 **camera-box recording-based full-path E2E FAILED** (${SHA:0:7}) — cam2→cam1→strih→stream frame-loss/latency gate breached — ${RUN_URL}"
          payload=$(jq -n --arg c "$content" '{content:$c}')
          curl -fsS --max-time 10 -X POST \
            -H "Authorization: Bot ${BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages" >/dev/null
          echo "Frame-loss regression alert posted to #notifications."
