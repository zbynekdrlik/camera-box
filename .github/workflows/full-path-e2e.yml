name: Full-path E2E (hardware · self-hosted dev1)

# Full-path source→endpoint zero-loss + per-hop latency HARD GATE (#7): drives the
# real broadcast chain cam2 → strih OBS → stream OBS and fails the run on ANY real
# frame loss (scripts/multitap-e2e.sh exits non-zero on a strict-zero-loss verdict
# breach; the cam2 loopback Phase-1 twin is loopback-e2e.yml).
#
# Deliberately, like loopback-e2e.yml:
#   * MANUAL by default (workflow_dispatch) — this REROUTES the production strih +
#     stream OBS program to the probe scene for the run duration, taking the chain
#     OFF-AIR. An operator must dispatch it knowing the chain is free to disrupt —
#     the operator is the guard (project decision: no automated streaming guard).
#     The harness teardown trap restores each box's program+preview scene AND the
#     cam2 service on exit (incl. cancel) — see scripts/multitap-e2e.sh cleanup().
#   * runs-on the self-hosted dev1 runner (label `camera-lan`) — GitHub-hosted
#     runners cannot reach cam2/strih/stream on the 10.77.9.0/24 LAN.
#   * NOT part of ci.yml — a per-PR run would reroute prod on every push. This is
#     the standing full-path regression gate: dispatch it after rig/genlock changes
#     and on a cadence the operator chooses.
#
# OPTIONAL nightly schedule (commented): only enable after the operator confirms a
# fixed hour at which auto-rerouting the prod chain off-air is always safe — that
# overrides the manual-guard model above, so it stays OFF until the operator opts in.
#   schedule:
#     - cron: "30 3 * * *"   # 03:30 UTC = ~05:30 CEST, off-peak — OPERATOR MUST CONFIRM

on:
  workflow_dispatch:
    inputs:
      duration_secs:
        description: "Steady-state run seconds (job ceiling 60 min incl. build)"
        default: "1800"
      lead_discard_secs:
        description: "Leading-discard window (s) — drop the post-reset genlock prime"
        default: "60"

permissions:
  contents: read

# Share ONE hardware concurrency group with loopback-e2e (its exact group string)
# so the two hardware workflows never fight for cam2 / the OBS chain at once.
concurrency:
  group: loopback-e2e-hardware
  cancel-in-progress: false

jobs:
  full-path:
    runs-on: [self-hosted, linux, camera-lan]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Full-path cam→strih→stream zero-loss E2E (HARD GATE)
        # multitap-e2e.sh passes NO --max-loss-pct => multitap-probe uses the strict
        # any-drop-fails verdict and exits non-zero on real pipeline loss. set -e in
        # the script + this step's default shell make that a hard CI failure.
        env:
          NDI_RUNTIME_DIR_V6: /usr/lib/ndi
          DURATION: ${{ inputs.duration_secs }}
          LEAD_DISCARD: ${{ inputs.lead_discard_secs }}
        run: bash scripts/multitap-e2e.sh

      - name: Upload metrics artifact
        if: always() # keep the evidence even on a failing verdict
        uses: actions/upload-artifact@v4
        with:
          name: multitap-probe-full-path
          path: /tmp/multitap-probe.json
          if-no-files-found: warn

      - name: Discord alert on frame-loss regression (bot API → #notifications)
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHANNEL_ID:-}" ]; then
            echo "DISCORD_BOT_TOKEN/DISCORD_CHANNEL_ID not set — skipping alert."
            exit 0
          fi
          content="🔴 **camera-box full-path E2E FAILED** (${SHA:0:7}) — cam→strih→stream frame-loss/latency gate breached — ${RUN_URL}"
          payload=$(jq -n --arg c "$content" '{content:$c}')
          curl -fsS --max-time 10 -X POST \
            -H "Authorization: Bot ${BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages" >/dev/null
          echo "Frame-loss regression alert posted to #notifications."
