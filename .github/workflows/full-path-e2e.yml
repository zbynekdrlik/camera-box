name: Full-path E2E (recording-based · hardware · self-hosted dev1)

# Recording-based 4-NODE full-path zero-loss + per-hop latency HARD GATE (#105/#7):
# drives the real broadcast chain cam2 → cam1 → strih OBS → stream OBS and decides the
# verdict ONLY from RECORDED output — the cam2 painter ground truth, cam1's grab
# recording, and the strih/stream OBS PROGRAM recordings — NEVER an NDI tap (the tap
# live NDI-tap harness produced false sampling artifacts and was removed, #210).
# scripts/recording-e2e.sh exits non-zero on ANY strict-hop loss / undecodable / a span
# below 300 s. The cam2 loopback Phase-1 twin is loopback-e2e.yml.
#
# THE FOUR EVIDENCE NODES (per-frame id + ts at each, dual-QR tick=max):
#   1. cam2  — QR GENERATED: painter `tick,gen_ts_ns` CSV (--paint-log).
#   2. cam1  — camera GRAB: camera-box --record-grab streams gray8 to a dev1 ffmpeg
#              listener (cam1 has no ffmpeg) → ffv1 cam1.mkv + a grab-ts sidecar.
#   3. strih — OBS PROGRAM recording (obs-ws StartRecord/StopRecord).
#   4. stream— OBS PROGRAM recording.
#
# #406/#312 item5 (2026-07-09): this workflow was ORIGINALLY manual-only by project decision
# ("the operator is the guard, no automated streaming guard") — that decision is now SUPERSEDED.
# The rig-based E2E is now an ACTUAL BLOCKING merge gate on dev->main PRs (see the branch
# protection required-status-check on the `full-path` job), automatically triggered by
# `pull_request` below. The automated-streaming-guard gap this closes is filled by
# scripts/rig-busy-gate.sh (the FIRST step of the job): it polls OBS WebSocket on strih+stream
# for GetStreamStatus/GetRecordStatus and refuses to reroute the production program scenes while
# a REAL broadcast is live — polling up to a 30-minute budget, failing CLOSED (never proceeding
# as "free") if the rig is unreachable. `workflow_dispatch` remains available for an operator-run
# manual soak up to 1800 s.
#
# #406 (2026-07-11, user directive): the required pull_request job now runs the FUSED
# multi-camera sweep (ALL_CAMBOX=1, recording step env below) — the EPIC's own final acceptance
# item. Before this flip the automatic gate only exercised the single-camera path, so a
# cross-camera delivery-latency SPREAD regression (#624/#286) or an A/V-offset regression (#641)
# could merge with this required check green (both checks existed in code, but only in the
# on-demand sweep). ALL_CAMBOX=1 cycles EVERY active cambox through strih PROGRAM for
# SEGMENT_SECS each (recording-e2e.sh's own default sweep/segment sizing) and cam2 emits its
# continuous QPSK audio marker for the whole run, so the fused verdict now also gates on the
# per-camera delivery-latency spread AND the A/V-offset (default AV_EXPECTED_MS=0). Scoped to
# `pull_request` only — a manual `workflow_dispatch` operator soak is unchanged (single-camera).
#
# Deliberately, like loopback-e2e.yml:
#   * This REROUTES the production strih + stream OBS program to the probe scene AND RECORDS it
#     for the run duration — gated by rig-busy-gate.sh (above), which refuses to run while the
#     rig is genuinely busy with a live broadcast. The harness teardown trap restores each box's
#     program+preview scene AND the cam1/cam2 services AND kills the dev1 grab listener on exit
#     (incl. cancel) — see scripts/recording-e2e.sh cleanup().
#   * runs-on the self-hosted dev1 runner (label `camera-lan`) — GitHub-hosted runners
#     cannot reach cam1/cam2/strih/stream on the 10.77.9.0/24 LAN, and the cam1 grab
#     stream is encoded by ffmpeg ON dev1.
#   * NOT part of ci.yml — kept as its own workflow so the busy-gate + hardware concurrency
#     group can be scoped to just this job and loopback-e2e.yml's job, without affecting the
#     lint/test/coverage/build jobs that DO run on every push.
#   * PREREQS on the boxes: DistroAV "NDI Main Output" enabled on strih+stream; OBS
#     WebSocket :4455 reachable; a standing `python -m http.server 8899` on each Windows
#     box serving its OBS record directory (dev1 curls the recordings from it — scp to
#     Windows is denied); ffmpeg on dev1 (encodes cam1's grab stream).

on:
  workflow_dispatch:
    inputs:
      duration_secs:
        # Default 300 s = the acceptance floor (a regression gate needs >=300 s, not a
        # full 30-min soak each dispatch). cam1's ffv1 grab is ~20 MB/s, so 300 s ≈ 6 GB
        # on dev1; raise toward 1800 only when dev1 has the disk headroom (the script's
        # disk preflight fails early otherwise). Ideal soak (1800 s) is an operator opt-in.
        description: "Steady-state run seconds (>=300; cam1 grab ~20 MB/s on dev1)"
        default: "300"
      offline_ack:
        # #827: overrides the checked-in rig-fleet.txt default outright (an operator dispatching
        # manually with a DIFFERENT physical rig state than the checked-in file — e.g. a box came
        # back, or a NEW box just went down) — comma-separated "box:reason" pairs, same format
        # scripts/lib/cambox-offline-ack.sh already parses (e.g. "cam5:powered-off-2026-07-27").
        # Leave empty (default) to use the checked-in rig-fleet.txt as-is. The automatic
        # pull_request gate below (which carries NO inputs) always falls through to rig-fleet.txt.
        description: "CAMBOX_OFFLINE_ACK override (comma 'box:reason' pairs; empty = use rig-fleet.txt)"
        default: ""
      no_main_pin:
        # #1136: DISABLE the camera-box pin-to-origin/main gate for a DELIBERATE pre-merge operator
        # soak of a build you have MANUALLY deployed to the fleet that is NOT yet on main (the
        # documented escape in .claude/rules/early-gate-pin-doctrine.md). Leave false (default) so the
        # gate enforces "every active box == origin/main"; the automatic pull_request gate below
        # carries no inputs, so it ALWAYS enforces the pin.
        description: "Disable the camera-box main-pin gate (pre-merge soak of a manually-deployed build)"
        type: boolean
        default: false
  # #406/#312 item5: the automatic BLOCKING merge gate. Fires on every dev->main PR
  # open/update — the busy-gate step protects the live rig, so this can safely run
  # unattended (never on every push to dev — only when a PR targeting main exists/changes).
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read  # #703: the Windows-verdict-artifact fetch step queries ci.yml's runs (gh run list/download)

# Workflow-level: supersede a stale run on a re-push to the SAME PR (or the same ref for a
# manual dispatch) so a fast follow-up push doesn't leave an old 30-min-busy-wait run burning
# the self-hosted runner. This is INDEPENDENT of the job-level hardware-serialization group
# below — GitHub Actions supports both a workflow-level group (governs whether a NEW RUN
# supersedes an older run of THIS workflow) and a job-level group (governs whether a JOB,
# possibly from a DIFFERENT workflow, may run concurrently with another job in the same
# group) at once; they are enforced independently, not merged into one.
concurrency:
  group: full-path-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-path:
    name: Full-path E2E (rig zero-loss gate)
    # #406/#312 item5: never run this on a FORK PR — it reroutes + records production OBS on
    # the LAN-only self-hosted runner, which a fork PR must never be able to trigger with
    # untrusted code. workflow_dispatch (always same-repo, operator-run) is unaffected.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, camera-lan]
    # 30 min rig-busy-gate budget + up to 300s (PR)/1800s (manual soak) recording + decode headroom.
    timeout-minutes: 75
    # Job-level: never run this job concurrently with loopback-e2e.yml's job — they both drive
    # the same physical cam2/strih/stream hardware. Shares loopback-e2e.yml's exact group string.
    concurrency:
      group: loopback-e2e-hardware
      cancel-in-progress: false
    steps:
      # #949: fetch-depth 0 (full history) — version-integrity-gate.sh's cross-box genlock-parity
      # facet now runs a REAL `git diff`/`git rev-parse` (scripts/drift-guard.sh's
      # genlock_parity_equivalent) against each box's live GENLOCK_BUILD_SHA.txt to tell a
      # cosmetic label-only mismatch (a Windows-only vendor change, #949) apart from a real fleet
      # skew. A box's SHA is often an OLDER commit, not the branch tip — actions/checkout@v4's
      # default shallow (depth=1) clone would not carry it, and the gate's own `git fetch origin`
      # (a plain, unqualified fetch) only refreshes ref TIPS, it does not retroactively deepen
      # history behind a shallow boundary. Without this, the gate would fail-closed (DRIFT) on
      # exactly the case #949 exists to fix. Mirrors the `mutants` job in ci.yml, which already
      # needed the same for `--in-diff`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only diff (#646 — skip busy-gate+E2E on docs-only PRs; #746 fail-open, local git diff)
        id: docs-only
        # #646: a RUNTIME `if:`-based skip, NEVER `on.pull_request.paths`/`paths-ignore` at the
        # trigger level — a trigger-level path filter means a docs-only PR gets NO check run at
        # all for this workflow, and a required status check with no check run ever created reads
        # as eternally "pending" to branch protection (the PR could never merge). This step still
        # runs the job and reports a genuine (skipped) outcome instead. workflow_dispatch has no
        # PR to diff — never treated as docs-only, always runs in full (an operator-run manual
        # soak should never be silently skipped).
        #
        # #746: this used to derive the changed-file list via the GitHub PR-diff CLI call, run
        # under a strict shell mode that exits on the first error. GitHub's PR-diff API REFUSES
        # once a PR's accumulated diff crosses its size limit ("too large") — a long-lived
        # dev->main accumulator PR (like #704) eventually crosses that wall, and the strict shell
        # mode turned that refusal into an immediate non-zero exit, killing the WHOLE job
        # (busy-gate + recording-e2e never even started) — the REQUIRED merge gate could no
        # longer produce a result at all, on any future push, no matter how healthy the rig was.
        # Fixed two ways:
        #   1. Derive the changed-file list LOCALLY: fetch main, then diff the two commits'
        #      trees directly (deliberately NOT a merge-base-relative diff — actions/checkout@v4's
        #      default shallow (depth=1) checkout has no shared history to compute a merge-base
        #      from, so that form would itself fail on every single run). A local diff has no API
        #      size limit at all — the checkout is already on disk.
        #   2. FAIL OPEN: any failure deriving the list (a broken fetch, an unexpected git error)
        #      is treated as "NOT docs-only" so the full E2E always runs — a broken OPTIMIZATION
        #      (the docs-only skip) must never block, or silently skip, the REQUIRED gate itself.
        #      This is why the step no longer runs in strict/exit-on-error mode: the detection is
        #      wrapped in its own `if`, and the docs_only output is written exactly once,
        #      unconditionally, after that if/else — both the success and the fail-open path
        #      always reach it.
        if: github.event_name == 'pull_request'
        run: |
          set -uo pipefail
          DOCS_ONLY=false
          if git fetch origin main 2>/dev/null && CHANGED="$(git diff --name-only origin/main HEAD 2>/dev/null)"; then
            echo "changed files:"
            echo "$CHANGED"
            DOCS_ONLY=true
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                *.md|docs/*|.claude/*) ;;
                *) DOCS_ONLY=false ;;
              esac
            done <<< "$CHANGED"
          else
            echo "WARNING (#746): could not derive the changed-file list locally -- failing OPEN (treating as NOT docs-only; the full E2E gate will run)" >&2
          fi
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          echo "Docs-only PR: $DOCS_ONLY"

      - name: Rig-busy gate — refuse to reroute prod OBS while a REAL broadcast is live (#406/#312)
        # Polls OBS WebSocket on strih+stream (GetStreamStatus/GetRecordStatus) for up to 30 min.
        # Distinct exit codes: 0 = free (proceed), 42 = still busy after the budget, 43 = rig
        # unreachable (fails CLOSED, never assumes "free"), 44 = the #830 shared cross-repo rig
        # lease is held by a LIVE foreign holder (e.g. restreamer's own CI) -- named explicitly
        # instead of an ambiguous RIG_BUSY. See scripts/rig-busy-gate.sh + scripts/lib/rig-lease.sh.
        # #646: SKIPPED (reported skipped, not silently absent) on a confirmed docs-only PR;
        # always runs for workflow_dispatch (manual soak) regardless.
        if: github.event_name == 'workflow_dispatch' || steps.docs-only.outputs.docs_only != 'true'
        env:
          # #830: identify THIS run to the shared rig lease so a foreign gate (restreamer,
          # zbynekdrlik/restreamer#349) can name us instead of guessing from OBS state alone.
          RIG_LEASE_REPO: ${{ github.repository }}
          RIG_LEASE_RUN_ID: ${{ github.run_id }}
          RIG_LEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RIG_LEASE_JOB: ${{ github.job }}
        run: bash scripts/rig-busy-gate.sh

      - name: Fetch the matching Windows recording-verdict.exe for THIS commit (#703)
        # #703: E2E_EXECUTE_VERDICT=1 (below) makes recording-e2e.sh ACTUALLY DECODE strih+stream
        # over ssh instead of merely printing a plan for a human to paste — it needs a REAL
        # recording-verdict.exe built from THIS exact commit. ci.yml's own "windows-probe" job
        # already builds+uploads it (the probe-tools-windows-amd64 artifact) — but ci.yml
        # deliberately triggers on `push: [dev, main]` ONLY, never `pull_request` (see its own
        # header comment: "fire CI once per commit"), so this PR's head commit already has (or
        # will shortly have) a ci.yml run from the ORIGINAL push to dev — `pr-merge-policy.md`'s
        # own flow drives dev's CI green BEFORE opening the dev->main PR, so in the normal case
        # this is already done; the bounded poll below is the safety margin for a fast PR. Never
        # build a second Windows toolchain here — this job runs on the LAN-only self-hosted
        # runner (no Windows cross-compile). workflow_dispatch (manual operator soak) does NOT
        # need this — it stays in plan-print mode (E2E_EXECUTE_VERDICT stays 0), so this step is
        # scoped to `pull_request` only (same docs-only skip as the sibling steps).
        if: github.event_name == 'pull_request' && steps.docs-only.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.event.pull_request.head.sha }}"
          echo "Waiting for ci.yml's windows-probe artifact for commit $SHA ..."
          FOUND_RUN_ID=""
          for i in $(seq 1 60); do
            FOUND_RUN_ID="$(gh run list --workflow ci.yml --json databaseId,headSha,status,conclusion \
              --jq ".[] | select(.headSha==\"$SHA\" and .status==\"completed\" and .conclusion==\"success\") | .databaseId" \
              | head -1)"
            if [ -n "$FOUND_RUN_ID" ]; then
              echo "Found successful ci.yml run $FOUND_RUN_ID for $SHA"
              break
            fi
            # Report any run for this SHA that IS visible (queued/in_progress/failed) so a stuck
            # wait is diagnosable from the log, not silent polling.
            gh run list --workflow ci.yml --json databaseId,headSha,status,conclusion \
              --jq ".[] | select(.headSha==\"$SHA\") | \"  run \\(.databaseId): status=\\(.status) conclusion=\\(.conclusion)\"" || true
            sleep 20
          done
          if [ -z "$FOUND_RUN_ID" ]; then
            echo "::error::#703 no successful ci.yml run found for commit $SHA after the poll budget (20 min) — cannot fetch the Windows recording-verdict.exe for this commit."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/win-probe-tools"
          gh run download "$FOUND_RUN_ID" -n probe-tools-windows-amd64 --dir "$RUNNER_TEMP/win-probe-tools"
          test -f "$RUNNER_TEMP/win-probe-tools/recording-verdict.exe"
          echo "WIN_VERDICT_EXE_LOCAL=$RUNNER_TEMP/win-probe-tools/recording-verdict.exe" >> "$GITHUB_ENV"

      - name: Cold-cut keepalive-bypass arm check (#1086)
        # #1086: full-path-e2e.yml sources COLD_CUT_BYPASS_CAM / COLD_CUT_BYPASS_INPUT from
        # repository VARIABLES (see the recording step's env: block below) so a deliberate
        # keepalive-bypass GENUINE-cold run is a variable flip with no code change. A repository
        # variable is GLOBAL — it applies to EVERY dev→main PR gate run until cleared — so a
        # stuck/typo'd value would silently idle a LIVE strih receiver run after run. This step runs
        # BEFORE the ~30-min recording step and, via scripts/lib/cold-cut-bypass-guard.sh, prints a
        # LOUD ARMED banner when armed (silent when both variables are unset — the default) and
        # FAILS CLOSED on a target outside the current-sweep 2nd-cut set {CAM1,CAM2,CAM3} or a set
        # target with an empty input — catching a stuck variable before any rig time is spent.
        if: github.event_name == 'workflow_dispatch' || steps.docs-only.outputs.docs_only != 'true'
        env:
          COLD_CUT_BYPASS_CAM: ${{ vars.COLD_CUT_BYPASS_CAM }}
          COLD_CUT_BYPASS_INPUT: ${{ vars.COLD_CUT_BYPASS_INPUT }}
        run: |
          . scripts/lib/cold-cut-bypass-guard.sh
          cold_cut_bypass_arm_check

      - name: Recording-based 4-node cam2→cam1→strih→stream zero-loss E2E (HARD GATE)
        # recording-e2e.sh runs recording-verdict with the strict any-drop-fails verdict
        # on the cam1→strih + strih→stream hops (0 undecodable, 0 net loss, >=300 s).
        # set -e in the script + this step's default shell make a breach a hard CI fail.
        # #406: recording-e2e.sh ALSO re-checks rig-busy-check itself immediately before it
        # reroutes strih/stream's program scenes (belt-and-braces against the rig going busy
        # in the window between this gate passing and the reroute actually happening).
        # #646: SKIPPED alongside the busy-gate on a confirmed docs-only PR (never just one of
        # the two skipped) — always runs for workflow_dispatch regardless.
        if: github.event_name == 'workflow_dispatch' || steps.docs-only.outputs.docs_only != 'true'
        env:
          NDI_RUNTIME_DIR_V6: /usr/lib/ndi
          # issue 1244 (review fix): cambox_parity_align_before_gate's ci.yml-artifact resolution
          # is commit-scoped (never "newest on branch") -- but on a `pull_request` event
          # `$GITHUB_SHA` is the SYNTHETIC merge commit (refs/pull/N/merge), which ci.yml
          # (push:[dev,main] ONLY, deliberately never pull_request) never builds a run for, so the
          # lib's own $GITHUB_SHA fallback would resolve NOTHING on every automatic pull_request
          # run -- a 100% (not merely intermittent) false-refuse. Wire the PR's real HEAD sha
          # explicitly -- the SAME `github.event.pull_request.head.sha` the #703 fetch step above
          # already uses, for the identical reason. workflow_dispatch has no pull_request context
          # (its own checkout IS the candidate), so it falls back to `github.sha` unchanged.
          CAMBOX_ALIGN_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # PR-triggered runs use the 300s acceptance-floor profile (no `inputs.duration_secs`
          # on a pull_request event); workflow_dispatch keeps its own default/operator override.
          DURATION: ${{ inputs.duration_secs || '300' }}
          # #406 — the EPIC's own acceptance bar: the required pull_request job never exercised
          # the fused multi-camera sweep, so a real cross-camera delivery-latency spread
          # regression (#624/#286) or an A/V-offset regression (#641) could merge with this gate
          # green. ALL_CAMBOX=1 arms recording-e2e.sh's fused path, which self-wires everything
          # else it needs (the per-cambox switch schedule, cam2's continuous QPSK audio marker
          # via its own AV_SYNC_MARKER_DEVICE/CADENCE defaults, AV_EXPECTED_MS defaulting to 0) —
          # no other env var is required. Scoped to `pull_request` ONLY: a manual
          # `workflow_dispatch` operator soak keeps its existing single-camera behavior (never
          # silently widened by this flip; a future ticket can add an explicit input for it).
          ALL_CAMBOX: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          # #703: the required pull_request gate must ACTUALLY EXECUTE the zero-loss/A/V verdict
          # (the fix this PR delivers), never just print a plan nobody runs. WIN_VERDICT_EXE_LOCAL
          # is set by the fetch step immediately above (pull_request only). workflow_dispatch
          # (manual operator soak) is UNCHANGED — stays in plan-print mode for the MCP holder.
          E2E_EXECUTE_VERDICT: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          # #711: the SAME bot-token #notifications path ci.yml's/this workflow's own "Discord
          # alert" steps already use (see .claude/skills/ci) — recording-e2e.sh's own
          # E2E_EXECUTE_VERDICT=1 branch posts the full Slovak report via
          # scripts/lib/e2e-discord-report.sh when the merge verdict is genuinely computed.
          # Fail-open: a missing/failing POST here never fails this step (see that file's header).
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          # #827: the automatic pull_request gate carries NO workflow_dispatch inputs, so this is
          # always empty for it — recording-e2e.sh's own cambox_offline_ack_effective then falls
          # through to the checked-in rig-fleet.txt default. A manual workflow_dispatch's
          # offline_ack input, when non-empty, overrides that default outright.
          CAMBOX_OFFLINE_ACK: ${{ github.event_name == 'workflow_dispatch' && inputs.offline_ack || '' }}
          # #1136: only a workflow_dispatch soak may disable the camera-box main-pin gate; the
          # automatic pull_request gate leaves this empty and always enforces the pin.
          CAMERA_BOX_VERSION_GATE_NO_MAIN_PIN: ${{ github.event_name == 'workflow_dispatch' && inputs.no_main_pin && '1' || '' }}
          # issue 1093 (2026-08-17): recalibrate the post-deploy sender-bounce reverify budget via
          # the harness's own env seam. The default budget (attempts=3, settle=6 -> ~24s) was sized
          # "comfortably above" a 2026-07-14 measured re-lock of 11.4s; a fresh live measurement
          # (systemctl restart camera-box on cam1 + frozen-camera-gate polling against strih)
          # showed natural re-lock now at t+20s, eating the whole margin — 3 consecutive PR-gate
          # attempts coin-flipped on it. attempts=5 x ~4s checks + 4 x 8s settles ≈ 52s, sized by
          # the same comfortably-above principle. Harness defaults stay untouched (pinned by
          # tests/harness_sender_bounce_reverify_758.rs); the ordering fix + the re-lock slowdown
          # root-cause stay open on the ticket.
          PREFLIGHT_MV_REVERIFY_ATTEMPTS: "5"
          PREFLIGHT_MV_REVERIFY_SETTLE_S: "8"
          # issue 1245: scripts/lib/frame-probe-parity-align.sh's [0/8] pre-gate auto-align
          # resolves the candidate probe-tools artifact BY THIS RUN'S CANDIDATE COMMIT (never
          # "newest ci.yml run on branch dev", which repeatedly returned ANCIENT runs inside this
          # self-hosted runner job). On a `pull_request` event the auto-set GITHUB_SHA is the
          # SYNTHETIC MERGE COMMIT, not the head -- ci.yml only ever runs+publishes for the REAL
          # head commit, so a raw GITHUB_SHA here would be a PERMANENT false-refuse. Explicitly
          # wire the true head sha, the SAME #703 pattern the "Fetch the matching Windows
          # recording-verdict.exe" step above already uses. push/workflow_dispatch runs never see
          # this event, so github.sha is already correct there and this only takes effect on PRs.
          FRAME_PROBE_ALIGN_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # #1086: the deliberate keepalive-bypass cold-cut target, sourced from REPOSITORY
          # VARIABLES (empty/unset by default -> scripts/lib/cold-cut-step.sh is an inert no-op and
          # a normal gate run is byte-for-byte unchanged). recording-e2e.sh only sees env vars set
          # on THIS step, so both must live here. A future genuine-cold run for issue 1086's LIVE
          # flip is a repository-variable flip with NO code change; the preceding "Cold-cut
          # keepalive-bypass arm check" step makes an armed value LOUD and fail-CLOSED first.
          COLD_CUT_BYPASS_CAM: ${{ vars.COLD_CUT_BYPASS_CAM }}
          COLD_CUT_BYPASS_INPUT: ${{ vars.COLD_CUT_BYPASS_INPUT }}
        # #832: this workflow never hardcodes an imag-nb address itself — recording-e2e.sh
        # resolves the ACTIVE imag host from scripts/imag-host.sh (the ONE declared source of
        # truth, reversible between the incumbent 10.77.9.182 and the replacement 10.77.9.187).
        # A future imag swap is a one-line change in that file, never a workflow edit.
        # #657: `exec` REPLACES this step's process image with recording-e2e.sh's own bash — a
        # plain `bash scripts/recording-e2e.sh` forks a NESTED child the Actions runner never
        # signals directly (empirically confirmed: it signals only the single top-level step PID
        # it started). Without `exec`, that outer wrapper eventually dies to the signal itself
        # (deferred ~10s) and orphans the inner trap-holding bash (reparented to pid 1) BEFORE the
        # runner's "kill entire process tree" sweep — so the orphan survives that sweep and is
        # only reaped later by an untrappable kill, and cleanup()'s trap never runs at all. With
        # `exec`, there is no separate child to orphan: the runner's direct-PID signal lands on
        # the actual trap-holding process.
        run: exec bash scripts/recording-e2e.sh

      - name: Fail-closed structural guard — verdict JSON MUST exist with overall_pass=true (#703)
        # Independent BACKSTOP against a REGRESSION of the #703 bug: some FUTURE code path in
        # recording-e2e.sh that exits 0 without the verdict ever being computed (exactly what
        # this issue reported — the required gate went green while [8/8] only PRINTED a plan,
        # scp/ssh to Windows was never executed). This re-asserts the verdict JSON genuinely
        # exists AND overall_pass=true, read straight from the file the harness itself writes —
        # independent of (and in addition to) the harness's own exit code. `always()` so it still
        # runs (and reports clearly) even when the E2E step above already failed. Scoped to
        # `pull_request` only — E2E_EXECUTE_VERDICT is 0 for workflow_dispatch (manual operator
        # soak), which legitimately never produces this file automatically (the MCP holder runs
        # the merge afterward, outside this job) — this guard would wrongly red-X that flow.
        if: always() && github.event_name == 'pull_request' && steps.docs-only.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          RUN_ID="${RECORDING_E2E_RUN_ID:-}"
          if [ -z "$RUN_ID" ]; then
            echo "::error::#703 fail-closed guard: RECORDING_E2E_RUN_ID was never set by recording-e2e.sh — the harness did not even reach the point a run id exists. The gate must not be green."
            exit 1
          fi
          VERDICT_JSON="/tmp/recording-e2e-${RUN_ID}/verdict-${RUN_ID}.json"
          if [ ! -f "$VERDICT_JSON" ]; then
            echo "::error::#703 fail-closed guard: $VERDICT_JSON does not exist — the recording zero-loss/A/V verdict was NEVER COMPUTED. This is exactly the #703 bug; the job must not go green without a real verdict."
            exit 1
          fi
          OVERALL="$(jq -r '.overall_pass' "$VERDICT_JSON")"
          echo "verdict JSON: $VERDICT_JSON  overall_pass=$OVERALL"
          if [ "$OVERALL" != "true" ]; then
            echo "::error::#703 fail-closed guard: overall_pass=$OVERALL (not true) in $VERDICT_JSON — the zero-loss/A/V verdict genuinely FAILED."
            exit 1
          fi
          echo "#703 fail-closed guard PASSED: $VERDICT_JSON exists and overall_pass=true."

      - name: Upload verdict JSON + report PNG + pixel proof
        if: always() # keep the evidence even on a failing verdict
        uses: actions/upload-artifact@v4
        with:
          name: recording-e2e-full-path
          # #703: scoped to THIS run's own RECORDING_E2E_RUN_ID (set by recording-e2e.sh via
          # GITHUB_ENV) — the old unscoped `/tmp/recording-e2e-*/...` glob picked up EVERY old
          # verdict JSON left on this self-hosted runner's /tmp from unrelated past sessions
          # (confirmed live: 29 stale verdicts uploaded alongside 0 for the run's own RUN_ID),
          # actively misleading forensics. Empty RECORDING_E2E_RUN_ID (the harness crashed before
          # ever setting it) safely matches nothing — if-no-files-found: warn handles that.
          path: |
            /tmp/recording-e2e-${{ env.RECORDING_E2E_RUN_ID }}/verdict-*.json
            /tmp/recording-e2e-${{ env.RECORDING_E2E_RUN_ID }}/report-*.png
            /tmp/recording-e2e-${{ env.RECORDING_E2E_RUN_ID }}/pixel-proof/**
          if-no-files-found: warn

      - name: Release the shared rig lease (#830 — cleanup, always, incl. cancellation)
        # #830: released here (never only on scripts/rig-busy-gate.sh's own success path) so a
        # cancelled run, or a later step failing, still frees the rig for restreamer's CI
        # (zbynekdrlik/restreamer#349) instead of leaving a dangling lease. Safe no-op if this run
        # never acquired the lease at all (docs-only skip, or a fast-failed busy-gate).
        if: always()
        env:
          RIG_LEASE_RUN_ID: ${{ github.run_id }}
        run: bash scripts/rig-lease-release.sh

      - name: Discord alert on E2E gate failure — report the stage that actually failed (#844)
        if: failure()
        # #844: this step fires on EVERY non-zero job exit, so it must NOT hardcode a frame-loss
        # verdict — a [0/8] preflight abort never records a frame. scripts/lib/e2e-failure-stage.sh
        # DERIVES the failed stage from this run's durable on-runner artifacts (the same
        # verdict-<RUN_ID>.json the #703 fail-closed guard trusts, plus the downloaded recordings)
        # and only ever claims a frame-loss/latency breach for a genuinely FAILING verdict.
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ env.RECORDING_E2E_RUN_ID }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHANNEL_ID:-}" ]; then
            echo "DISCORD_BOT_TOKEN/DISCORD_CHANNEL_ID not set — skipping alert."
            exit 0
          fi
          . scripts/lib/e2e-failure-stage.sh
          content="$(e2e_failure_stage_content "/tmp/recording-e2e-${RUN_ID:-}" "${RUN_ID:-}" "${SHA:0:7}" "$RUN_URL")"
          payload=$(jq -n --arg c "$content" '{content:$c}')
          curl -fsS --max-time 10 -X POST \
            -H "Authorization: Bot ${BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages" >/dev/null
          echo "E2E gate-failure alert (stage-aware, #844) posted to #notifications."
