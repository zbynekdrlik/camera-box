name: Windows genlock FAST (libobs hot-swap + vendored C++ compile gate)

# camera-box #136: a FAST build of ONLY the libobs target (obs.dll) from the
# vendored, genlock-patched tree — for iterating the genlock core DURING an event.
# The full Windows artifact (browser/CEF + DistroAV + installer layout) is
# windows-genlock.yml (~1-2.5 h); this builds just obs.dll in minutes for a hot DLL
# swap. obs.dll is ABI-compatible with the already-deployed distroav.dll because the
# #136 change is libobs-INTERNAL (a static function + a branch — no obs_source_frame
# layout change, no new public API). Manual dispatch; deploy off-air with a kept
# fallback + the one-click desktop revert.
#
# camera-box #101: this workflow now ALSO carries a PRE-MERGE compile gate for the
# vendored DistroAV C++ (the `distroav-compile-check` job below). The per-PR ci.yml is
# Rust-only and the libobs `build` job above compiles ONLY libobs, so a C++ compile
# error in the vendored DistroAV tree (ndi-source.cpp / ndi-output.cpp / the burn
# filter / plugin-main.cpp — the #97 forward-ref class) used to pass every push-to-dev
# gate and reach main, where only the manual 150-min windows-genlock.yml caught it
# (wasting a full build cycle). The compile-check configures + builds the DistroAV
# plugin against an installed libobs/obs-frontend-api SDK prefix with the CEF/browser
# dependency OFF, so it stays minutes-not-hours yet compiles the same vendored C++ the
# production build does. This repo gates merges via push-to-dev (it deliberately omits
# `pull_request` per #157), so push-to-dev IS the pre-merge gate.

on:
  workflow_dispatch:
  # camera-box #136/#101: also fire on a dev push that touches the vendored OBS or
  # DistroAV tree, so (a) a hot obs.dll build is available WITHOUT first merging the
  # workflow to the default branch (GitHub only lets workflow_dispatch run from the
  # default branch), and (b) the DistroAV compile gate runs pre-merge on any vendored
  # C++ change — including a DistroAV-only change, which the old libobs-only path
  # (`vendor/obs-studio/libobs/**`) silently skipped.
  push:
    branches: [dev]
    paths:
      - 'vendor/obs-studio/**'
      - 'vendor/distroav/**'
      - 'vendor/av-sync-dock/**'
      - '.github/workflows/windows-genlock-fast.yml'

permissions:
  contents: read

concurrency:
  group: windows-genlock-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Fail fast (before the configure/build) if the #136 patch is missing — mirrors
      # the Linux-CI guard tests/genlock_preload.rs::vendored_source::
      # timestamp_aligned_release_present.
      - name: Assert genlock timestamp-aligned release patch present (#136)
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          # #257: ts-align + render tick are build defaults (always on, no env).
          if ($src -match [regex]::Escape('getenv("OBS_GENLOCK_TS_ALIGN")')) { Write-Error "OBS_GENLOCK_TS_ALIGN env is BACK — #257 made ts-align a build default"; exit 1 }
          $vid = (Get-Content "vendor/obs-studio/libobs/obs-video.c" -Raw) -replace '\s+', ' '
          if ($vid -match [regex]::Escape('getenv("OBS_GENLOCK_WALL_CLOCK")')) { Write-Error "OBS_GENLOCK_WALL_CLOCK env is BACK — #257 made the render tick a build default"; exit 1 }
          if ($src -notmatch [regex]::Escape('genlock_ts_align_enabled() || source->genlock_latency_ms > 0')) { Write-Error "ts-align release gate gone (#136/#245)"; exit 1 }
          if ($src -notmatch [regex]::Escape('genlock_is_wallclock_ts(next_frame->timestamp)')) { Write-Error "wall-clock guard gone (#136)"; exit 1 }
          if ($src -notmatch [regex]::Escape('wall_now = genlock_wall_now_ns();')) { Write-Error "wall-clock source (genlock_wall_now_ns -> wall_now) gone (#136)"; exit 1 }
          if ($src -notmatch [regex]::Escape('genlock_present_ts(wall_now, preload, interval)')) { Write-Error "present_ts gone (#136)"; exit 1 }
          # #147: the backward wall-clock step (NTP/PTP sawtooth) re-anchor guard — without it
          # the ts-align release FREEZES the program feed forever on a backward clock step.
          # #269 [3]: detection on the MAX queued ts (depth-independent, uniform across sources).
          if ($src -notmatch [regex]::Escape('max_ts > wall_now + interval')) { Write-Error "backward-clock-step detection gone (#147/#269) — ts-align would freeze the program feed on an NTP/PTP step"; exit 1 }
          if ($src -notmatch [regex]::Escape('source->genlock_backward_steps++')) { Write-Error "backward-step re-anchor counter gone (#147)"; exit 1 }
          # #269 [2]: per-event latch — counter fires once per step, not per recovery tick.
          if ($src -notmatch [regex]::Escape('source->genlock_in_backward_step = true')) { Write-Error "backward-step per-event latch gone (#269 [2]) — counter would over-report"; exit 1 }
          Write-Output "#136/#257 ts-align + render tick build-default (no env) + #147 backward-step recovery present — OK"

      # #249: the fast path builds obs.dll from the real vendored source, so a `git subtree pull`
      # (#44) that reverts #245 to inert-but-still-compiling would hot-swap an INERT obs.dll un-gated
      # (the #235 regression: latency collapsed to one GLOBAL env knob, no per-source override). The
      # slow windows-genlock.yml gained this #245 gate in #248; mirror it here so the fast path fails
      # at the same token check rather than shipping an inert DLL. Pure source-text guard (no build) —
      # mirrors tests/genlock_preload.rs::vendored_source (probe-gated, can't compile on this runner).
      - name: Assert per-source genlock latency (ms) override present (#245)
        shell: pwsh
        run: |
          $obs = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($obs -notmatch [regex]::Escape('void obs_source_set_genlock_latency_ms(obs_source_t *source, uint32_t')) {
            Write-Error "obs-source.c: obs_source_set_genlock_latency_ms missing — #245 per-source latency API reverted"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('source->genlock_latency_ms > 0 ? source->genlock_latency_ms : genlock_reserve_ms()')) {
            Write-Error "obs-source.c: the per-source latency release-deadline gate is gone — #245 override inert in the render path"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('#define GENLOCK_SOURCE_LATENCY_MS_MAX 2000')) {
            Write-Error "obs-source.c: GENLOCK_SOURCE_LATENCY_MS_MAX no longer 2000 — #245 per-source cap reverted"; exit 1
          }
          # #292: the drop-cap must budget the held depth at the SOURCE arrival fps (60), not the canvas
          # output fps — a 60fps NDI feed into a 30fps stream canvas parks 2x the canvas-rate frames, so a
          # canvas-fps budget force-drains a deep latency at ~450ms. A subtree revert that drops the define
          # or the budget term silently re-caps the operator's A/V-align delay; fail the build at the token.
          if ($obs -notmatch [regex]::Escape('#define GENLOCK_MAX_SOURCE_FPS 60')) {
            Write-Error "obs-source.c: GENLOCK_MAX_SOURCE_FPS no longer 60 — #292 drop-cap arrival-fps budget reverted (latency re-caps at ~450ms)"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('source->genlock_latency_ms * GENLOCK_MAX_SOURCE_FPS')) {
            Write-Error "obs-source.c: genlock_source_drop_cap no longer budgets latency_frames at the source arrival rate — #292 deep latency force-drains at ~450ms"; exit 1
          }
          $api = (Get-Content "vendor/obs-studio/libobs/obs.h" -Raw) -replace '\s+', ' '
          if ($api -notmatch [regex]::Escape('EXPORT void obs_source_set_genlock_latency_ms(obs_source_t *source, uint32_t')) {
            Write-Error "obs.h: obs_source_set_genlock_latency_ms not EXPORTed — #245 DistroAV cannot resolve the setter"; exit 1
          }
          $ndi = (Get-Content "vendor/distroav/src/ndi-source.cpp" -Raw) -replace '\s+', ' '
          if ($ndi -notmatch [regex]::Escape('obs_properties_add_int(props, PROP_GENLOCK_LATENCY_MS_SRC')) {
            Write-Error "ndi-source.cpp: the editable per-source latency int field is gone — #245 reverted"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('obs_source_set_genlock_latency_ms')) {
            Write-Error "ndi-source.cpp: ndi_source_update no longer applies obs_source_set_genlock_latency_ms — #245 field inert"; exit 1
          }
          # #257: build-const latency floor 3 + genlock default-ON + hard-whitelist UI + runtime burn.
          if ($obs -notmatch [regex]::Escape('#define GENLOCK_LATENCY_MS_MIN 3')) { Write-Error "obs-source.c: GENLOCK_LATENCY_MS_MIN no longer 3 — #257 floor reverted"; exit 1 }
          if ($obs -notmatch [regex]::Escape('#define GENLOCK_LATENCY_MS_DEFAULT 3')) { Write-Error "obs-source.c: GENLOCK_LATENCY_MS_DEFAULT no longer 3 — #257 build-const reverted"; exit 1 }
          if ($obs -notmatch [regex]::Escape('ms < GENLOCK_LATENCY_MS_MIN ? GENLOCK_LATENCY_MS_MIN')) { Write-Error "obs-source.c: setter no longer floors at 3 (#257)"; exit 1 }
          if ($obs -notmatch [regex]::Escape('void obs_source_set_genlock_burn(obs_source_t *source, bool')) { Write-Error "obs-source.c: obs_source_set_genlock_burn missing — #257 runtime burn API reverted"; exit 1 }
          if ($api -notmatch [regex]::Escape('EXPORT void obs_source_set_genlock_burn(obs_source_t *source, bool')) { Write-Error "obs.h: obs_source_set_genlock_burn not EXPORTed — #257 DistroAV cannot resolve the burn setter"; exit 1 }
          if ($ndi -match [regex]::Escape('apply_genlock_lockdown_visibility')) { Write-Error "ndi-source.cpp: apply_genlock_lockdown_visibility is BACK — #257 hard whitelist replaced it"; exit 1 }
          if ($ndi -notmatch [regex]::Escape('GENLOCK_WHITELIST_PROPS')) { Write-Error "ndi-source.cpp: GENLOCK_WHITELIST_PROPS gone — #257 hard-lock UI reverted"; exit 1 }
          if ($ndi -notmatch [regex]::Escape('obs_data_set_default_bool(settings, PROP_GENLOCK_FIFO, true)')) { Write-Error "ndi-source.cpp: genlock no longer default-ON — #257 reverted"; exit 1 }
          if ($ndi -notmatch [regex]::Escape('obs_source_set_genlock_burn')) { Write-Error "ndi-source.cpp: ndi_source_update no longer applies obs_source_set_genlock_burn — #257 burn inert"; exit 1 }
          $flt = (Get-Content "vendor/distroav/src/ndi-burn-filter.cpp" -Raw) -replace '\s+', ' '
          if ($flt -match [regex]::Escape('getenv("OBS_BURN')) { Write-Error "ndi-burn-filter.cpp: OBS_BURN_* env is BACK — #257 made the burn a per-source bool"; exit 1 }
          if ($flt -notmatch [regex]::Escape('obs_source_get_genlock_burn')) { Write-Error "ndi-burn-filter.cpp: burn no longer reads the parent genlock_burn flag — #257 reverted"; exit 1 }
          Write-Output "per-source genlock latency (ms) override + #257 floor 3 + genlock default-ON + whitelist UI + runtime burn — OK"

      # #912: ASRC (issue 803's per-source clock-drift servo) must be a BUILD DEFAULT, mirroring
      # the #257 render-tick/ts-align hard-lock. The FAST path COMPILES the real vendored C (a
      # broken patch fails the build), but had NO source-text token gate for #912 — a `git
      # subtree pull` (#44) could hot-swap an obs.dll where ASRC silently reverted to inert
      # (bzalloc-zero default) un-gated on this fast path. Mirrors the canonical Linux-CI guard
      # tests/genlock_preload.rs::vendored_source::asrc_default_on_present_in_vendored_source
      # (probe-gated, can't compile on this runner). Keep both in lock-step.
      - name: Assert ASRC always-on-by-default (#912)
        shell: pwsh
        run: |
          $obs = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($obs -notmatch [regex]::Escape('source->asrc_enabled = true;')) {
            Write-Error "obs-source.c: obs_source_create_internal no longer defaults asrc_enabled to true — #912 ASRC build-default reverted (would ship silently OFF again)"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('void obs_source_set_asrc_enabled(obs_source_t *source, bool')) {
            Write-Error "obs-source.c: obs_source_set_asrc_enabled missing — the #912 optional override API must stay live"; exit 1
          }
          $api = (Get-Content "vendor/obs-studio/libobs/obs.h" -Raw) -replace '\s+', ' '
          if ($api -notmatch [regex]::Escape('EXPORT void obs_source_set_asrc_enabled(obs_source_t *source, bool')) {
            Write-Error "obs.h: obs_source_set_asrc_enabled not EXPORTed — #912 override path unreachable"; exit 1
          }
          Write-Output "ASRC always-on-by-default (#912 build-default init + live override API kept) — OK"

      # #960: the ASRC estimator must reject a starved/bursting block (no real timing
      # information) rather than fold it into the EMA and rail the servo at -ASRC_MAX_PPM. The
      # FAST path COMPILES the real vendored C (a broken patch fails the build), but had NO
      # source-text token gate for #960 — a `git subtree pull` (#44) could hot-swap an obs.dll
      # where the guard silently reverted. Mirrors the canonical Linux-CI guard
      # tests/genlock_preload.rs::vendored_source::asrc_starvation_guard_present_in_vendored_source
      # (probe-gated, can't compile on this runner). Keep both in lock-step.
      - name: Assert ASRC starvation guard present (#960)
        shell: pwsh
        run: |
          $h = (Get-Content "vendor/obs-studio/libobs/media-io/asrc-compensator.h" -Raw) -replace '\s+', ' '
          if ($h -notmatch [regex]::Escape('#define ASRC_MAX_SANE_INSTANTANEOUS_PPM 100000.0')) {
            Write-Error "asrc-compensator.h: #960 starvation-guard sanity ceiling (ASRC_MAX_SANE_INSTANTANEOUS_PPM) missing or changed"; exit 1
          }
          if ($h -notmatch [regex]::Escape('uint32_t starved_block_count;')) {
            Write-Error "asrc-compensator.h: #960 starved_block_count telemetry field missing from struct asrc_compensator"; exit 1
          }
          $src = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($src -notmatch [regex]::Escape('starved_blocks=%u')) {
            Write-Error "obs-source.c: #960 asrc: telemetry log line no longer reports starved_blocks=N"; exit 1
          }
          Write-Output "ASRC starvation guard present (#960 sanity ceiling + rejection branch + telemetry) — OK"

      # #962: the #960 starvation ceiling must gate the WINDOWED (duration-weighted-summed) ppm
      # value, not a single block's own instantaneous ratio — per-block instantaneous ppm is
      # unmeasurable noise for small, bursty-delivery blocks (the live mbc incident: 128-sample
      # Dante VSC blocks, 100% starved-rejected under the pre-#962 per-block guard). Mirrors the
      # canonical Linux-CI guard
      # tests/genlock_preload.rs::vendored_source::asrc_starvation_guard_gates_the_windowed_ppm_962
      # (probe-gated, can't compile on this runner). Keep both in lock-step.
      - name: Assert ASRC estimator windows its measurement before gating (#962)
        shell: pwsh
        run: |
          $h = (Get-Content "vendor/obs-studio/libobs/media-io/asrc-compensator.h" -Raw) -replace '\s+', ' '
          if ($h -notmatch [regex]::Escape('#define ASRC_WINDOW_S 1.0')) {
            Write-Error "asrc-compensator.h: #962 measurement-window duration constant (ASRC_WINDOW_S) missing or changed"; exit 1
          }
          if ($h -notmatch [regex]::Escape('double window_raw_s;') -or $h -notmatch [regex]::Escape('double window_master_s;') -or $h -notmatch [regex]::Escape('uint32_t window_block_count;')) {
            Write-Error "asrc-compensator.h: #962 window-accumulator fields missing from struct asrc_compensator"; exit 1
          }
          $c = (Get-Content "vendor/obs-studio/libobs/media-io/asrc-compensator.c" -Raw) -replace '\s+', ' '
          if ($c -notmatch [regex]::Escape('if (fabs(window_ppm) > ASRC_MAX_SANE_INSTANTANEOUS_PPM) {') -or $c -notmatch [regex]::Escape('c->starved_block_count += window_block_count;')) {
            Write-Error "asrc-compensator.c: #962 starvation ceiling no longer gates the WINDOWED ppm value"; exit 1
          }
          Write-Output "ASRC windowed measurement present (#962 window constant + accumulator fields + windowed gate) — OK"

      # #942: the A/V-sync dock's in-process lock corrector must be MONITOR-ONLY by build
      # default — the E2E gate (scripts/av_sync_calibrate.py --apply) is the only CONTINUOUS/
      # closed-loop writer of genlock_latency_ms_src (scripts/obs_phase2.py's own bounded
      # snapshot-and-restore around a single delivery-verify test run, #358/#691, is a separate,
      # non-closed-loop exception — it is not a second actuator). This FAST path's OWN job (the
      # one running this step) does NOT itself build obs-audio-video-sync-dock.dll — the
      # separate distroav-compile-check job in this same workflow does compile it ("Compile-check
      # av-sync-dock"), but neither job STAGES/deploys it (staging here covers only obs.dll +
      # distroav.dll). Either way the vendored source is present in this checkout, so a
      # `git subtree pull` (#44) style revert on THIS branch would otherwise be
      # invisible until the next full build, hours later. Static source-text check only (mirrors
      # the #912 ASRC gate above and the canonical Linux-CI guard tests/genlock_preload.rs::
      # vendored_source::dock_lock_corrector_is_monitor_only_by_build_default_942, probe-gated,
      # can't compile on this runner). Keep all three in lock-step.
      - name: Assert dock lock corrector is monitor-only by default (#942)
        shell: pwsh
        run: |
          $audio = (Get-Content "vendor/av-sync-dock/src/camera-box-audio.hpp" -Raw) -replace '\s+', ' '
          if ($audio -notmatch [regex]::Escape('bool CB_DOCK_LOCK_ACTUATION_ENABLED = false;')) {
            Write-Error "camera-box-audio.hpp: CB_DOCK_LOCK_ACTUATION_ENABLED missing or not hard-locked false — #942 monitor-only default reverted (dock corrector would write genlock_latency_ms_src again)"; exit 1
          }
          if ($audio -notmatch [regex]::Escape('bool cb_dock_lock_may_actuate()')) {
            Write-Error "camera-box-audio.hpp: cb_dock_lock_may_actuate() missing — the #942 pure decision seam is gone, the caller has nothing to gate its actuator write on"; exit 1
          }
          # #942 hardening: the check above only proves the FUNCTION exists, not that its BODY
          # still reads the hard-locked constant — a body rewritten to `return true;` or an
          # env-driven escape hatch keeps CB_DOCK_LOCK_ACTUATION_ENABLED const-false and passes
          # every check above while shipping a WRITING corrector on this exact build.
          if ($audio -notmatch [regex]::Escape('return CB_DOCK_LOCK_ACTUATION_ENABLED;')) {
            Write-Error "camera-box-audio.hpp: cb_dock_lock_may_actuate() no longer returns CB_DOCK_LOCK_ACTUATION_ENABLED directly — #942 seam body may have been rewritten to bypass the hard lock"; exit 1
          }
          $output = (Get-Content "vendor/av-sync-dock/src/sync-test-output.cpp" -Raw) -replace '\s+', ' '
          if ($output -notmatch [regex]::Escape('if (act.apply && camerabox::cb_dock_lock_may_actuate())')) {
            Write-Error "sync-test-output.cpp: the LOCK-CORRECT apply call site is no longer gated on cb_dock_lock_may_actuate() — #942 monitor-only default reverted"; exit 1
          }
          if ($output -match [regex]::Escape('audio_ts); if (act.apply) {')) {
            Write-Error "sync-test-output.cpp: an UNGATED if (act.apply) actuator-write branch is back right after decide() — #942 gate bypassed"; exit 1
          }
          Write-Output "dock lock corrector monitor-only by default (#942 hard-locked seam + gated call site) — OK"

      # #278/#275 (the #269 YAML lock-step): the FAST path COMPILES libobs (obs.dll) + the
      # DistroAV burn, so a `git subtree pull` reverting either to inert-but-still-compiling
      # would hot-swap a regressed obs.dll/distroav un-gated. Re-assert the tokens in pwsh
      # (mirrors tests/genlock_preload.rs::{vendored_source,distroav_source} — probe-gated,
      # can't compile on this runner). OBSProjector.cpp is frontend-only (the fast path does
      # NOT build it) but the source-text check still catches a revert.
      - name: Assert #278 multiview adaptive budget-skip + #275 bulk-fill burn present
        shell: pwsh
        run: |
          $disp = (Get-Content "vendor/obs-studio/libobs/obs-display.c" -Raw) -replace '\s+', ' '
          if ($disp -notmatch [regex]::Escape('if (obs_display_should_skip(effective_divisor, display->render_frame_counter, ewma, elapsed, budget,')) { Write-Error "obs-display.c: #278/#293 adaptive budget-skip gate gone — the multiview would steal the 60fps program budget"; exit 1 }
          if ($disp -notmatch [regex]::Escape('uint32_t effective_divisor = display->render_divisor;')) { Write-Error "obs-display.c: #776 canvas-rate effective-divisor derivation gone — a 30fps canvas multiview would be stuck at 15fps"; exit 1 }
          if ($disp -notmatch [regex]::Escape('display->render_frame_counter++;')) { Write-Error "obs-display.c: #756 hard cadence-floor counter not bumped — a cheap multiview would never actually throttle"; exit 1 }
          if ($disp -notmatch [regex]::Escape('display->render_consecutive_skips++;')) { Write-Error "obs-display.c: #293 anti-starvation skip counter not bumped — the multiview could freeze again"; exit 1 }
          if ($disp -notmatch [regex]::Escape('const uint64_t budget = interval - interval / 10;')) { Write-Error "obs-display.c: #278 90% frame-budget gone"; exit 1 }
          if ($disp -notmatch [regex]::Escape('display->render_ewma_ns = prev ? (prev * 3 + dur) / 4 : dur;')) { Write-Error "obs-display.c: #278 render-cost EWMA update gone — the budget gate cannot learn a display is heavy"; exit 1 }
          if ($disp -notmatch [regex]::Escape('void obs_display_set_render_divisor(obs_display_t *display, uint32_t divisor)')) { Write-Error "obs-display.c: #278 obs_display_set_render_divisor impl gone"; exit 1 }
          $bud = (Get-Content "vendor/obs-studio/libobs/obs-display-budget.h" -Raw) -replace '\s+', ' '
          if ($bud -notmatch [regex]::Escape('return consecutive_skips < OBS_DISPLAY_MAX_CONSECUTIVE_SKIPS;')) { Write-Error "obs-display-budget.h: #293 anti-starvation floor gone — an over-budget multiview would freeze forever"; exit 1 }
          if ($bud -notmatch [regex]::Escape('if (render_divisor > 1 && (frame_counter % render_divisor) != 0)')) { Write-Error "obs-display-budget.h: #756 hard cadence-floor term gone — a cheap multiview would never actually throttle to 1/divisor"; exit 1 }
          $vid = (Get-Content "vendor/obs-studio/libobs/obs-video.c" -Raw) -replace '\s+', ' '
          if ($vid -notmatch [regex]::Escape('obs->video.graphics_frame_start_ns = frame_start;')) { Write-Error "obs-video.c: #278 per-tick start no longer published — the adaptive skip loses its elapsed reference"; exit 1 }
          $hdr = (Get-Content "vendor/obs-studio/libobs/obs-internal.h" -Raw) -replace '\s+', ' '
          if ($hdr -notmatch [regex]::Escape('uint64_t render_ewma_ns;')) { Write-Error "obs-internal.h: #278 obs_display.render_ewma_ns field gone"; exit 1 }
          if ($hdr -notmatch [regex]::Escape('uint64_t graphics_frame_start_ns;')) { Write-Error "obs-internal.h: #278 obs_core_video.graphics_frame_start_ns field gone"; exit 1 }
          if ($hdr -notmatch [regex]::Escape('uint32_t render_frame_counter;')) { Write-Error "obs-internal.h: #756 obs_display.render_frame_counter field gone — the hard cadence floor has nowhere to count ticks"; exit 1 }
          $api = (Get-Content "vendor/obs-studio/libobs/obs.h" -Raw) -replace '\s+', ' '
          if ($api -notmatch [regex]::Escape('EXPORT void obs_display_set_render_divisor(obs_display_t *display, uint32_t divisor)')) { Write-Error "obs.h: #278 obs_display_set_render_divisor not EXPORTed — frontend cannot link it"; exit 1 }
          $proj = (Get-Content "vendor/obs-studio/frontend/widgets/OBSProjector.cpp" -Raw) -replace '\s+', ' '
          if ($proj -notmatch [regex]::Escape('if (isMultiview) obs_display_set_render_divisor(GetDisplay(), 2)')) { Write-Error "OBSProjector.cpp: #278 multiview no longer marks render_divisor=2 — it would not be throttled"; exit 1 }
          $bqr = (Get-Content "vendor/distroav/src/burn-qr.hpp" -Raw) -replace '\s+', ' '
          if ($bqr -notmatch [regex]::Escape('std::memset(row, 0xFF,')) { Write-Error "burn-qr.hpp: #275 bulk-fill (per-row white memset) gone — burn render reverted to the slow per-pixel path that overran the 60fps budget"; exit 1 }
          Write-Output "#278 multiview adaptive budget-skip decouple + #756 cadence floor + #275 bulk-fill burn render present — OK"

      # #152 (the #269 YAML lock-step): OBSBasic.cpp (UpdateTitleBar) is frontend-only — the
      # FAST path does NOT build the frontend — but the source-text check still catches a
      # `git subtree pull` (#44) that restores the stock OBS title and drops the
      # newlevel.media build identity. Mirrors tests/obs_titlebar_newlevel.rs (Linux-only,
      # can't compile on this runner) AND the full windows-genlock.yml #152 gate; keep all
      # three in lock-step.
      - name: Assert newlevel.media build identity + date in OBS title (#152)
        shell: pwsh
        run: |
          $b = (Get-Content "vendor/obs-studio/frontend/widgets/OBSBasic.cpp" -Raw) -replace '\s+', ' '
          if ($b -notmatch [regex]::Escape('name << " - newlevel.media build " << NewlevelBuildDate();')) {
            Write-Error "OBSBasic.cpp: the #152 newlevel.media build marker is missing from the OBS window title — upstream merge likely restored the stock title; re-apply the genlock #152 patch"; exit 1
          }
          if ($b -notmatch [regex]::Escape('static std::string NewlevelBuildDate()')) {
            Write-Error "OBSBasic.cpp: the #152 NewlevelBuildDate() helper is gone — the title would lose its build date; re-apply"; exit 1
          }
          if ($b -notmatch [regex]::Escape('const std::string d = __DATE__;')) {
            Write-Error "OBSBasic.cpp: the #152 build-date no longer reads the compiler __DATE__ — must be injected at build time, never hardcoded; re-apply"; exit 1
          }
          Write-Output "#152 newlevel.media build identity + date in OBS title — OK"

      # Same configure as the full build (downloads the obs-deps bundle the preset
      # pins); we just build a single target afterwards.
      - name: Configure OBS (windows-x64 preset)
        working-directory: vendor/obs-studio
        shell: bash
        run: >
          cmake --preset windows-x64
          '-DOBS_VERSION_OVERRIDE=32.1.2'
          -DENABLE_WHATSNEW=OFF
          -DENABLE_AJA=OFF
          -DENABLE_VLC=OFF
          -DENABLE_TEST_INPUT=OFF

      # Build ONLY libobs (the core lib = obs.dll). Skips CEF/browser, the Qt
      # frontend, and all plugins — the bulk of the full build — so this finishes in
      # minutes. libobs is self-contained (it is the base every other target links),
      # so its obs.dll is complete and swap-valid on its own.
      - name: Build ONLY libobs (obs.dll)
        working-directory: vendor/obs-studio
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --target libobs --parallel

      - name: Stage obs.dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse vendor/obs-studio/build_x64 -Filter obs.dll |
                 Where-Object { $_.FullName -notmatch 'CMakeFiles' } | Select-Object -First 1
          if (!$dll) { Write-Error "obs.dll not found after the libobs build"; exit 1 }
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item $dll.FullName stage/
          git rev-parse HEAD | Out-File stage/GENLOCK_BUILD_SHA.txt -Encoding ascii
          Write-Output "staged obs.dll from: $($dll.FullName)"

      # #120: the hot-swap obs.dll also ships with a per-component SHA manifest, so even an
      # event-time DLL swap is auditable against #121's post-deploy verify (the same generator the
      # full windows-genlock.yml bundle uses — logic unit-proven on the Linux `test` job).
      - name: Generate per-component SHA manifest (#120)
        shell: bash
        run: scripts/genlock-manifest.sh --stage stage --out stage/BUNDLE_MANIFEST.json

      - name: Assert bundle manifest self-consistent (#120)
        shell: bash
        run: scripts/genlock-manifest.sh --check stage/BUNDLE_MANIFEST.json --stage stage

      - name: Upload obs.dll
        uses: actions/upload-artifact@v4
        with:
          name: obs-genlock-fast-dll
          path: stage/
          if-no-files-found: error

  # camera-box #101: the PRE-MERGE compile gate for the vendored DistroAV C++.
  #
  # ci.yml is Rust-only and the libobs `build` job above compiles only libobs, so a C++
  # compile error in the vendored DistroAV plugin slipped through every push-to-dev gate
  # to main and was caught only by the manual 150-min windows-genlock.yml. This job
  # configures + builds the DistroAV plugin against an installed libobs/obs-frontend-api
  # SDK prefix (exactly as the production build does, vendor/distroav links
  # OBS::libobs + OBS::obs-frontend-api) — but with the CEF/browser dependency OFF, the
  # bulk of the full build, so it stays minutes-not-hours. It is a COMPILE check, not the
  # production bundle: it builds no installer and uploads no artifact. It fails the
  # push-to-dev run (the pre-merge gate) on any C++ error in the vendored OBS/DistroAV
  # tree, so #97's forward-ref class can never again reach main.
  distroav-compile-check:
    name: Vendored OBS/DistroAV C++ compile gate (#101)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Fail fast, before the configure/build, if the newest vendored DistroAV C++
      # surfaces are missing — so a dropped patch fails here cheaply rather than after a
      # long configure. Mirrors the source guards in windows-genlock.yml.
      - name: Assert vendored DistroAV C++ sources present
        shell: pwsh
        run: |
          foreach ($f in @(
            "vendor/distroav/src/ndi-source.cpp",
            "vendor/distroav/src/ndi-output.cpp",
            "vendor/distroav/src/ndi-burn-filter.cpp",
            "vendor/distroav/src/plugin-main.cpp",
            "vendor/distroav/CMakeLists.txt"
          )) {
            if (!(Test-Path $f)) { Write-Error "vendored DistroAV source missing: $f (#101)"; exit 1 }
          }
          $cm = (Get-Content "vendor/distroav/CMakeLists.txt" -Raw) -replace '\s+', ' '
          if ($cm -notmatch [regex]::Escape('ndi-burn-filter.cpp')) {
            Write-Error "CMakeLists.txt: ndi-burn-filter.cpp not in target_sources — it would not compile into the gate (#101)"; exit 1
          }
          Write-Output "vendored DistroAV C++ sources present — OK"

      # Configure the vendored OBS exactly like the production build (same preset, same
      # disable flags), but with ENABLE_BROWSER=OFF: the CEF/browser download + build is
      # the bulk of the 150-min full build and is not needed to compile-check the
      # vendored C++. bash quoting is exact — pwsh would split -DNAME=32.1.2 at the dots.
      - name: Configure OBS (windows-x64 preset, browser OFF for the compile gate)
        working-directory: vendor/obs-studio
        shell: bash
        run: >
          cmake --preset windows-x64
          '-DOBS_VERSION_OVERRIDE=32.1.2'
          -DENABLE_BROWSER=OFF
          -DENABLE_WHATSNEW=OFF
          -DENABLE_AJA=OFF
          -DENABLE_VLC=OFF
          -DENABLE_TEST_INPUT=OFF

      # Build OBS (all default targets) so `cmake --install` finds every artifact its
      # global install rules reference (libobs, the d3d11/opengl graphics backends, the
      # frontend, obs-frontend-api). A target-narrowed build (libobs + obs-frontend-api
      # only) makes the install step fail looking for libobs-d3d11.dll etc. — the bulk
      # cost we cut is CEF/browser (ENABLE_BROWSER=OFF in the configure above), NOT the
      # graphics backends, which are small and required for the SDK install DistroAV
      # links against. This mirrors windows-genlock.yml's `cmake --build build_x64`
      # minus CEF, so it stays minutes-not-hours yet produces a complete, installable SDK.
      - name: Build OBS (browser OFF — graphics backends + libobs + frontend-api)
        working-directory: vendor/obs-studio
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      - name: Install OBS SDK prefix
        working-directory: vendor/obs-studio
        shell: bash
        run: |
          cmake --install build_x64 --config RelWithDebInfo --prefix "$GITHUB_WORKSPACE/obs-sdk"
          # #188: the default install omits the EXCLUDE_FROM_ALL "Development" component (the cmake
          # package configs libobsConfig.cmake / obs-frontend-apiConfig.cmake + headers + import
          # libs). The standalone av-sync-dock build needs them, so install it explicitly.
          cmake --install build_x64 --config RelWithDebInfo --prefix "$GITHUB_WORKSPACE/obs-sdk" --component Development

      # Configure DistroAV against the genlock-patched OBS SDK — identical to the
      # production windows-genlock.yml configure step.
      - name: Configure DistroAV against the genlocked OBS
        working-directory: vendor/distroav
        shell: bash
        run: >
          cmake -B build_x64 -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/obs-sdk"
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      # THE compile check: build the DistroAV plugin. This compiles the vendored
      # ndi-source.cpp / ndi-output.cpp / ndi-burn-filter.cpp / plugin-main.cpp etc. —
      # the C++ a forward-ref / missing-include / signature error lives in. A compile
      # error fails this push-to-dev run (the pre-merge gate) instead of reaching main.
      - name: Compile-check DistroAV (build the plugin)
        working-directory: vendor/distroav
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      # camera-box #404/#406: the compile-check above already LINKS a real distroav.dll against the
      # genlock-patched OBS SDK (same as the full windows-genlock.yml — ENABLE_BROWSER=OFF only
      # affects OBS core, not the plugin), so STAGE + UPLOAD it. This gives a minutes-fast
      # deployable distroav.dll for a hot-swap — no 1-2.5h full build — mirroring the obs.dll fast
      # path above, so a DistroAV change (e.g. the #404 burn overlay) can be verified on the rig
      # quickly instead of blocking on the full bundle.
      - name: Stage the compiled distroav.dll (#404)
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse vendor/distroav/build_x64 -Filter distroav.dll |
                 Where-Object { $_.FullName -notmatch 'CMakeFiles' } | Select-Object -First 1
          if (!$dll) { Write-Error "distroav.dll not found after the plugin build (#404)"; exit 1 }
          New-Item -ItemType Directory -Force -Path distroav-stage | Out-Null
          Copy-Item $dll.FullName distroav-stage/
          git rev-parse HEAD | Out-File distroav-stage/DISTROAV_BUILD_SHA.txt -Encoding ascii
          Write-Output "staged distroav.dll from: $($dll.FullName)  size=$($dll.Length)"

      - name: Upload distroav.dll (fast hot-swap, #404)
        uses: actions/upload-artifact@v4
        with:
          name: distroav-fast-dll
          path: distroav-stage/
          if-no-files-found: error

      # #398 (Option A, the #269 lock-step): the ONLY intentional camera-box patch on the
      # vendored av-sync-dock — the dock decodes OUR dual-QR (frame_id, not norihiro's q=,i=,f=,c=)
      # so the guarded zero-loss gate stays untouched. A future `git subtree pull` of av-sync-dock
      # would still COMPILE fine if it silently reverted this (stock norihiro compiles too) — only
      # this text guard catches the behavior regression. Mirrors the Linux-CI guard
      # tests/av_sync_dock_qr_patch_guard.rs.
      - name: Assert camera-box dual-QR dock patch present (#398)
        shell: pwsh
        run: |
          if (-not (Test-Path "vendor/av-sync-dock/src/camera-box-qr.hpp")) { Write-Error "camera-box-qr.hpp is gone (#398) — the dock no longer knows our dual-QR wire format"; exit 1 }
          $hdr = (Get-Content "vendor/av-sync-dock/src/camera-box-qr.hpp" -Raw)
          if ($hdr -notmatch [regex]::Escape('decode_camera_box_qr')) { Write-Error "decode_camera_box_qr gone (#398)"; exit 1 }
          if ($hdr -notmatch [regex]::Escape('0xEDB88320')) { Write-Error "camera-box-qr.hpp CRC-32/ISO-HDLC polynomial gone (#398) — no longer matches src/payload.rs"; exit 1 }
          $src = (Get-Content "vendor/av-sync-dock/src/sync-test-output.cpp" -Raw) -replace '\s+', ' '
          if ($src -notmatch [regex]::Escape('#include "camera-box-qr.hpp"')) { Write-Error "camera-box-qr.hpp include gone from sync-test-output.cpp (#398)"; exit 1 }
          if ($src -notmatch [regex]::Escape('decode_camera_box_qr((char *)data.payload, &cb)')) { Write-Error "camera-box dual-QR try-first decode gone (#398) — dock reverted to norihiro-only"; exit 1 }
          if ($src -notmatch [regex]::Escape('cb_video_ts_ns[256]')) { Write-Error "camera-box video-ring (live pairing) gone (#398)"; exit 1 }
          if ($src -notmatch [regex]::Escape('signal_sync_found(st->context, &si)')) { Write-Error "camera-box live sync_found emit gone (#398) — dock would stop showing our live offset"; exit 1 }
          Write-Output "#398 camera-box dual-QR dock patch present - OK"

      # #188: compile-check the A/V sync dock against the SAME installed OBS SDK (reuses the
      # OBS build above — no second full OBS build). Catches a dock C++/Qt/CMake error at the
      # pre-merge gate instead of after the 150-min full windows-genlock build.
      - name: Configure av-sync-dock against the genlocked OBS (#188)
        working-directory: vendor/av-sync-dock
        shell: bash
        run: |
          set -eu
          WS=$(cygpath "$GITHUB_WORKSPACE")
          # obs-sdk now carries the Development component (libobs / obs-frontend-api / w32-pthreads
          # cmake configs + the finders/ modules). libobsConfig also find_dependency(SIMDe, Threads)
          # and obs-frontend-api needs Qt6 — SIMDe + Qt6 live in the obs-deps the OBS/DistroAV build
          # downloaded, so add every .deps root to the prefix so all transitive deps resolve.
          PREFIX="$(cygpath -m "$WS/obs-sdk")"
          for d in "$WS"/vendor/obs-studio/.deps/*-x64 "$WS"/vendor/distroav/.deps/*-x64; do
            [ -d "$d" ] && PREFIX="$PREFIX;$(cygpath -m "$d")"
          done
          LIBOBS_CFG=$(find "$WS/obs-sdk" -maxdepth 6 -iname 'libobs*config.cmake' | head -1)
          FRONTEND_CFG=$(find "$WS/obs-sdk" -maxdepth 6 -iname 'obs-frontend-api*config.cmake' | head -1)
          echo "prefix=$PREFIX"; echo "libobs cfg=$LIBOBS_CFG"; echo "frontend cfg=$FRONTEND_CFG"
          test -n "$LIBOBS_CFG"   || { echo "ERROR: libobsConfig.cmake not in obs-sdk (Development install failed?)"; find "$WS/obs-sdk" -iname '*.cmake' | head -60; exit 1; }
          test -n "$FRONTEND_CFG" || { echo "ERROR: obs-frontend-apiConfig.cmake not in obs-sdk"; exit 1; }
          cmake -B build_x64 -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -Dlibobs_DIR="$(cygpath -m "$(dirname "$LIBOBS_CFG")")" \
            -Dobs-frontend-api_DIR="$(cygpath -m "$(dirname "$FRONTEND_CFG")")" \
            -DQT_VERSION=6 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compile-check av-sync-dock (build the plugin, #188)
        working-directory: vendor/av-sync-dock
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      - name: Compile gate passed
        shell: bash
        run: |
          echo "#101 vendored OBS/DistroAV + #188 av-sync-dock C++ compiled clean - pre-merge gate green."
