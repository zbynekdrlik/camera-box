          # this only needs to prove the CALLER wires the real cb_dock_lock_may_actuate() seam
          # into it (not a hardcoded true/false) and that the write is the first statement inside
          # the resulting `case ...::Write:` arm.
          if ($output -notmatch [regex]::Escape('camerabox::CbDockLockOutcome outcome = camerabox::cb_dock_lock_outcome( act, camerabox::cb_dock_lock_may_actuate(), est.offset_ms, current_ms); switch (outcome) { case camerabox::CbDockLockOutcome::Write: { const double delta_ms = (double)(act.new_delay_ms - current_ms); cb_apply_lock_latency_ms(act.new_delay_ms);')) {
            Write-Error "sync-test-output.cpp: either cb_dock_lock_outcome() is no longer called with cb_dock_lock_may_actuate(), or cb_apply_lock_latency_ms() is no longer the first statement inside case CbDockLockOutcome::Write — #942 monitor-only default reverted"; exit 1
          }
          # #942 hardening (#955 update): cb_apply_lock_latency_ms() must be called with its
          # real argument in EXACTLY one place in the whole file (the gated Write case above) — a
          # second call site would silently reintroduce the #942 dual-actuator write.
          $applyCount = ([regex]::Matches($output, [regex]::Escape('cb_apply_lock_latency_ms(act.new_delay_ms)'))).Count
          if ($applyCount -ne 1) {
            Write-Error "sync-test-output.cpp: cb_apply_lock_latency_ms(act.new_delay_ms) appears $applyCount times (expected exactly 1) — #942 gate may be bypassed"; exit 1
          }
          Write-Output "dock lock corrector monitor-only by default (#942 hard-locked seam + gated call site) — OK"

      # #278/#275 (the #269 YAML lock-step): the FAST path COMPILES libobs (obs.dll) + the
      # DistroAV burn, so a `git subtree pull` reverting either to inert-but-still-compiling
      # would hot-swap a regressed obs.dll/distroav un-gated. Re-assert the tokens in pwsh
      # (mirrors tests/genlock_preload.rs::{vendored_source,distroav_source} — probe-gated,
      # can't compile on this runner). OBSProjector.cpp is frontend-only (the fast path does
      # NOT build it) but the source-text check still catches a revert.
      - name: Assert #278 multiview adaptive budget-skip + #275 bulk-fill burn present
        shell: pwsh
        run: |
          $disp = (Get-Content "vendor/obs-studio/libobs/obs-display.c" -Raw) -replace '\s+', ' '
          if ($disp -notmatch [regex]::Escape('if (obs_display_should_skip(effective_divisor, display->render_frame_counter, ewma, elapsed, budget,')) { Write-Error "obs-display.c: #278/#293 adaptive budget-skip gate gone — the multiview would steal the 60fps program budget"; exit 1 }
          if ($disp -notmatch [regex]::Escape('uint32_t effective_divisor = display->render_divisor;')) { Write-Error "obs-display.c: #776 canvas-rate effective-divisor derivation gone — a 30fps canvas multiview would be stuck at 15fps"; exit 1 }
          if ($disp -notmatch [regex]::Escape('display->render_frame_counter++;')) { Write-Error "obs-display.c: #756 hard cadence-floor counter not bumped — a cheap multiview would never actually throttle"; exit 1 }
          if ($disp -notmatch [regex]::Escape('display->render_consecutive_skips++;')) { Write-Error "obs-display.c: #293 anti-starvation skip counter not bumped — the multiview could freeze again"; exit 1 }
          if ($disp -notmatch [regex]::Escape('const uint64_t budget = interval - interval / 10;')) { Write-Error "obs-display.c: #278 90% frame-budget gone"; exit 1 }
          if ($disp -notmatch [regex]::Escape('display->render_ewma_ns = prev ? (prev * 3 + dur) / 4 : dur;')) { Write-Error "obs-display.c: #278 render-cost EWMA update gone — the budget gate cannot learn a display is heavy"; exit 1 }
          if ($disp -notmatch [regex]::Escape('void obs_display_set_render_divisor(obs_display_t *display, uint32_t divisor)')) { Write-Error "obs-display.c: #278 obs_display_set_render_divisor impl gone"; exit 1 }
          $bud = (Get-Content "vendor/obs-studio/libobs/obs-display-budget.h" -Raw) -replace '\s+', ' '
          if ($bud -notmatch [regex]::Escape('return consecutive_skips < OBS_DISPLAY_MAX_CONSECUTIVE_SKIPS;')) { Write-Error "obs-display-budget.h: #293 anti-starvation floor gone — an over-budget multiview would freeze forever"; exit 1 }
          if ($bud -notmatch [regex]::Escape('if (render_divisor > 1 && (frame_counter % render_divisor) != 0)')) { Write-Error "obs-display-budget.h: #756 hard cadence-floor term gone — a cheap multiview would never actually throttle to 1/divisor"; exit 1 }
          $vid = (Get-Content "vendor/obs-studio/libobs/obs-video.c" -Raw) -replace '\s+', ' '
          if ($vid -notmatch [regex]::Escape('obs->video.graphics_frame_start_ns = frame_start;')) { Write-Error "obs-video.c: #278 per-tick start no longer published — the adaptive skip loses its elapsed reference"; exit 1 }
          if ($vid -notmatch [regex]::Escape('obs->video.last_tick_total_ns = frame_time_ns;')) { Write-Error "obs-video.c: #1063 completed tick total no longer published — the aux budget gate's order-independent term goes stale and it under-throttles"; exit 1 }
          $hdr = (Get-Content "vendor/obs-studio/libobs/obs-internal.h" -Raw) -replace '\s+', ' '
          if ($hdr -notmatch [regex]::Escape('uint64_t render_ewma_ns;')) { Write-Error "obs-internal.h: #278 obs_display.render_ewma_ns field gone"; exit 1 }
          if ($hdr -notmatch [regex]::Escape('uint64_t graphics_frame_start_ns;')) { Write-Error "obs-internal.h: #278 obs_core_video.graphics_frame_start_ns field gone"; exit 1 }
          if ($hdr -notmatch [regex]::Escape('uint64_t last_tick_total_ns;')) { Write-Error "obs-internal.h: #1063 obs_core_video.last_tick_total_ns field gone — the aux budget gate loses its order-independent previous-tick term"; exit 1 }
          if ($hdr -notmatch [regex]::Escape('uint32_t render_frame_counter;')) { Write-Error "obs-internal.h: #756 obs_display.render_frame_counter field gone — the hard cadence floor has nowhere to count ticks"; exit 1 }
          $api = (Get-Content "vendor/obs-studio/libobs/obs.h" -Raw) -replace '\s+', ' '
          if ($api -notmatch [regex]::Escape('EXPORT void obs_display_set_render_divisor(obs_display_t *display, uint32_t divisor)')) { Write-Error "obs.h: #278 obs_display_set_render_divisor not EXPORTed — frontend cannot link it"; exit 1 }
          $proj = (Get-Content "vendor/obs-studio/frontend/widgets/OBSProjector.cpp" -Raw) -replace '\s+', ' '
          if ($proj -notmatch [regex]::Escape('if (isMultiview) obs_display_set_render_divisor(GetDisplay(), 2)')) { Write-Error "OBSProjector.cpp: #278 multiview no longer marks render_divisor=2 — it would not be throttled"; exit 1 }
          $bqr = (Get-Content "vendor/distroav/src/burn-qr.hpp" -Raw) -replace '\s+', ' '
          if ($bqr -notmatch [regex]::Escape('std::memset(row, 0xFF,')) { Write-Error "burn-qr.hpp: #275 bulk-fill (per-row white memset) gone — burn render reverted to the slow per-pixel path that overran the 60fps budget"; exit 1 }
          Write-Output "#278 multiview adaptive budget-skip decouple + #756 cadence floor + #275 bulk-fill burn render present — OK"

      - name: Assert #879 aux NDI sender render-budget gate present
        shell: pwsh
        run: |
          $bud = (Get-Content "vendor/obs-studio/libobs/obs-display-budget.h" -Raw) -replace '\s+', ' '
          if ($bud -notmatch [regex]::Escape('static inline uint32_t obs_effective_render_divisor(uint32_t configured_divisor, uint64_t frame_interval_ns)')) { Write-Error "obs-display-budget.h: #879 pure effective-divisor helper gone -- the aux senders lose their budget derivation"; exit 1 }
          if ($bud -notmatch [regex]::Escape('return derived < configured_divisor ? derived : configured_divisor;')) { Write-Error "obs-display-budget.h: #879 effective-divisor clamp to the configured upper bound gone"; exit 1 }
          $api = (Get-Content "vendor/obs-studio/libobs/obs.h" -Raw) -replace '\s+', ' '
          if ($api -notmatch [regex]::Escape('EXPORT bool obs_aux_sender_should_skip(uint32_t render_divisor, uint32_t frame_counter,')) { Write-Error "obs.h: #879 obs_aux_sender_should_skip not EXPORTed -- the DistroAV filter cannot link the aux budget gate"; exit 1 }
          $core = (Get-Content "vendor/obs-studio/libobs/obs.c" -Raw) -replace '\s+', ' '
          if ($core -notmatch [regex]::Escape('const uint32_t effective_divisor = obs_effective_render_divisor(render_divisor, interval);')) { Write-Error "obs.c: #879 aux seam no longer derives the canvas-rate effective divisor before obs_display_should_skip"; exit 1 }
          if ($core -notmatch [regex]::Escape('const uint64_t consumed = (elapsed > last_tick_total) ? elapsed : last_tick_total;')) { Write-Error "obs.c: #1063 aux seam no longer gates on max(elapsed, last_tick_total_ns) -- the budget term is render-order-dependent again and an early-deciding aux filter under-throttles"; exit 1 }
          $flt = (Get-Content "vendor/distroav/src/ndi-filter.cpp" -Raw) -replace '\s+', ' '
          if ($flt -notmatch [regex]::Escape('if (obs_aux_sender_should_skip(f->render_divisor, f->render_frame_counter, f->render_ewma_ns,')) { Write-Error "ndi-filter.cpp: #879 aux render+send no longer gated on the budget -- the aux senders bypass the render budget again and can steal the program 30fps budget"; exit 1 }
          if ($flt -notmatch [regex]::Escape('f->render_ewma_ns = f->render_ewma_ns ? (f->render_ewma_ns * 3 + render_dur_879) / 4 : render_dur_879;')) { Write-Error "ndi-filter.cpp: #879 per-filter render-cost EWMA update gone -- the budget gate cannot learn an aux sender is heavy"; exit 1 }
          Write-Output "#879 aux NDI sender render-budget gate (program absolute) present -- OK"

      - name: Assert #771 multiview-audit fps observability line present
        shell: pwsh
        run: |
          $disp = (Get-Content "vendor/obs-studio/libobs/obs-display.c" -Raw) -replace '\s+', ' '
          if ($disp -notmatch [regex]::Escape('"multiview-audit: monitor=%u divisor=%u rendered_fps=%.1f target=%.0f floor=%.1f cx=%u cy=%u"')) { Write-Error "obs-display.c: #771 multiview-audit blog line gone -- the multiview render fps is no longer visible in the OBS log"; exit 1 }
          if ($disp -notmatch [regex]::Escape('if (audit_elapsed >= MULTIVIEW_AUDIT_WINDOW_NS)')) { Write-Error "obs-display.c: #771 ~5s audit-window gate gone -- the multiview-audit line no longer emits periodically"; exit 1 }
          if ($disp -notmatch [regex]::Escape('display->render_audit_render_count++;')) { Write-Error "obs-display.c: #771 real-render counter not bumped -- rendered_fps would always read 0"; exit 1 }
          if ($disp -notmatch [regex]::Escape('display->render_audit_id = ++next_audit_id;')) { Write-Error "obs-display.c: #771 stable per-projector audit id assignment gone -- monitor=N would be unstable"; exit 1 }
          if ($disp -notmatch [regex]::Escape('obs_multiview_floor_fps(target_fps)')) { Write-Error "obs-display.c: #1212 emit site floor call must take only target_fps (the issue-1110 area sentinel is retired) -- else the C log line and the Rust gate would diverge"; exit 1 }
          $bud = (Get-Content "vendor/obs-studio/libobs/obs-display-budget.h" -Raw) -replace '\s+', ' '
          if ($bud -notmatch [regex]::Escape('static inline double obs_multiview_floor_fps(double target_fps)')) { Write-Error "obs-display-budget.h: #771/#776/#1212 pure target floor helper gone (or grew params back) -- the C log line and the Rust gate would diverge (#1212 retired the issue-1110 area sentinel)"; exit 1 }
          if ($bud -match [regex]::Escape('MULTIVIEW_FLOOR_MAX_CALIBRATED_AREA_PX')) { Write-Error "obs-display-budget.h: #1212 the issue-1110 area sentinel constant is back -- the floor must be area-independent (a 4K MV holds median 30fps, floor 28), so the constant and its report-only branch must be gone"; exit 1 }
          if ($bud -notmatch [regex]::Escape('#define MULTIVIEW_AUDIT_WINDOW_NS 5000000000ULL')) { Write-Error "obs-display-budget.h: #771 5s audit-window constant gone"; exit 1 }
          $hdr = (Get-Content "vendor/obs-studio/libobs/obs-internal.h" -Raw) -replace '\s+', ' '
          if ($hdr -notmatch [regex]::Escape('uint32_t render_audit_id;')) { Write-Error "obs-internal.h: #771 obs_display.render_audit_id missing"; exit 1 }
          if ($hdr -notmatch [regex]::Escape('uint64_t render_audit_window_start_ns;')) { Write-Error "obs-internal.h: #771 obs_display.render_audit_window_start_ns missing"; exit 1 }
          if ($hdr -notmatch [regex]::Escape('uint32_t render_audit_render_count;')) { Write-Error "obs-internal.h: #771 obs_display.render_audit_render_count missing"; exit 1 }
          Write-Output "#771 multiview-audit fps observability line + #776 target floor present -- OK"

      # #152 (the #269 YAML lock-step): OBSBasic.cpp (UpdateTitleBar) is frontend-only — the
      # FAST path does NOT build the frontend — but the source-text check still catches a
      # `git subtree pull` (#44) that restores the stock OBS title and drops the
      # newlevel.media build identity. Mirrors tests/obs_titlebar_newlevel.rs (Linux-only,
      # can't compile on this runner) AND the full windows-genlock.yml #152 gate; keep all
      # three in lock-step.
      - name: Assert newlevel.media build identity + deployed SHA in OBS title (#152/#1018)
        shell: pwsh
        run: |
          $b = (Get-Content "vendor/obs-studio/frontend/widgets/OBSBasic.cpp" -Raw) -replace '\s+', ' '
          if ($b -notmatch [regex]::Escape('name << " - newlevel.media build " << NewlevelBuildSha();')) {
            Write-Error "OBSBasic.cpp: the #152/#1018 newlevel.media build marker is missing from the OBS window title — upstream merge likely restored the stock title; re-apply the genlock title patch"; exit 1
          }
          if ($b -notmatch [regex]::Escape('static std::string NewlevelBuildSha()')) {
            Write-Error "OBSBasic.cpp: the #1018 NewlevelBuildSha() helper is gone — the title would lose its build identity; re-apply"; exit 1
          }
          if ($b -notmatch [regex]::Escape('GENLOCK_BUILD_SHA.txt')) {
            Write-Error "OBSBasic.cpp: the #1018 title no longer reads GENLOCK_BUILD_SHA.txt — the deployed build id would be lost; re-apply"; exit 1
          }
          if ($b -notmatch [regex]::Escape('os_get_executable_path_ptr(')) {
            Write-Error "OBSBasic.cpp: the #1018 title no longer resolves GENLOCK_BUILD_SHA.txt relative to the executable (os_get_executable_path_ptr) — a cwd-relative read regresses to the #1018 'unknown' bug; re-apply"; exit 1
          }
          Write-Output "#152/#1018 newlevel.media build identity + deployed SHA in OBS title — OK"

      # #1195 (the #269 YAML lock-step): checkForUncleanShutdown() is frontend-only -- the
      # FAST path does NOT build the frontend -- but the source-text check still catches a
      # `git subtree pull` (#44) that re-imports upstream's blocking "Run in Safe Mode?"
      # crash modal (which would hang an unattended broadcast box). Mirrors
      # tests/obs_unclean_shutdown_auto_normal_1195.rs (Linux-only, can't compile on this
      # runner) AND the full windows-genlock.yml #1195 gate; keep all three in lock-step.
      - name: Assert OBS auto-selects a NORMAL launch, never the crash modal (#1195)
        shell: pwsh
        run: |
          $app = (Get-Content "vendor/obs-studio/frontend/OBSApp.cpp" -Raw) -replace '\s+', ' '
          if ($app -notmatch [regex]::Escape('auto-selecting NORMAL launch (rig build: never block on a modal)')) {
            Write-Error "OBSApp.cpp: the #1195 auto-normal WARNING is missing -- checkForUncleanShutdown() must auto-select a NORMAL launch instead of the Safe-Mode modal. A subtree pull likely restored the upstream modal; re-apply the #1195 patch."; exit 1
          }
          if ($app -match [regex]::Escape('crashWarning.exec()')) {
            Write-Error "OBSApp.cpp: the upstream blocking Safe-Mode modal (crashWarning.exec()) is BACK -- re-apply the #1195 patch (remove the modal, auto-select NORMAL)."; exit 1
          }
          Write-Output "#1195 auto-normal unclean-shutdown launch (no blocking Safe-Mode modal) -- OK"

      # Same configure as the full build (downloads the obs-deps bundle the preset
      # pins); we just build a single target afterwards.
      - name: Configure OBS (windows-x64 preset)
        working-directory: vendor/obs-studio
        shell: bash
        run: >
          cmake --preset windows-x64
          '-DOBS_VERSION_OVERRIDE=32.2.0'
          -DENABLE_WHATSNEW=OFF
          -DENABLE_AJA=OFF
          -DENABLE_VLC=OFF
          -DENABLE_TEST_INPUT=OFF

      # Build ONLY libobs (the core lib = obs.dll). Skips CEF/browser, the Qt
      # frontend, and all plugins — the bulk of the full build — so this finishes in
      # minutes. libobs is self-contained (it is the base every other target links),
      # so its obs.dll is complete and swap-valid on its own.
      - name: Build ONLY libobs (obs.dll)
        working-directory: vendor/obs-studio
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --target libobs --parallel

      - name: Stage obs.dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse vendor/obs-studio/build_x64 -Filter obs.dll |
                 Where-Object { $_.FullName -notmatch 'CMakeFiles' } | Select-Object -First 1
          if (!$dll) { Write-Error "obs.dll not found after the libobs build"; exit 1 }
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item $dll.FullName stage/
          git rev-parse HEAD | Out-File stage/GENLOCK_BUILD_SHA.txt -Encoding ascii
          Write-Output "staged obs.dll from: $($dll.FullName)"

      # #120: the hot-swap obs.dll also ships with a per-component SHA manifest, so even an
      # event-time DLL swap is auditable against #121's post-deploy verify (the same generator the
      # full windows-genlock.yml bundle uses — logic unit-proven on the Linux `test` job).
      - name: Generate per-component SHA manifest (#120)
        shell: bash
        run: scripts/genlock-manifest.sh --stage stage --out stage/BUNDLE_MANIFEST.json

      - name: Assert bundle manifest self-consistent (#120)
        shell: bash
        run: scripts/genlock-manifest.sh --check stage/BUNDLE_MANIFEST.json --stage stage

      - name: Upload obs.dll
        uses: actions/upload-artifact@v4
        with:
          name: obs-genlock-fast-dll
          path: stage/
          if-no-files-found: error

  # camera-box #101: the PRE-MERGE compile gate for the vendored DistroAV C++.
  #
  # ci.yml is Rust-only and the libobs `build` job above compiles only libobs, so a C++
  # compile error in the vendored DistroAV plugin slipped through every push-to-dev gate
  # to main and was caught only by the manual 150-min windows-genlock.yml. This job
  # configures + builds the DistroAV plugin against an installed libobs/obs-frontend-api
  # SDK prefix (exactly as the production build does, vendor/distroav links
  # OBS::libobs + OBS::obs-frontend-api) — but with the CEF/browser dependency OFF, the
  # bulk of the full build, so it stays minutes-not-hours. It is a COMPILE check, not the
  # production bundle: it builds no installer and uploads no artifact. It fails the
  # push-to-dev run (the pre-merge gate) on any C++ error in the vendored OBS/DistroAV
  # tree, so #97's forward-ref class can never again reach main.
  distroav-compile-check:
    name: Vendored OBS/DistroAV C++ compile gate (#101)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Fail fast, before the configure/build, if the newest vendored DistroAV C++
      # surfaces are missing — so a dropped patch fails here cheaply rather than after a
      # long configure. Mirrors the source guards in windows-genlock.yml.
      - name: Assert vendored DistroAV C++ sources present
        shell: pwsh
        run: |
          foreach ($f in @(
            "vendor/distroav/src/ndi-source.cpp",
            "vendor/distroav/src/ndi-output.cpp",
            "vendor/distroav/src/ndi-burn-filter.cpp",
            "vendor/distroav/src/plugin-main.cpp",
            "vendor/distroav/CMakeLists.txt"
          )) {
            if (!(Test-Path $f)) { Write-Error "vendored DistroAV source missing: $f (#101)"; exit 1 }
          }
          $cm = (Get-Content "vendor/distroav/CMakeLists.txt" -Raw) -replace '\s+', ' '
          if ($cm -notmatch [regex]::Escape('ndi-burn-filter.cpp')) {
            Write-Error "CMakeLists.txt: ndi-burn-filter.cpp not in target_sources — it would not compile into the gate (#101)"; exit 1
          }
          Write-Output "vendored DistroAV C++ sources present — OK"

      # Configure the vendored OBS exactly like the production build (same preset, same
      # disable flags), but with ENABLE_BROWSER=OFF: the CEF/browser download + build is
      # the bulk of the 150-min full build and is not needed to compile-check the
      # vendored C++. bash quoting is exact — pwsh would split -DNAME=32.2.0 at the dots.
      - name: Configure OBS (windows-x64 preset, browser OFF for the compile gate)
        working-directory: vendor/obs-studio
        shell: bash
        run: >
          cmake --preset windows-x64
          '-DOBS_VERSION_OVERRIDE=32.2.0'
          -DENABLE_BROWSER=OFF
          -DENABLE_WHATSNEW=OFF
          -DENABLE_AJA=OFF
          -DENABLE_VLC=OFF
          -DENABLE_TEST_INPUT=OFF

      # Build OBS (all default targets) so `cmake --install` finds every artifact its
      # global install rules reference (libobs, the d3d11/opengl graphics backends, the
      # frontend, obs-frontend-api). A target-narrowed build (libobs + obs-frontend-api
      # only) makes the install step fail looking for libobs-d3d11.dll etc. — the bulk
      # cost we cut is CEF/browser (ENABLE_BROWSER=OFF in the configure above), NOT the
      # graphics backends, which are small and required for the SDK install DistroAV
      # links against. This mirrors windows-genlock.yml's `cmake --build build_x64`
      # minus CEF, so it stays minutes-not-hours yet produces a complete, installable SDK.
      - name: Build OBS (browser OFF — graphics backends + libobs + frontend-api)
        working-directory: vendor/obs-studio
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      - name: Install OBS SDK prefix
        working-directory: vendor/obs-studio
        shell: bash
        run: |
          cmake --install build_x64 --config RelWithDebInfo --prefix "$GITHUB_WORKSPACE/obs-sdk"
          # #188: the default install omits the EXCLUDE_FROM_ALL "Development" component (the cmake
          # package configs libobsConfig.cmake / obs-frontend-apiConfig.cmake + headers + import
          # libs). The standalone av-sync-dock build needs them, so install it explicitly.
          cmake --install build_x64 --config RelWithDebInfo --prefix "$GITHUB_WORKSPACE/obs-sdk" --component Development

      # Configure DistroAV against the genlock-patched OBS SDK — identical to the
      # production windows-genlock.yml configure step.
      - name: Configure DistroAV against the genlocked OBS
        working-directory: vendor/distroav
        shell: bash
        run: >
          cmake -B build_x64 -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/obs-sdk"
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      # THE compile check: build the DistroAV plugin. This compiles the vendored
      # ndi-source.cpp / ndi-output.cpp / ndi-burn-filter.cpp / plugin-main.cpp etc. —
      # the C++ a forward-ref / missing-include / signature error lives in. A compile
      # error fails this push-to-dev run (the pre-merge gate) instead of reaching main.
      - name: Compile-check DistroAV (build the plugin)
        working-directory: vendor/distroav
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      # camera-box #404/#406: the compile-check above already LINKS a real distroav.dll against the
      # genlock-patched OBS SDK (same as the full windows-genlock.yml — ENABLE_BROWSER=OFF only
      # affects OBS core, not the plugin), so STAGE + UPLOAD it. This gives a minutes-fast
      # deployable distroav.dll for a hot-swap — no 1-2.5h full build — mirroring the obs.dll fast
      # path above, so a DistroAV change (e.g. the #404 burn overlay) can be verified on the rig
      # quickly instead of blocking on the full bundle.
      - name: Stage the compiled distroav.dll (#404)
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse vendor/distroav/build_x64 -Filter distroav.dll |
                 Where-Object { $_.FullName -notmatch 'CMakeFiles' } | Select-Object -First 1
          if (!$dll) { Write-Error "distroav.dll not found after the plugin build (#404)"; exit 1 }
          New-Item -ItemType Directory -Force -Path distroav-stage | Out-Null
          Copy-Item $dll.FullName distroav-stage/
          git rev-parse HEAD | Out-File distroav-stage/DISTROAV_BUILD_SHA.txt -Encoding ascii
          Write-Output "staged distroav.dll from: $($dll.FullName)  size=$($dll.Length)"

      - name: Upload distroav.dll (fast hot-swap, #404)
        uses: actions/upload-artifact@v4
        with:
          name: distroav-fast-dll
          path: distroav-stage/
          if-no-files-found: error

      # #398 (Option A, the #269 lock-step): the ONLY intentional camera-box patch on the
      # vendored av-sync-dock — the dock decodes OUR dual-QR (frame_id, not norihiro's q=,i=,f=,c=)
      # so the guarded zero-loss gate stays untouched. A future `git subtree pull` of av-sync-dock
      # would still COMPILE fine if it silently reverted this (stock norihiro compiles too) — only
      # this text guard catches the behavior regression. Mirrors the Linux-CI guard
      # tests/av_sync_dock_qr_patch_guard.rs.
      - name: Assert camera-box dual-QR dock patch present (#398)
        shell: pwsh
        run: |
          if (-not (Test-Path "vendor/av-sync-dock/src/camera-box-qr.hpp")) { Write-Error "camera-box-qr.hpp is gone (#398) — the dock no longer knows our dual-QR wire format"; exit 1 }
          $hdr = (Get-Content "vendor/av-sync-dock/src/camera-box-qr.hpp" -Raw)
          if ($hdr -notmatch [regex]::Escape('decode_camera_box_qr')) { Write-Error "decode_camera_box_qr gone (#398)"; exit 1 }
          if ($hdr -notmatch [regex]::Escape('0xEDB88320')) { Write-Error "camera-box-qr.hpp CRC-32/ISO-HDLC polynomial gone (#398) — no longer matches src/payload.rs"; exit 1 }
          $src = (Get-Content "vendor/av-sync-dock/src/sync-test-output.cpp" -Raw) -replace '\s+', ' '
          if ($src -notmatch [regex]::Escape('#include "camera-box-qr.hpp"')) { Write-Error "camera-box-qr.hpp include gone from sync-test-output.cpp (#398)"; exit 1 }
          if ($src -notmatch [regex]::Escape('decode_camera_box_qr((char *)data.payload, &cb)')) { Write-Error "camera-box dual-QR try-first decode gone (#398) — dock reverted to norihiro-only"; exit 1 }
          if ($src -notmatch [regex]::Escape('cb_video_ts_ns[256]')) { Write-Error "camera-box video-ring (live pairing) gone (#398)"; exit 1 }
          if ($src -notmatch [regex]::Escape('signal_sync_found(st->context, &si)')) { Write-Error "camera-box live sync_found emit gone (#398) — dock would stop showing our live offset"; exit 1 }
          if (([regex]::Matches($src, [regex]::Escape('si.gate_convention = true;'))).Count -ne 2) { Write-Error "camera-box gate_convention emit tags != 2 (#999) — the display sign-convention fix dropped from an emit site"; exit 1 }
          if (([regex]::Matches($src, [regex]::Escape('camerabox::cb_corrected_video_ts_is_valid(corrected_video_ts)'))).Count -ne 2) { Write-Error "camera-box corrected_video_ts validity guard != 2 (#1005) — the garbage-clamp fix dropped from an emit site"; exit 1 }
          if ($src -match [regex]::Escape('corrected_video_ts > 0 ? (uint64_t)corrected_video_ts : 0')) { Write-Error "camera-box OLD garbage-clamp ternary still present (#1005) — the clamp-and-emit-anyway fix was reverted"; exit 1 }
          $dock = (Get-Content "vendor/av-sync-dock/src/sync-test-dock.cpp" -Raw) -replace '\s+', ' '
          if ($dock -notmatch [regex]::Escape('cb_dock_latency_display_ms(dock_native_ts_ns, data.gate_convention)')) { Write-Error "on_sync_found no longer routes through cb_dock_latency_display_ms (#999) — dock display sign fix reverted"; exit 1 }
          Write-Output "#398 camera-box dual-QR dock patch present - OK"

      # #188: compile-check the A/V sync dock against the SAME installed OBS SDK (reuses the
      # OBS build above — no second full OBS build). Catches a dock C++/Qt/CMake error at the
      # pre-merge gate instead of after the 150-min full windows-genlock build.
      - name: Configure av-sync-dock against the genlocked OBS (#188)
        working-directory: vendor/av-sync-dock
        shell: bash
        run: |
          set -eu
          WS=$(cygpath "$GITHUB_WORKSPACE")
          # obs-sdk now carries the Development component (libobs / obs-frontend-api / w32-pthreads
          # cmake configs + the finders/ modules). libobsConfig also find_dependency(SIMDe, Threads)
          # and obs-frontend-api needs Qt6 — SIMDe + Qt6 live in the obs-deps the OBS/DistroAV build
          # downloaded, so add every .deps root to the prefix so all transitive deps resolve.
          PREFIX="$(cygpath -m "$WS/obs-sdk")"
          for d in "$WS"/vendor/obs-studio/.deps/*-x64 "$WS"/vendor/distroav/.deps/*-x64; do
            [ -d "$d" ] && PREFIX="$PREFIX;$(cygpath -m "$d")"
          done
          LIBOBS_CFG=$(find "$WS/obs-sdk" -maxdepth 6 -iname 'libobs*config.cmake' | head -1)
          FRONTEND_CFG=$(find "$WS/obs-sdk" -maxdepth 6 -iname 'obs-frontend-api*config.cmake' | head -1)
          echo "prefix=$PREFIX"; echo "libobs cfg=$LIBOBS_CFG"; echo "frontend cfg=$FRONTEND_CFG"
          test -n "$LIBOBS_CFG"   || { echo "ERROR: libobsConfig.cmake not in obs-sdk (Development install failed?)"; find "$WS/obs-sdk" -iname '*.cmake' | head -60; exit 1; }
          test -n "$FRONTEND_CFG" || { echo "ERROR: obs-frontend-apiConfig.cmake not in obs-sdk"; exit 1; }
          cmake -B build_x64 -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_PREFIX_PATH="$PREFIX" \
            -Dlibobs_DIR="$(cygpath -m "$(dirname "$LIBOBS_CFG")")" \
            -Dobs-frontend-api_DIR="$(cygpath -m "$(dirname "$FRONTEND_CFG")")" \
            -DQT_VERSION=6 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compile-check av-sync-dock (build the plugin, #188)
        working-directory: vendor/av-sync-dock
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      # Deploy path for the vendored dock: the compile gate above already builds the REAL
      # RelWithDebInfo obs-audio-video-sync-dock.dll, but until now nothing uploaded it — every
      # merged vendor/av-sync-dock fix sat undeployed on the rig unless someone ran the 150-min
      # full bundle (the exact miss the issue-953/955 session hit: three merged dock fixes,
      # operator still seeing the old dock). Mirror of the distroav fast hot-swap pattern above.
      - name: Stage the compiled av-sync-dock DLL (fast hot-swap)
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse vendor/av-sync-dock/build_x64 -Filter obs-audio-video-sync-dock.dll |
                 Where-Object { $_.FullName -notmatch 'CMakeFiles' } | Select-Object -First 1
          if (!$dll) { Write-Error "obs-audio-video-sync-dock.dll not found after the dock build"; exit 1 }
          New-Item -ItemType Directory -Force -Path avsyncdock-stage | Out-Null
          Copy-Item $dll.FullName avsyncdock-stage/
          git rev-parse HEAD | Out-File avsyncdock-stage/AVSYNCDOCK_BUILD_SHA.txt -Encoding ascii
          Write-Output "staged dock dll from: $($dll.FullName)  size=$($dll.Length)"

      - name: Upload av-sync-dock DLL (fast hot-swap)
        uses: actions/upload-artifact@v4
        with:
          name: avsyncdock-fast-dll
          path: avsyncdock-stage/
          if-no-files-found: error

      - name: Compile gate passed
        shell: bash
        run: |
          echo "#101 vendored OBS/DistroAV + #188 av-sync-dock C++ compiled clean - pre-merge gate green."
