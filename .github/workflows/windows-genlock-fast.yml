name: Windows genlock FAST (libobs hot-swap + vendored C++ compile gate)

# camera-box #136: a FAST build of ONLY the libobs target (obs.dll) from the
# vendored, genlock-patched tree — for iterating the genlock core DURING an event.
# The full Windows artifact (browser/CEF + DistroAV + installer layout) is
# windows-genlock.yml (~1-2.5 h); this builds just obs.dll in minutes for a hot DLL
# swap. obs.dll is ABI-compatible with the already-deployed distroav.dll because the
# #136 change is libobs-INTERNAL (a static function + a branch — no obs_source_frame
# layout change, no new public API). Manual dispatch; deploy off-air with a kept
# fallback + the one-click desktop revert.
#
# camera-box #101: this workflow now ALSO carries a PRE-MERGE compile gate for the
# vendored DistroAV C++ (the `distroav-compile-check` job below). The per-PR ci.yml is
# Rust-only and the libobs `build` job above compiles ONLY libobs, so a C++ compile
# error in the vendored DistroAV tree (ndi-source.cpp / ndi-output.cpp / the burn
# filter / plugin-main.cpp — the #97 forward-ref class) used to pass every push-to-dev
# gate and reach main, where only the manual 150-min windows-genlock.yml caught it
# (wasting a full build cycle). The compile-check configures + builds the DistroAV
# plugin against an installed libobs/obs-frontend-api SDK prefix with the CEF/browser
# dependency OFF, so it stays minutes-not-hours yet compiles the same vendored C++ the
# production build does. This repo gates merges via push-to-dev (it deliberately omits
# `pull_request` per #157), so push-to-dev IS the pre-merge gate.

on:
  workflow_dispatch:
  # camera-box #136/#101: also fire on a dev push that touches the vendored OBS or
  # DistroAV tree, so (a) a hot obs.dll build is available WITHOUT first merging the
  # workflow to the default branch (GitHub only lets workflow_dispatch run from the
  # default branch), and (b) the DistroAV compile gate runs pre-merge on any vendored
  # C++ change — including a DistroAV-only change, which the old libobs-only path
  # (`vendor/obs-studio/libobs/**`) silently skipped.
  push:
    branches: [dev]
    paths:
      - 'vendor/obs-studio/**'
      - 'vendor/distroav/**'
      - 'vendor/av-sync-dock/**'
      - '.github/workflows/windows-genlock-fast.yml'

permissions:
  contents: read

concurrency:
  group: windows-genlock-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Fail fast (before the configure/build) if the #136 patch is missing — mirrors
      # the Linux-CI guard tests/genlock_preload.rs::vendored_source::
      # timestamp_aligned_release_present.
      - name: Assert genlock timestamp-aligned release patch present (#136)
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          # #257: ts-align + render tick are build defaults (always on, no env).
          if ($src -match [regex]::Escape('getenv("OBS_GENLOCK_TS_ALIGN")')) { Write-Error "OBS_GENLOCK_TS_ALIGN env is BACK — #257 made ts-align a build default"; exit 1 }
          $vid = (Get-Content "vendor/obs-studio/libobs/obs-video.c" -Raw) -replace '\s+', ' '
          if ($vid -match [regex]::Escape('getenv("OBS_GENLOCK_WALL_CLOCK")')) { Write-Error "OBS_GENLOCK_WALL_CLOCK env is BACK — #257 made the render tick a build default"; exit 1 }
          if ($src -notmatch [regex]::Escape('genlock_ts_align_enabled() || source->genlock_latency_ms > 0')) { Write-Error "ts-align release gate gone (#136/#245)"; exit 1 }
          if ($src -notmatch [regex]::Escape('genlock_is_wallclock_ts(next_frame->timestamp)')) { Write-Error "wall-clock guard gone (#136)"; exit 1 }
          if ($src -notmatch [regex]::Escape('wall_now = genlock_wall_now_ns();')) { Write-Error "wall-clock source (genlock_wall_now_ns -> wall_now) gone (#136)"; exit 1 }
          if ($src -notmatch [regex]::Escape('genlock_present_ts(wall_now, preload, interval)')) { Write-Error "present_ts gone (#136)"; exit 1 }
          # #147: the backward wall-clock step (NTP/PTP sawtooth) re-anchor guard — without it
          # the ts-align release FREEZES the program feed forever on a backward clock step.
          # #269 [3]: detection on the MAX queued ts (depth-independent, uniform across sources).
          # #1009: the trigger is RE-QUALIFIED — margin max(3 intervals, 250 ms) + sustained
          # across consecutive due==0 ticks (the one-interval single-tick trigger fired on a few
          # ms of sender-ahead stamp skew and permanently collapsed the deep hold overnight).
          if ($src -notmatch [regex]::Escape('max_ts > wall_now + backward_margin')) { Write-Error "re-qualified backward-clock-step detection gone (#147/#269/#1009) — either the guard is gone (freeze on an NTP/PTP step) or it reverted to the issue-1007 hair-trigger"; exit 1 }
          if ($src -notmatch [regex]::Escape('#define GENLOCK_BACKWARD_STEP_MIN_MARGIN_NS 250000000ULL')) { Write-Error "backward-step margin floor gone (#1009) — the guard would hair-trigger on sender-ahead stamp skew again"; exit 1 }
          if ($src -notmatch [regex]::Escape('#define GENLOCK_BACKWARD_STEP_SUSTAIN_TICKS 3 ')) { Write-Error "backward-step sustained qualification gone (#1009) — single-tick hair-trigger again"; exit 1 }
          if ($src -notmatch [regex]::Escape('source->genlock_backward_steps++')) { Write-Error "backward-step re-anchor counter gone (#147)"; exit 1 }
          # #269 [2]: per-event latch — counter fires once per step, not per recovery tick.
          if ($src -notmatch [regex]::Escape('source->genlock_in_backward_step = true')) { Write-Error "backward-step per-event latch gone (#269 [2]) — counter would over-report"; exit 1 }
          # #1009 SELF-HEAL: leaving the regime must zero the locked boundary (re-ACQUIRE the
          # configured hold) — without it a regime leaves the FIFO at the live edge FOREVER.
          if ($src -notmatch [regex]::Escape('genlock_backward_regime_end(source, reserve_ms);')) { Write-Error "backward-step regime-exit SELF-HEAL gone (#1009) — a hold collapse would be a permanent absorbing state again"; exit 1 }
          if ($src -notmatch [regex]::Escape('backward_regime_ticks=%llu')) { Write-Error "backward_regime_ticks audit exposure gone (#1009) — a sustained hold-bypass regime would be invisible to the E2E/drift gates"; exit 1 }
          if ($src -notmatch [regex]::Escape('wall_qpc_drift_ms=%lld') -or $src -notmatch [regex]::Escape('static long long genlock_wall_qpc_drift_ms(void)') -or $src -notmatch [regex]::Escape('genlock_wall_qpc_drift_ms());')) { Write-Error "wall-vs-QPC clock-drift audit term/helper gone (#800) — the remaining A/V-shift candidate (WALL-slaved video vs QPC-slaved audio) would be invisible"; exit 1 }
          Write-Output "#136/#257 ts-align + render tick build-default (no env) + #147/#1009 re-qualified backward-step recovery + self-heal + #800 wall-qpc drift present — OK"

      # #940 piece 1: fail fast if the per-event relock phase-evidence log line is missing —
      # mirrors the Linux-CI guard
      # tests/genlock_release_cadence.rs::relock_events_log_phase_evidence_940.
      - name: Assert genlock relock phase-evidence instrumentation present (#940 piece 1)
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($src -notmatch [regex]::Escape('genlock-relock')) { Write-Error "the per-event relock log line (genlock-relock) is gone — #940 piece 1 phase-evidence instrumentation reverted"; exit 1 }
          foreach ($field in @('depth=%zu', 'steady_depth_frames=%zu', 'due=%zu', 'erased=%zu', 'head_skew_ms=%lld', 'tick_phase_ns=%llu', 'anchor_ns=%llu', 'sel_vs_newest_due=%lld')) {
            if ($src -notmatch [regex]::Escape($field)) { Write-Error "the relock phase-evidence log line is missing field '$field' — #940 piece 1 reverted"; exit 1 }
          }
          # #940 piece 1 correctness fix: steady_depth_frames_for_log must subtract the FULL
          # source-multiple-SCALED margin (piece 2: MARGIN * n), not the bare margin — else a
          # 60-into-30 source (n>=2) logs an inflated value. Mirrors the Rust-side anchor in
          # tests/genlock_release_cadence.rs::relock_events_log_phase_evidence_940.
          if ($src -notmatch [regex]::Escape('(size_t)GENLOCK_QDEPTH_RELOCK_MARGIN * (size_t)n_for_log')) { Write-Error "the relock log's steady_depth_frames no longer subtracts the scaled margin (GENLOCK_QDEPTH_RELOCK_MARGIN * n_for_log) — #940 piece 1 correctness fix reverted"; exit 1 }
          Write-Output "#940 piece 1 relock phase-evidence instrumentation present — OK"

      # #940 piece 3: fail fast if the ts-align reserve deadline is no longer phase-pinned to
      # the wall-clock frame grid — mirrors the Linux-CI guard
      # tests/genlock_release_cadence.rs::ts_align_deadline_is_phase_pinned_to_the_wall_grid_940.
      - name: Assert genlock deadline is phase-pinned to the wall grid (#940 piece 3)
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($src -notmatch [regex]::Escape('static inline uint64_t genlock_phase_pin_deadline(')) { Write-Error "the grid-quantization helper genlock_phase_pin_deadline is gone — #940 piece 3 reverted"; exit 1 }
          if ($src -notmatch [regex]::Escape('(deadline_ns / interval_ns) * interval_ns')) { Write-Error "genlock_phase_pin_deadline no longer floors to the grid — #940 piece 3 reverted"; exit 1 }
          if ($src -notmatch [regex]::Escape('present_ts = genlock_phase_pin_deadline(present_ts, interval);')) { Write-Error "genlock_phase_pin_deadline is defined but not called from the ts-align release path — #940 piece 3 dead code"; exit 1 }
          if ($src -notmatch [regex]::Escape('#define GENLOCK_PHASE_PIN_HYSTERESIS_NS 5000000ULL')) { Write-Error "the grid-comparison hysteresis constant is missing or changed — #940 piece 3 reverted"; exit 1 }
          if ($src -notmatch [regex]::Escape('array[due]->timestamp <= present_ts + due_hysteresis_ns')) { Write-Error "the due loop no longer applies the grid-comparison hysteresis — #940 piece 3 reverted"; exit 1 }
          if ($src -notmatch [regex]::Escape('reserve_ms > 0 ? GENLOCK_PHASE_PIN_HYSTERESIS_NS : 0')) { Write-Error "the grid hysteresis is no longer gated to the reserve_ms>0 path — #940 piece 3 reverted"; exit 1 }
          Write-Output "#940 piece 3 phase-pinned deadline + grid hysteresis present — OK"

      # #1003: fail fast if the relock selection is no longer phase-anchored — mirrors the
      # Linux-CI guard
      # tests/genlock_release_cadence.rs::relock_selection_is_phase_anchored_not_newest_due_1003.
      # The selection arithmetic itself is Tier-0 unit-tested in src/genlock_backlog.rs; this
      # guards the C wiring, which compiles on CI only.
      - name: Assert relock selection is phase-anchored (#1003)
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          $hdr = (Get-Content "vendor/obs-studio/libobs/obs-internal.h" -Raw) -replace '\s+', ' '
          if ($hdr -notmatch [regex]::Escape('uint64_t genlock_phase_anchor_ns;')) { Write-Error "the per-source phase anchor (genlock_phase_anchor_ns) is gone from obs-internal.h — the relock has no remembered phase to inherit (#1003)"; exit 1 }
          if ($src -notmatch [regex]::Escape('static inline size_t genlock_relock_select_nearest(')) { Write-Error "the phase-continuity selection helper genlock_relock_select_nearest is gone — #1003 reverted to instant-sampled selection"; exit 1 }
          if ($src -notmatch [regex]::Escape('best_d = genlock_abs_diff_ns(')) { Write-Error "genlock_relock_select_nearest no longer measures each stamp's DISTANCE from the anchor target — a non-nearest rule is not continuous and has an edge to flip (#1003)"; exit 1 }
          if ($src -notmatch [regex]::Escape('if (d < best_d)')) { Write-Error "the nearest scan's STRICT < is gone; a non-strict compare lets an equidistant target oscillate between neighbours across episodes (#1003)"; exit 1 }
          if ($src -notmatch [regex]::Escape('return anchor > configured ? anchor : configured;')) { Write-Error "genlock_relock_target_age_ns no longer returns the anchor FLOORED at the configured latency; an anchor below the hold targets the live edge and one relock erases the whole delay line (#1003)"; exit 1 }
          if ($src -notmatch [regex]::Escape('release = genlock_relock_select_nearest(source, wall_now, reserve_ms) + 1;')) { Write-Error "the ACQUIRE branch no longer selects by phase continuity — a cold/self-heal re-acquire would re-mint an edge-ridden phase (#1003)"; exit 1 }
          if ($src -notmatch [regex]::Escape('release = sel_1003 + 1;')) { Write-Error "the BACKLOG-STORM branch no longer selects by phase continuity — this is the branch the live episode steps were traced to (#1003)"; exit 1 }
          if ($src -notmatch [regex]::Escape('if (sel_1003 == 0 && source->genlock_phase_anchor_ns != 0)')) { Write-Error "the BACKLOG stale-anchor self-heal is gone; a relock shedding zero frames would re-fire every tick and starve the settle-back drain (#1003)"; exit 1 }
          if ($src -notmatch [regex]::Escape('size_t to_drop = release - 1;')) { Write-Error "the erase-into-dropped_due idiom (to_drop = release - 1) is gone; a relock would stop shedding backlog depth (#1003)"; exit 1 }
          if ($src -notmatch [regex]::Escape('if (anchor_update) source->genlock_phase_anchor_ns =')) { Write-Error "the phase anchor is no longer updated (gated by anchor_update) on the present tail; ungated, a relock would redefine the phase it must inherit (#1003)"; exit 1 }
          if ($src -notmatch [regex]::Escape('genlock_phase_anchor_from_present(')) { Write-Error "the anchor is no longer derived via genlock_phase_anchor_from_present (the saturating wall_now - presented_ts) (#1003)"; exit 1 }
          if ($src -match [regex]::Escape('release = due;')) { Write-Error "a relock branch still uses the newest-due selection (release = due;) — instant-sampled and stateless, it re-mints the release phase every lock episode (#1003)"; exit 1 }
          # EVERY site that destroys the delay line must clear the anchor first — the explicit
          # flush, the overrun force-drain, and the async_texture_changed re-alloc. Counting
          # them against the call sites stops the seam list drifting when a 4th is added.
          $seams = ([regex]::Matches($src, [regex]::Escape('source->genlock_phase_anchor_ns = 0; free_async_cache(source);'))).Count
          $frees = ([regex]::Matches($src, [regex]::Escape('free_async_cache(source);'))).Count
          if ($seams -ne $frees) { Write-Error "$frees site(s) call free_async_cache() but only $seams clear the phase anchor first; each destroys the whole delay line (#1003)"; exit 1 }
          # A latency SETPOINT change invalidates the remembered age too. Scoped to the setter
          # function, never a fixed byte window (the #940 piece 1 lesson).
          $st = $src -split [regex]::Escape('void obs_source_set_genlock_latency_ms(')
          if ($st.Count -lt 2) { Write-Error "obs_source_set_genlock_latency_ms is gone (#1003)"; exit 1 }
          $sb = $st[1]; $sx = $sb.IndexOf('uint32_t obs_source_get_genlock_latency_ms(')
          if ($sx -ge 0) { $sb = $sb.Substring(0, $sx) }
          if ($sb -notmatch [regex]::Escape('source->genlock_phase_anchor_ns = 0;')) { Write-Error "a latency setpoint change no longer clears the phase anchor; on a DECREASE the relock then sheds nothing forever while the backlog branch fires every tick (#1003)"; exit 1 }
          # The backward-step regime end must CLEAR the anchor: the wall clock moved, so every
          # sampled age is wrong by exactly the step. Function-scoped for the same reason.
          $re = $src -split [regex]::Escape('static void genlock_backward_regime_end(')
          if ($re.Count -lt 2) { Write-Error "genlock_backward_regime_end is gone (the issue-1009 self-heal)"; exit 1 }
          $body = $re[1]; $nx = $body.IndexOf('static ')
          if ($nx -ge 0) { $body = $body.Substring(0, $nx) }
          if ($body -notmatch [regex]::Escape('source->genlock_phase_anchor_ns = 0;')) { Write-Error "a backward-step regime end no longer CLEARS the phase anchor; re-acquiring against a pre-step age re-establishes the hold off by the whole clock step (#1003)"; exit 1 }
          Write-Output "#1003 phase-anchored relock selection present — OK"

      # #940 piece 2: fail fast if the backlog-relock margin no longer scales by the source's
      # own measured rate multiple — mirrors the Linux-CI guard
      # tests/genlock_release_cadence.rs::backlog_relock_margin_scales_with_the_source_multiple_940.
      - name: Assert genlock relock margin scales with the source multiple (#940 piece 2)
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($src -notmatch [regex]::Escape('return (size_t)(depth + (uint64_t)GENLOCK_QDEPTH_RELOCK_MARGIN * (uint64_t)n);')) { Write-Error "genlock_backlog_relock_qdepth no longer scales the margin by n — #940 piece 2 reverted"; exit 1 }
          if ($src -match [regex]::Escape('return (size_t)(depth + GENLOCK_QDEPTH_RELOCK_MARGIN);')) { Write-Error "the OLD unscaled-margin return is BACK — #940 piece 2 reverted"; exit 1 }
          if ($src -notmatch [regex]::Escape('#define GENLOCK_QDEPTH_RELOCK_MARGIN 6')) { Write-Error "the backlog margin constant is no longer 6 — #940 piece 2 must scale the margin, never widen the constant"; exit 1 }
          Write-Output "#940 piece 2 arrival-surplus-aware relock margin present — OK"

      # #1049: fail fast if the bounded phase convergence on the steady conveyor is gone or
      # unwired — mirrors tests/genlock_release_cadence.rs::phase_convergence_present_and_wired_in_1049
      # and the C-vs-Rust parity gate tests/genlock_relock_selection_parity.rs.
      - name: Assert genlock steady-conveyor phase convergence present (#1049)
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($src -notmatch [regex]::Escape('static inline bool genlock_phase_converge_due(')) { Write-Error "the pure phase-converge decision genlock_phase_converge_due is gone — the strih 60-into-30 acquire-phase would never converge again (#1049)"; exit 1 }
          if ($src -notmatch [regex]::Escape('const uint64_t quantum = interval_ns / nn;')) { Write-Error "the shed quantum is no longer the SOURCE interval (interval_ns / n) — the n=2 threshold would sit a full canvas frame too high (#1049)"; exit 1 }
          if ($src -notmatch [regex]::Escape('const uint64_t floor_ns = wall_now_ns > newest_stamp_ns ? wall_now_ns - newest_stamp_ns : 0;')) { Write-Error "the achievable floor (wall - newest_stamp) is gone — a reserve-only threshold re-creates the #998 limit cycle at the rig's transport skew (#1049)"; exit 1 }
          if ($src -notmatch [regex]::Escape('const uint64_t target = reserve_ns > floor_ns ? reserve_ns : floor_ns;')) { Write-Error "the converge target is no longer max(reserve, floor) (#1049)"; exit 1 }
          if ($src -notmatch [regex]::Escape('if (n < 2) return false;')) { Write-Error "the N>=2-only gate (if (n < 2) return false;) is gone — convergence would limit-cycle on a deep N==1 source (stream NDI 2ME PGM) (#1049)"; exit 1 }
          if ($src -notmatch [regex]::Escape('static bool genlock_should_converge_phase(')) { Write-Error "the source wrapper genlock_should_converge_phase is gone (#1049)"; exit 1 }
          if ($src -notmatch [regex]::Escape('genlock_should_converge_phase(source, reserve_ms, interval, wall_now)')) { Write-Error "genlock_should_converge_phase is defined but no longer CALLED from the release tail — dead code, the phase never converges (#1049)"; exit 1 }
          if ($src -notmatch [regex]::Escape('bool converge_eligible = false;')) { Write-Error "the converge_eligible gate is gone from genlock_release_tick (#1049)"; exit 1 }
          $elig = ([regex]::Matches($src, [regex]::Escape('converge_eligible = true;'))).Count
          if ($elig -ne 2) { Write-Error "expected BOTH STEADY branches (N==1 and N>=2) to set converge_eligible, found $elig (#1049)"; exit 1 }
          if ($src -notmatch [regex]::Escape('} else if (!drain_eligible) { source->genlock_ticks_since_drain++;')) { Write-Error "the N>=2 converge branch no longer maintains the shared throttle counter — the shed would never fire on a 60-into-30 source (#1049)"; exit 1 }
          if ($src -notmatch [regex]::Escape('source->genlock_converge_sheds++;') -or $src -notmatch [regex]::Escape('converge_sheds=%u')) { Write-Error "the distinct converge-shed observability counter / audit field is gone (#1049)"; exit 1 }
          Write-Output "#1049 steady-conveyor phase convergence present — OK"

      - name: Assert #1161 Stage-2 ACQUIRE bracketing gate present
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          $internal = (Get-Content "vendor/obs-studio/libobs/obs-internal.h" -Raw) -replace '\s+', ' '
          if ($src -notmatch [regex]::Escape('if (clamped > prev) { source->genlock_locked_next_boundary_ns = 0; source->genlock_acquire_bracket_ticks = 0; }')) { Write-Error "obs_source_set_genlock_latency_ms no longer forces a re-acquire on a pin RISE — a raised per-source pin can never move the presented frame deeper (#1161)"; exit 1 }
          if ($src -notmatch [regex]::Escape('static inline bool genlock_relock_acquire_should_hold(')) { Write-Error "the Stage-2 ACQUIRE bracketing gate helper genlock_relock_acquire_should_hold is gone — the frame-mover reverted (#1161)"; exit 1 }
          if ($src -notmatch [regex]::Escape('#define GENLOCK_ACQUIRE_BRACKET_FAILOPEN_TICKS 3ULL')) { Write-Error "the ACQUIRE bracketing fail-open margin GENLOCK_ACQUIRE_BRACKET_FAILOPEN_TICKS is gone (#1161)"; exit 1 }
          if ($src -notmatch [regex]::Escape('const uint64_t cap = (reserve_ns + interval_ns - 1) / interval_ns + GENLOCK_ACQUIRE_BRACKET_FAILOPEN_TICKS;')) { Write-Error "the ACQUIRE bracketing gate's fail-open cap (ceil(reserve/interval)+margin) is gone — a queue that never deepens could hold forever (#1161)"; exit 1 }
          if ($src -notmatch [regex]::Escape('genlock_relock_acquire_should_hold(oldest_age,') -or $src -notmatch [regex]::Escape('source->genlock_acquire_bracket_ticks++;')) { Write-Error "the ACQUIRE branch no longer calls genlock_relock_acquire_should_hold(oldest_age, ...) / increments genlock_acquire_bracket_ticks (#1161)"; exit 1 }
          if ($internal -notmatch [regex]::Escape('uint32_t genlock_acquire_bracket_ticks;')) { Write-Error "the ACQUIRE bracket-tick counter field genlock_acquire_bracket_ticks is missing from obs_source (#1161)"; exit 1 }
          if ($src -notmatch [regex]::Escape("genlock-acquire-bracket '%s':") -or $src -notmatch [regex]::Escape('oldest_queued_age_ms=') -or $src -notmatch [regex]::Escape('decision=')) { Write-Error "the #1161 ACQUIRE-bracket observability marker (genlock-acquire-bracket, reserve vs oldest_queued_age + HOLD/ACQUIRE) is gone — a live pin-rise re-acquire leaves no trace, a below-floor inert pin cannot be diagnosed (#1161)"; exit 1 }
          Write-Output "#1161 Stage-2 ACQUIRE bracketing gate present — OK"

      # #249: the fast path builds obs.dll from the real vendored source, so a `git subtree pull`
      # (#44) that reverts #245 to inert-but-still-compiling would hot-swap an INERT obs.dll un-gated
      # (the #235 regression: latency collapsed to one GLOBAL env knob, no per-source override). The
      # slow windows-genlock.yml gained this #245 gate in #248; mirror it here so the fast path fails
      # at the same token check rather than shipping an inert DLL. Pure source-text guard (no build) —
      # mirrors tests/genlock_preload.rs::vendored_source (probe-gated, can't compile on this runner).
      - name: Assert per-source genlock latency (ms) override present (#245)
        shell: pwsh
        run: |
          $obs = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($obs -notmatch [regex]::Escape('void obs_source_set_genlock_latency_ms(obs_source_t *source, uint32_t')) {
            Write-Error "obs-source.c: obs_source_set_genlock_latency_ms missing — #245 per-source latency API reverted"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('source->genlock_latency_ms > 0 ? source->genlock_latency_ms : genlock_reserve_ms()')) {
            Write-Error "obs-source.c: the per-source latency release-deadline gate is gone — #245 override inert in the render path"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('#define GENLOCK_SOURCE_LATENCY_MS_MAX 2000')) {
            Write-Error "obs-source.c: GENLOCK_SOURCE_LATENCY_MS_MAX no longer 2000 — #245 per-source cap reverted"; exit 1
          }
          # #292: the drop-cap must budget the held depth at the SOURCE arrival fps (60), not the canvas
          # output fps — a 60fps NDI feed into a 30fps stream canvas parks 2x the canvas-rate frames, so a
          # canvas-fps budget force-drains a deep latency at ~450ms. A subtree revert that drops the define
          # or the budget term silently re-caps the operator's A/V-align delay; fail the build at the token.
          if ($obs -notmatch [regex]::Escape('#define GENLOCK_MAX_SOURCE_FPS 60')) {
            Write-Error "obs-source.c: GENLOCK_MAX_SOURCE_FPS no longer 60 — #292 drop-cap arrival-fps budget reverted (latency re-caps at ~450ms)"; exit 1
          }
