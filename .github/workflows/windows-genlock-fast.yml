name: Windows genlock FAST (libobs hot-swap + vendored C++ compile gate)

# camera-box #136: a FAST build of ONLY the libobs target (obs.dll) from the
# vendored, genlock-patched tree — for iterating the genlock core DURING an event.
# The full Windows artifact (browser/CEF + DistroAV + installer layout) is
# windows-genlock.yml (~1-2.5 h); this builds just obs.dll in minutes for a hot DLL
# swap. obs.dll is ABI-compatible with the already-deployed distroav.dll because the
# #136 change is libobs-INTERNAL (a static function + a branch — no obs_source_frame
# layout change, no new public API). Manual dispatch; deploy off-air with a kept
# fallback + the one-click desktop revert.
#
# camera-box #101: this workflow now ALSO carries a PRE-MERGE compile gate for the
# vendored DistroAV C++ (the `distroav-compile-check` job below). The per-PR ci.yml is
# Rust-only and the libobs `build` job above compiles ONLY libobs, so a C++ compile
# error in the vendored DistroAV tree (ndi-source.cpp / ndi-output.cpp / the burn
# filter / plugin-main.cpp — the #97 forward-ref class) used to pass every push-to-dev
# gate and reach main, where only the manual 150-min windows-genlock.yml caught it
# (wasting a full build cycle). The compile-check configures + builds the DistroAV
# plugin against an installed libobs/obs-frontend-api SDK prefix with the CEF/browser
# dependency OFF, so it stays minutes-not-hours yet compiles the same vendored C++ the
# production build does. This repo gates merges via push-to-dev (it deliberately omits
# `pull_request` per #157), so push-to-dev IS the pre-merge gate.

on:
  workflow_dispatch:
  # camera-box #136/#101: also fire on a dev push that touches the vendored OBS or
  # DistroAV tree, so (a) a hot obs.dll build is available WITHOUT first merging the
  # workflow to the default branch (GitHub only lets workflow_dispatch run from the
  # default branch), and (b) the DistroAV compile gate runs pre-merge on any vendored
  # C++ change — including a DistroAV-only change, which the old libobs-only path
  # (`vendor/obs-studio/libobs/**`) silently skipped.
  push:
    branches: [dev]
    paths:
      - 'vendor/obs-studio/**'
      - 'vendor/distroav/**'
      - '.github/workflows/windows-genlock-fast.yml'

permissions:
  contents: read

concurrency:
  group: windows-genlock-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Fail fast (before the configure/build) if the #136 patch is missing — mirrors
      # the Linux-CI guard tests/genlock_preload.rs::vendored_source::
      # timestamp_aligned_release_present.
      - name: Assert genlock timestamp-aligned release patch present (#136)
        shell: pwsh
        run: |
          $src = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          # #257: ts-align + render tick are build defaults (always on, no env).
          if ($src -match [regex]::Escape('getenv("OBS_GENLOCK_TS_ALIGN")')) { Write-Error "OBS_GENLOCK_TS_ALIGN env is BACK — #257 made ts-align a build default"; exit 1 }
          $vid = (Get-Content "vendor/obs-studio/libobs/obs-video.c" -Raw) -replace '\s+', ' '
          if ($vid -match [regex]::Escape('getenv("OBS_GENLOCK_WALL_CLOCK")')) { Write-Error "OBS_GENLOCK_WALL_CLOCK env is BACK — #257 made the render tick a build default"; exit 1 }
          if ($src -notmatch [regex]::Escape('genlock_ts_align_enabled() || source->genlock_latency_ms > 0')) { Write-Error "ts-align release gate gone (#136/#245)"; exit 1 }
          if ($src -notmatch [regex]::Escape('genlock_is_wallclock_ts(next_frame->timestamp)')) { Write-Error "wall-clock guard gone (#136)"; exit 1 }
          if ($src -notmatch [regex]::Escape('wall_now = genlock_wall_now_ns();')) { Write-Error "wall-clock source (genlock_wall_now_ns -> wall_now) gone (#136)"; exit 1 }
          if ($src -notmatch [regex]::Escape('genlock_present_ts(wall_now, preload, interval)')) { Write-Error "present_ts gone (#136)"; exit 1 }
          # #147: the backward wall-clock step (NTP/PTP sawtooth) re-anchor guard — without it
          # the ts-align release FREEZES the program feed forever on a backward clock step.
          # #269 [3]: detection on the MAX queued ts (depth-independent, uniform across sources).
          if ($src -notmatch [regex]::Escape('max_ts > wall_now + interval')) { Write-Error "backward-clock-step detection gone (#147/#269) — ts-align would freeze the program feed on an NTP/PTP step"; exit 1 }
          if ($src -notmatch [regex]::Escape('source->genlock_backward_steps++')) { Write-Error "backward-step re-anchor counter gone (#147)"; exit 1 }
          # #269 [2]: per-event latch — counter fires once per step, not per recovery tick.
          if ($src -notmatch [regex]::Escape('source->genlock_in_backward_step = true')) { Write-Error "backward-step per-event latch gone (#269 [2]) — counter would over-report"; exit 1 }
          Write-Output "#136/#257 ts-align + render tick build-default (no env) + #147 backward-step recovery present — OK"

      # #249: the fast path builds obs.dll from the real vendored source, so a `git subtree pull`
      # (#44) that reverts #245 to inert-but-still-compiling would hot-swap an INERT obs.dll un-gated
      # (the #235 regression: latency collapsed to one GLOBAL env knob, no per-source override). The
      # slow windows-genlock.yml gained this #245 gate in #248; mirror it here so the fast path fails
      # at the same token check rather than shipping an inert DLL. Pure source-text guard (no build) —
      # mirrors tests/genlock_preload.rs::vendored_source (probe-gated, can't compile on this runner).
      - name: Assert per-source genlock latency (ms) override present (#245)
        shell: pwsh
        run: |
          $obs = (Get-Content "vendor/obs-studio/libobs/obs-source.c" -Raw) -replace '\s+', ' '
          if ($obs -notmatch [regex]::Escape('void obs_source_set_genlock_latency_ms(obs_source_t *source, uint32_t')) {
            Write-Error "obs-source.c: obs_source_set_genlock_latency_ms missing — #245 per-source latency API reverted"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('source->genlock_latency_ms > 0 ? source->genlock_latency_ms : genlock_reserve_ms()')) {
            Write-Error "obs-source.c: the per-source latency release-deadline gate is gone — #245 override inert in the render path"; exit 1
          }
          if ($obs -notmatch [regex]::Escape('#define GENLOCK_SOURCE_LATENCY_MS_MAX 2000')) {
            Write-Error "obs-source.c: GENLOCK_SOURCE_LATENCY_MS_MAX no longer 2000 — #245 per-source cap reverted"; exit 1
          }
          $api = (Get-Content "vendor/obs-studio/libobs/obs.h" -Raw) -replace '\s+', ' '
          if ($api -notmatch [regex]::Escape('EXPORT void obs_source_set_genlock_latency_ms(obs_source_t *source, uint32_t')) {
            Write-Error "obs.h: obs_source_set_genlock_latency_ms not EXPORTed — #245 DistroAV cannot resolve the setter"; exit 1
          }
          $ndi = (Get-Content "vendor/distroav/src/ndi-source.cpp" -Raw) -replace '\s+', ' '
          if ($ndi -notmatch [regex]::Escape('obs_properties_add_int(props, PROP_GENLOCK_LATENCY_MS_SRC')) {
            Write-Error "ndi-source.cpp: the editable per-source latency int field is gone — #245 reverted"; exit 1
          }
          if ($ndi -notmatch [regex]::Escape('obs_source_set_genlock_latency_ms')) {
            Write-Error "ndi-source.cpp: ndi_source_update no longer applies obs_source_set_genlock_latency_ms — #245 field inert"; exit 1
          }
          # #257: build-const latency floor 3 + genlock default-ON + hard-whitelist UI + runtime burn.
          if ($obs -notmatch [regex]::Escape('#define GENLOCK_LATENCY_MS_MIN 3')) { Write-Error "obs-source.c: GENLOCK_LATENCY_MS_MIN no longer 3 — #257 floor reverted"; exit 1 }
          if ($obs -notmatch [regex]::Escape('#define GENLOCK_LATENCY_MS_DEFAULT 3')) { Write-Error "obs-source.c: GENLOCK_LATENCY_MS_DEFAULT no longer 3 — #257 build-const reverted"; exit 1 }
          if ($obs -notmatch [regex]::Escape('ms < GENLOCK_LATENCY_MS_MIN ? GENLOCK_LATENCY_MS_MIN')) { Write-Error "obs-source.c: setter no longer floors at 3 (#257)"; exit 1 }
          if ($obs -notmatch [regex]::Escape('void obs_source_set_genlock_burn(obs_source_t *source, bool')) { Write-Error "obs-source.c: obs_source_set_genlock_burn missing — #257 runtime burn API reverted"; exit 1 }
          if ($api -notmatch [regex]::Escape('EXPORT void obs_source_set_genlock_burn(obs_source_t *source, bool')) { Write-Error "obs.h: obs_source_set_genlock_burn not EXPORTed — #257 DistroAV cannot resolve the burn setter"; exit 1 }
          if ($ndi -match [regex]::Escape('apply_genlock_lockdown_visibility')) { Write-Error "ndi-source.cpp: apply_genlock_lockdown_visibility is BACK — #257 hard whitelist replaced it"; exit 1 }
          if ($ndi -notmatch [regex]::Escape('GENLOCK_WHITELIST_PROPS')) { Write-Error "ndi-source.cpp: GENLOCK_WHITELIST_PROPS gone — #257 hard-lock UI reverted"; exit 1 }
          if ($ndi -notmatch [regex]::Escape('obs_data_set_default_bool(settings, PROP_GENLOCK_FIFO, true)')) { Write-Error "ndi-source.cpp: genlock no longer default-ON — #257 reverted"; exit 1 }
          if ($ndi -notmatch [regex]::Escape('obs_source_set_genlock_burn')) { Write-Error "ndi-source.cpp: ndi_source_update no longer applies obs_source_set_genlock_burn — #257 burn inert"; exit 1 }
          $flt = (Get-Content "vendor/distroav/src/ndi-burn-filter.cpp" -Raw) -replace '\s+', ' '
          if ($flt -match [regex]::Escape('getenv("OBS_BURN')) { Write-Error "ndi-burn-filter.cpp: OBS_BURN_* env is BACK — #257 made the burn a per-source bool"; exit 1 }
          if ($flt -notmatch [regex]::Escape('obs_source_get_genlock_burn')) { Write-Error "ndi-burn-filter.cpp: burn no longer reads the parent genlock_burn flag — #257 reverted"; exit 1 }
          Write-Output "per-source genlock latency (ms) override + #257 floor 3 + genlock default-ON + whitelist UI + runtime burn — OK"

      # #276/#275 (the #269 YAML lock-step): the FAST path COMPILES libobs (obs.dll) + the
      # DistroAV burn, so a `git subtree pull` reverting either to inert-but-still-compiling
      # would hot-swap a regressed obs.dll/distroav un-gated. Re-assert the tokens in pwsh
      # (mirrors tests/genlock_preload.rs::{vendored_source,distroav_source} — probe-gated,
      # can't compile on this runner). OBSProjector.cpp is frontend-only (the fast path does
      # NOT build it) but the source-text check still catches a revert.
      - name: Assert #276 multiview render-divisor + #275 bulk-fill burn present
        shell: pwsh
        run: |
          $disp = (Get-Content "vendor/obs-studio/libobs/obs-display.c" -Raw) -replace '\s+', ' '
          if ($disp -notmatch [regex]::Escape('display->render_divisor > 1 && (display->frame_counter++ % display->render_divisor) != 0')) { Write-Error "obs-display.c: #276 render-divisor frame-skip gate gone — the multiview would steal the 60fps program budget"; exit 1 }
          if ($disp -notmatch [regex]::Escape('void obs_display_set_render_divisor(obs_display_t *display, uint32_t divisor)')) { Write-Error "obs-display.c: #276 obs_display_set_render_divisor impl gone"; exit 1 }
          $api = (Get-Content "vendor/obs-studio/libobs/obs.h" -Raw) -replace '\s+', ' '
          if ($api -notmatch [regex]::Escape('EXPORT void obs_display_set_render_divisor(obs_display_t *display, uint32_t divisor)')) { Write-Error "obs.h: #276 obs_display_set_render_divisor not EXPORTed — frontend cannot link it"; exit 1 }
          $proj = (Get-Content "vendor/obs-studio/frontend/widgets/OBSProjector.cpp" -Raw) -replace '\s+', ' '
          if ($proj -notmatch [regex]::Escape('if (isMultiview) obs_display_set_render_divisor(GetDisplay(), 2)')) { Write-Error "OBSProjector.cpp: #276 multiview no longer sets render_divisor=2 — the heavy multiview render runs every frame"; exit 1 }
          $bqr = (Get-Content "vendor/distroav/src/burn-qr.hpp" -Raw) -replace '\s+', ' '
          if ($bqr -notmatch [regex]::Escape('std::memset(row, 0xFF,')) { Write-Error "burn-qr.hpp: #275 bulk-fill (per-row white memset) gone — burn render reverted to the slow per-pixel path that overran the 60fps budget"; exit 1 }
          Write-Output "#276 multiview render-divisor decouple + #275 bulk-fill burn render present — OK"

      # Same configure as the full build (downloads the obs-deps bundle the preset
      # pins); we just build a single target afterwards.
      - name: Configure OBS (windows-x64 preset)
        working-directory: vendor/obs-studio
        shell: bash
        run: >
          cmake --preset windows-x64
          '-DOBS_VERSION_OVERRIDE=32.1.2'
          -DENABLE_WHATSNEW=OFF
          -DENABLE_AJA=OFF
          -DENABLE_VLC=OFF
          -DENABLE_TEST_INPUT=OFF

      # Build ONLY libobs (the core lib = obs.dll). Skips CEF/browser, the Qt
      # frontend, and all plugins — the bulk of the full build — so this finishes in
      # minutes. libobs is self-contained (it is the base every other target links),
      # so its obs.dll is complete and swap-valid on its own.
      - name: Build ONLY libobs (obs.dll)
        working-directory: vendor/obs-studio
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --target libobs --parallel

      - name: Stage obs.dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse vendor/obs-studio/build_x64 -Filter obs.dll |
                 Where-Object { $_.FullName -notmatch 'CMakeFiles' } | Select-Object -First 1
          if (!$dll) { Write-Error "obs.dll not found after the libobs build"; exit 1 }
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item $dll.FullName stage/
          git rev-parse HEAD | Out-File stage/GENLOCK_BUILD_SHA.txt -Encoding ascii
          Write-Output "staged obs.dll from: $($dll.FullName)"

      # #120: the hot-swap obs.dll also ships with a per-component SHA manifest, so even an
      # event-time DLL swap is auditable against #121's post-deploy verify (the same generator the
      # full windows-genlock.yml bundle uses — logic unit-proven on the Linux `test` job).
      - name: Generate per-component SHA manifest (#120)
        shell: bash
        run: scripts/genlock-manifest.sh --stage stage --out stage/BUNDLE_MANIFEST.json

      - name: Assert bundle manifest self-consistent (#120)
        shell: bash
        run: scripts/genlock-manifest.sh --check stage/BUNDLE_MANIFEST.json --stage stage

      - name: Upload obs.dll
        uses: actions/upload-artifact@v4
        with:
          name: obs-genlock-fast-dll
          path: stage/
          if-no-files-found: error

  # camera-box #101: the PRE-MERGE compile gate for the vendored DistroAV C++.
  #
  # ci.yml is Rust-only and the libobs `build` job above compiles only libobs, so a C++
  # compile error in the vendored DistroAV plugin slipped through every push-to-dev gate
  # to main and was caught only by the manual 150-min windows-genlock.yml. This job
  # configures + builds the DistroAV plugin against an installed libobs/obs-frontend-api
  # SDK prefix (exactly as the production build does, vendor/distroav links
  # OBS::libobs + OBS::obs-frontend-api) — but with the CEF/browser dependency OFF, the
  # bulk of the full build, so it stays minutes-not-hours. It is a COMPILE check, not the
  # production bundle: it builds no installer and uploads no artifact. It fails the
  # push-to-dev run (the pre-merge gate) on any C++ error in the vendored OBS/DistroAV
  # tree, so #97's forward-ref class can never again reach main.
  distroav-compile-check:
    name: Vendored OBS/DistroAV C++ compile gate (#101)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Fail fast, before the configure/build, if the newest vendored DistroAV C++
      # surfaces are missing — so a dropped patch fails here cheaply rather than after a
      # long configure. Mirrors the source guards in windows-genlock.yml.
      - name: Assert vendored DistroAV C++ sources present
        shell: pwsh
        run: |
          foreach ($f in @(
            "vendor/distroav/src/ndi-source.cpp",
            "vendor/distroav/src/ndi-output.cpp",
            "vendor/distroav/src/ndi-burn-filter.cpp",
            "vendor/distroav/src/plugin-main.cpp",
            "vendor/distroav/CMakeLists.txt"
          )) {
            if (!(Test-Path $f)) { Write-Error "vendored DistroAV source missing: $f (#101)"; exit 1 }
          }
          $cm = (Get-Content "vendor/distroav/CMakeLists.txt" -Raw) -replace '\s+', ' '
          if ($cm -notmatch [regex]::Escape('ndi-burn-filter.cpp')) {
            Write-Error "CMakeLists.txt: ndi-burn-filter.cpp not in target_sources — it would not compile into the gate (#101)"; exit 1
          }
          Write-Output "vendored DistroAV C++ sources present — OK"

      # Configure the vendored OBS exactly like the production build (same preset, same
      # disable flags), but with ENABLE_BROWSER=OFF: the CEF/browser download + build is
      # the bulk of the 150-min full build and is not needed to compile-check the
      # vendored C++. bash quoting is exact — pwsh would split -DNAME=32.1.2 at the dots.
      - name: Configure OBS (windows-x64 preset, browser OFF for the compile gate)
        working-directory: vendor/obs-studio
        shell: bash
        run: >
          cmake --preset windows-x64
          '-DOBS_VERSION_OVERRIDE=32.1.2'
          -DENABLE_BROWSER=OFF
          -DENABLE_WHATSNEW=OFF
          -DENABLE_AJA=OFF
          -DENABLE_VLC=OFF
          -DENABLE_TEST_INPUT=OFF

      # Build OBS (all default targets) so `cmake --install` finds every artifact its
      # global install rules reference (libobs, the d3d11/opengl graphics backends, the
      # frontend, obs-frontend-api). A target-narrowed build (libobs + obs-frontend-api
      # only) makes the install step fail looking for libobs-d3d11.dll etc. — the bulk
      # cost we cut is CEF/browser (ENABLE_BROWSER=OFF in the configure above), NOT the
      # graphics backends, which are small and required for the SDK install DistroAV
      # links against. This mirrors windows-genlock.yml's `cmake --build build_x64`
      # minus CEF, so it stays minutes-not-hours yet produces a complete, installable SDK.
      - name: Build OBS (browser OFF — graphics backends + libobs + frontend-api)
        working-directory: vendor/obs-studio
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      - name: Install OBS SDK prefix
        working-directory: vendor/obs-studio
        shell: bash
        run: cmake --install build_x64 --config RelWithDebInfo --prefix "$GITHUB_WORKSPACE/obs-sdk"

      # Configure DistroAV against the genlock-patched OBS SDK — identical to the
      # production windows-genlock.yml configure step.
      - name: Configure DistroAV against the genlocked OBS
        working-directory: vendor/distroav
        shell: bash
        run: >
          cmake -B build_x64 -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/obs-sdk"
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      # THE compile check: build the DistroAV plugin. This compiles the vendored
      # ndi-source.cpp / ndi-output.cpp / ndi-burn-filter.cpp / plugin-main.cpp etc. —
      # the C++ a forward-ref / missing-include / signature error lives in. A compile
      # error fails this push-to-dev run (the pre-merge gate) instead of reaching main.
      - name: Compile-check DistroAV (build the plugin)
        working-directory: vendor/distroav
        shell: bash
        run: cmake --build build_x64 --config RelWithDebInfo --parallel

      - name: Compile gate passed
        shell: bash
        run: |
          echo "#101 vendored OBS/DistroAV C++ compiled clean - pre-merge gate green."
