name: Release

# Publishes the GitHub Release vX.Y.Z with the camera-box binary + sha256 (issue 1476).
#
# Two ways in:
#   * workflow_call from ci.yml's `release` job, right after its `release-tag` job pushed vX.Y.Z on
#     the dev->main merge commit. This is the normal path: a tag pushed with the default
#     GITHUB_TOKEN never starts another workflow run (GitHub's anti-recursion rule), so a plain
#     `push: tags` trigger would never fire for it.
#   * push of a v* tag by a person (a manual or re-issued release).
# On the workflow_call path the release carries the EXACT binary the caller run built, gated and
# deployed (its `camera-box-linux-amd64` artifact: a called workflow shares the caller's run, so
# its artifacts are downloadable here), never a second build with another sha256. Only a manual
# tag push builds from the tag. Either way the binary must report the tag's version.
on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: "The release tag to publish (vX.Y.Z), already pushed"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binary:
    name: Build Binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The build needs the -dev headers; the call path only runs --version (libasound).
      - name: Install dependencies
        env:
          CALL_TAG: ${{ inputs.tag }}
        run: |
          sudo apt-get update
          if [ -n "${CALL_TAG}" ]; then
            sudo apt-get install -y libasound2
          else
            sudo apt-get install -y libv4l-dev libasound2-dev nasm  # nasm: issue 1387, the jxs feature
          fi

      # workflow_call (ci.yml's release job): the caller run's gated + deployed build.
      - name: Download the caller run's camera-box build
        if: inputs.tag != ''
        uses: actions/download-artifact@v4
        with:
          name: camera-box-linux-amd64
          path: target/release

      # A manual tag push: build from the tag.
      - name: Install Rust
        if: inputs.tag == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        if: inputs.tag == ''
        run: cargo build --release --features jxs

      - name: The binary reports the tag's version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x target/release/camera-box
          got="$(target/release/camera-box --version | awk '{print $NF}')"
          echo "tag ${TAG}, camera-box --version ${got}"
          if [ "v${got}" != "${TAG}" ]; then
            echo "::error::the binary built from ${TAG} reports ${got} -- refusing to publish it under ${TAG}"
            exit 1
          fi

      - name: Create tarball
        run: |
          mkdir -p dist
          cp target/release/camera-box dist/
          cp systemd/camera-box.service dist/
          tar -czvf camera-box-linux-amd64.tar.gz -C dist .

      - name: Generate SHA256
        run: sha256sum camera-box-linux-amd64.tar.gz > camera-box-linux-amd64.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binary
          path: |
            camera-box-linux-amd64.tar.gz
            camera-box-linux-amd64.tar.gz.sha256

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-binary
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: release-binary
          path: ./artifacts

      - name: Copy install scripts
        run: |
          cp scripts/install.sh ./artifacts/
          cp scripts/install-binary.sh ./artifacts/

      # Re-running on an existing release updates its assets (the ci.yml tag step accepts its own
      # re-run as EXISTS), so a cancelled or failed publish is finished by a plain re-run.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          # Only the per-merge release becomes Latest; a re-issued older tag pushed by hand never
          # takes Latest from the newest release.
          make_latest: ${{ inputs.tag != '' }}
          files: |
            artifacts/camera-box-linux-amd64.tar.gz
            artifacts/camera-box-linux-amd64.tar.gz.sha256
            artifacts/install.sh
            artifacts/install-binary.sh
          generate_release_notes: true
